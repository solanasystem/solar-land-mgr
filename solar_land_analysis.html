  ctr.bindPopup('<div style="min-width:225px;font-size:12px;line-height:1.7"><b style="color:'+cc+'">&#9728; 合筆・低圧太陽光候補</b><br><b>'+(c.city||'-')+'</b>　'+c.n+'筆→<b>'+c.total+'㎡</b>　<span style="color:#93c5fd">'+zlabel(c.zone)+'</span><br><span style="color:#93c5fd">AI空き見込み：min放棄 <b>'+(c.minp!=null?c.minp:'-')+'</b>／mean '+(c.meanp!=null?c.meanp:'-')+'</b></span><div style="display:flex;gap:5px;margin-top:9px"><a href="'+gm+'" target="_blank" style="flex:1;text-align:center;padding:5px;border:1px solid #1a73e8;background:#0b2447;color:#8ab4f8;border-radius:5px;font-size:11px;text-decoration:none">&#127760;地図</a><a href="'+sv+'" target="_blank" style="flex:1;text-align:center;padding:5px;border:1px solid #16a34a;background:#0b2e1a;color:#86efac;border-radius:5px;font-size:11px;text-decoration:none">&#128694;SV</a><a href="'+e3+'" target="_blank" style="flex:1;text-align:center;padding:5px;border:1px solid #16a34a;background:#0b2e1a;color:#86efac;border-radius:5px;font-size:11px;text-decoration:none">&#127758;Earth</a></div><button onclick="delCluster('+c.id+')" style="margin-top:9px;width:100%;padding:6px 8px;border:1px solid #B71C1C;background:#3a1414;color:#ff8a80;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">&#128465; 合筆NG（この'+c.n+'筆を一括削除）</button></div>',{maxWidth:285,minWidth:235});
  layers.push(ctr);_cl[c.id]=layers;});
 try{map.fitBounds(group.getBounds().pad(0.08));}catch(e){}updSeen();}
function setZone(z){zoneFilter=z;['zAll','zC','zN'].forEach(function(i){document.getElementById(i).classList.remove('on');});document.getElementById(z==='control'?'zC':z==='noncontrol'?'zN':'zAll').classList.add('on');render();}
async function boot(){var t=0;while(!(window.__auth&&window.__auth.sb)&&t<100){await new Promise(function(r){setTimeout(r,50);});t++;}
 var sb=window.__auth&&window.__auth.sb;
 if(sb){try{var allf=[];F.forEach(function(c){c.mem.forEach(function(m){allf.push(m[3]);});});var del={};
   for(var i=0;i<allf.length;i+=200){var r=await sb.from('farmland_ng_list').select('feature_id').in('feature_id',allf.slice(i,i+200));(r.data||[]).forEach(function(x){del[x.feature_id]=1;});}
   F=F.filter(function(c){return !c.mem.some(function(m){return del[m[3]];});});}catch(e){console.warn('ng',e);}}
 render();}
boot();
window.delCluster=async function(id){var c=F.filter(function(x){return x.id===id;})[0];if(!c)return;
 if(!confirm('この合筆（'+c.n+'筆・'+c.total+'㎡）をNGにします。構成する'+c.n+'筆すべてを削除します。よろしいですか？'))return;
 var sb=window.__auth&&window.__auth.sb;if(!sb){toast('認証エラー：ログインしてください',false);return;}
 var _sn={};var recs=[];c.mem.forEach(function(m){if(!_sn[m[3]]){_sn[m[3]]=1;recs.push({feature_id:m[3],ng_reason:'manual_gappitsu_reject',lat:m[0],lng:m[1]});}}); // feature_id重複除去(ON CONFLICT二重更新エラー防止)
 try{var r=await sb.from('farmland_ng_list').upsert(recs,{onConflict:'feature_id'});if(r.error)throw r.error;
  (_cl[id]||[]).forEach(function(l){try{group.removeLayer(l);}catch(e){}});map.closePopup();
  F=F.filter(function(x){return x.id!==id;});setCounts();updSeen();toast(c.n+'筆を合筆NGで削除しました（復元可）',true);
 }catch(e){toast('削除失敗: '+((e&&e.message)||e),false);}};
// ➕追加候補: 地図確認中に見つけた新候補をクリックで記録(case_candidates)。取り逃がし防止。
var addMode=false;var _addLayer=L.layerGroup().addTo(map);
function toggleAdd(){addMode=!addMode;var b=document.getElementById('addBtn');if(b)b.classList.toggle('on',addMode);
 try{document.getElementById('map').style.cursor=addMode?'crosshair':'';}catch(e){}
 toast(addMode?'追加候補モードON：地図をクリックで記録':'追加候補モードOFF',true);}
map.on('click',async function(e){
 if(!addMode)return;
 var memo=window.prompt('追加候補として記録します。メモ(任意・用途/所感など):','');
 if(memo===null)return;
 var sb=window.__auth&&window.__auth.sb;if(!sb){toast('認証エラー：ログインしてください',false);return;}
 try{
  var r=await sb.from('case_candidates').insert({organization_id:'00000000-0000-0000-0000-000000000001',
    latitude:e.latlng.lat,longitude:e.latlng.lng,source:'pc_click',source_page:'solar_land_analysis',
    accuracy:null,memo:(memo||'追加候補(太陽光土地分析)'),status:'new'}).select();
  if(r.error)throw r.error;
  L.circleMarker([e.latlng.lat,e.latlng.lng],{radius:8,color:'#ffffff',weight:2.5,fillColor:'#f59e0b',fillOpacity:.98})
    .addTo(_addLayer).bindPopup('&#9995; 追加候補：'+(memo||'')).openPopup();
  toast('追加候補に記録しました（案件候補に保存）',true);
 }catch(err){toast('記録失敗: '+((err&&err.message)||err),false);}
});
</script></body></html>
