<!DOCTYPE html>
<!-- BUILD: client-select v20260810a / MODE SELECTの前段=クライアント最上位階層。選択したclientを全下流にスコープ(混線防止) -->
<html lang="ja">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLIENT SELECT // GRID LAND MGR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600;1,9..144,700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common-auth.js?v=20260813kuroki"></script>
<style>
  :root{
    --void:#020817;--abyss:#060e26;--deep:#0c1733;--steel:#15203d;--line:#2a3a5c;--line2:#3a4d75;
    --plasma:#00d4ff;--charge:#10ffb3;--voltage:#a78bfa;--ice:#7dd3fc;--mint:#34d399;--rose:#f472b6;--coral:#fb923c;--gold:#f59e0b;
    --text:#eef2ff;--muted:#8492b3;
    --display:'Syne','Zen Kaku Gothic New',sans-serif;--display-serif:'Fraunces','Zen Kaku Gothic New',serif;
    --jp:'Zen Kaku Gothic New',sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--void);color:var(--text);font-family:var(--jp);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  .bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .bg-grid{background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);}
  .bg-glow1{background:radial-gradient(circle at 18% 0%,rgba(0,212,255,0.16),transparent 50%);}
  .bg-glow2{background:radial-gradient(circle at 82% 100%,rgba(167,139,250,0.12),transparent 55%);}
  .bg-vignette{background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,0.65) 100%);}
  .topbar{position:relative;z-index:10;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(7,10,19,0.95),rgba(7,10,19,0.7));backdrop-filter:blur(8px);padding:0 28px;height:64px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;}
  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--plasma) 20%,var(--plasma) 80%,transparent);opacity:0.6;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:38px;height:38px;background:linear-gradient(135deg,var(--plasma),#0891b2);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;color:var(--void);box-shadow:0 0 20px rgba(0,212,255,0.5);}
  .brand-text{font-family:var(--display);font-style:italic;font-weight:700;font-size:18px;letter-spacing:0.1em;line-height:1;}
  .brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:0.3em;color:var(--plasma);margin-top:4px;text-transform:uppercase;}
  .clock{font-family:var(--mono);font-style:italic;font-size:14px;letter-spacing:0.12em;color:var(--plasma);text-shadow:0 0 8px rgba(0,212,255,0.5);justify-self:end;}
  main{position:relative;z-index:2;max-width:1160px;margin:0 auto;padding:44px 28px 40px;}
  .title-block{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:34px;position:relative;}
  .title-block::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--plasma),transparent 30%);}
  .title-marker{font-family:var(--mono);font-style:italic;font-size:11px;letter-spacing:0.3em;color:var(--plasma);padding:6px 10px;border:1px solid var(--plasma);background:rgba(0,212,255,0.06);display:inline-block;}
  .title-main{font-family:var(--display-serif);font-style:italic;font-weight:600;font-size:clamp(38px,6.5vw,74px);letter-spacing:0;line-height:0.92;margin-top:16px;}
  .title-main .accent{color:var(--plasma);font-weight:700;}
  .title-jp{font-family:var(--jp);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0.35em;margin-top:12px;}
  .clients{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .client{position:relative;background:linear-gradient(180deg,var(--deep),var(--abyss));border:1px solid var(--line);overflow:hidden;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);cursor:pointer;min-height:190px;padding:24px 26px;display:flex;flex-direction:column;}
  .client::before,.client::after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--accent);transition:all 0.3s;}
  .client::before{top:8px;left:8px;border-right:none;border-bottom:none;}
  .client::after{bottom:8px;right:8px;border-left:none;border-top:none;}
  .client:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 0 0 1px var(--accent),0 14px 44px rgba(0,0,0,0.6),0 0 60px var(--accent-glow);}
  .client:hover::before,.client:hover::after{width:22px;height:22px;}
  .client.c-sun{--accent:var(--gold);--accent-glow:rgba(245,158,11,0.22);}
  .client.c-own{--accent:var(--mint);--accent-glow:rgba(52,211,153,0.22);}
  .client.c-new{--accent:var(--voltage);--accent-glow:rgba(167,139,250,0.20);border-style:dashed;}
  .c-badge{font-family:var(--mono);font-size:10px;letter-spacing:0.25em;color:var(--accent);text-transform:uppercase;}
  .c-name{font-family:var(--jp);font-weight:900;font-size:26px;letter-spacing:0.02em;margin-top:10px;line-height:1.15;}
  .c-en{font-family:var(--mono);font-style:italic;font-size:11px;letter-spacing:0.28em;color:var(--accent);text-transform:uppercase;margin-top:6px;}
  .c-desc{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:14px;flex:1;}
  .c-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;}
  .c-stat{font-family:var(--display-serif);font-style:italic;font-weight:600;font-size:30px;color:var(--accent);line-height:1;}
  .c-stat small{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--muted);letter-spacing:0.2em;display:block;margin-top:4px;}
  .c-go{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:0.1em;}
  .c-glyph{position:absolute;right:-14px;bottom:-30px;font-size:150px;font-family:var(--display);font-style:italic;color:var(--accent);opacity:0.05;line-height:1;pointer-events:none;user-select:none;}
  .foot{margin-top:32px;font-family:var(--mono);font-style:italic;font-size:10px;letter-spacing:0.15em;color:var(--muted);text-align:center;}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  .client{animation:slideUp 0.5s cubic-bezier(0.4,0,0.2,1) both;opacity:0;}
  .client:nth-child(1){animation-delay:0.08s;}.client:nth-child(2){animation-delay:0.16s;}.client:nth-child(3){animation-delay:0.24s;}
  @media(max-width:820px){.clients{grid-template-columns:1fr;}.topbar{padding:12px 16px;height:auto;}main{padding:30px 16px 40px;}}
</style>
</head>
<body>
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-glow1"></div>
<div class="bg-layer bg-glow2"></div>
<div class="bg-layer bg-vignette"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">G</div>
    <div><div class="brand-text">GRID LAND</div><div class="brand-sub">MGR // CLIENT LAYER</div></div>
  </div>
  <div></div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <div class="title-block">
    <div class="title-marker">// CLIENT SELECT</div>
    <h1 class="title-main">SELECT <span class="accent">CLIENT</span></h1>
    <div class="title-jp">クライアントを選択 ・ 選んだクライアントの世界だけが下流に流れます</div>
  </div>

  <div class="clients" id="clients"><div style="color:#8492b3;grid-column:1/-1">クライアントを読込中…</div></div>

  <div class="foot">選択したクライアントは全下流（MODE SELECT・各ツール）にスコープされ、他クライアント・他地域と物理的に混ざりません。</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var db=supabase.createClient('https://fygnrjjifoasozbhkxlk.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5Z25yamppZm9hc296YmhreGxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDYzNTEsImV4cCI6MjA5MDE4MjM1MX0.A1fAMcu7wGBBP4xHUKkrExIuy7MFbmarAtLQahwZiso');
function pick(id,name){
  try{
    localStorage.setItem('glm_client', id);
    localStorage.setItem('glm_client_name', name);
  }catch(e){}
  // 自社=内部フル(MODE SELECT) / クライアント=搭載機能だけのポータル
  location.href = (id==='own') ? 'mode-select.html' : 'client-portal.html';
}
function esc(v){return (v==null)?'':String(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function slugOf(c){var n=c.name||'';if(/SUN|サントラスト|トラスト/i.test(n))return 'suntrust';if(/黒木/.test(n))return 'kurogi';return c.id;}
async function loadClients(){
  var grid=document.getElementById('clients');
  var cs=await db.from('clients').select('id,name,business_type,notes').order('created_at',{ascending:true});
  var clients=(cs&&cs.data)||[];
  var cards='';
  for(var i=0;i<clients.length;i++){
    var c=clients[i], slug=slugOf(c);
    var cnt='—';
    try{ var q=await db.from('client_delivery_items').select('id',{count:'exact',head:true}).eq('status','confirmed').eq('client_id',c.id); cnt=(q&&typeof q.count==='number')?q.count:'—'; }catch(e){}
    var init=(c.name||'?').replace(/株式会社/,'').trim().charAt(0)||'C';
    cards+='<div class="client c-sun" onclick="pick(\''+esc(slug)+'\',\''+esc(c.name)+'\')">'+
      '<div class="c-glyph">'+esc(init)+'</div>'+
      '<div class="c-badge">Client / '+esc(c.business_type||'再エネ')+'</div>'+
      '<div class="c-name">'+esc(c.name)+'</div>'+
      '<div class="c-desc">'+esc(c.notes||'確定納品をこの世界で管理。対象地域・確定納品のみを扱う。')+'</div>'+
      '<div class="c-foot"><div class="c-stat">'+cnt+'<small>確定納品</small></div><div class="c-go">選択 ▸</div></div>'+
    '</div>';
  }
  // 自社（内部・固定）
  cards+='<div class="client c-own" onclick="pick(\'own\',\'自社（Grid Land MGR）\')">'+
    '<div class="c-glyph">O</div><div class="c-badge">Internal / 自社開拓</div><div class="c-name">自社（Grid Land MGR）</div>'+
    '<div class="c-en">// OWN OPERATION</div>'+
    '<div class="c-desc">自社の全国探索・全機能（トラッカー・AI判定・sourcing）。社内用の探索エンジン。クライアントには見せない層。</div>'+
    '<div class="c-foot"><div class="c-stat">ALL<small>全機能・全地域</small></div><div class="c-go">選択 ▸</div></div></div>';
  // 新規クライアント → 顧客管理へ
  cards+='<div class="client c-new" onclick="location.href=\'client-management.html\'">'+
    '<div class="c-glyph">+</div><div class="c-badge">Add / 顧客管理</div><div class="c-name">＋ 新規クライアント</div>'+
    '<div class="c-en">// NEW TERRITORY PARTNER</div>'+
    '<div class="c-desc">エリアを分割し、テリトリーを持つ再エネ事業者を開拓・登録。顧客管理／機能マトリクスで設定します。</div>'+
    '<div class="c-foot"><div class="c-stat" style="font-size:20px">'+clients.length+'<small>登録クライアント</small></div><div class="c-go">顧客管理 ▸</div></div></div>';
  grid.innerHTML=cards;
}
loadClients();
function pad(n){return String(n).padStart(2,'0');}
function tick(){var d=new Date();var el=document.getElementById('clock');if(el)el.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
tick();setInterval(tick,1000);
</script>
</body>
</html>
