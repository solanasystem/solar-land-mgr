<!DOCTYPE html>
<!-- BUILD: client-portal v20260810a / クライアント用ポータル。client-functions.jsのconfigから"搭載機能だけ"を表示(探索エンジンは非搭載=物理的に見えない) -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIENT PORTAL // GRID LAND MGR</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:ital,wght@0,600;0,700;1,600;1,700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="client-functions.js?v=20260810b"></script>
<style>
  :root{--void:#020817;--abyss:#060e26;--deep:#0c1733;--line:#2a3a5c;--plasma:#00d4ff;--gold:#f59e0b;--text:#eef2ff;--muted:#8492b3;
    --display:'Syne','Zen Kaku Gothic New',sans-serif;--serif:'Fraunces','Zen Kaku Gothic New',serif;--jp:'Zen Kaku Gothic New',sans-serif;--mono:'JetBrains Mono',monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--void);color:var(--text);font-family:var(--jp);min-height:100vh;overflow-x:hidden;}
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);}
  .bg2{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 18% 0%,rgba(245,158,11,0.10),transparent 50%),radial-gradient(circle at 82% 100%,rgba(0,212,255,0.10),transparent 55%);}
  .top{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(7,10,19,0.95),rgba(7,10,19,0.7));}
  .brand{display:flex;align-items:center;gap:12px;}
  .bm{width:36px;height:36px;background:linear-gradient(135deg,var(--plasma),#0891b2);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:var(--display);color:var(--void);font-weight:700;}
  .bt{font-family:var(--display);font-style:italic;font-weight:700;letter-spacing:0.1em;}
  .bs{font-family:var(--mono);font-size:9px;letter-spacing:0.3em;color:var(--gold);}
  .rt{display:flex;gap:10px;align-items:center;}
  .cchip{display:flex;gap:8px;align-items:center;padding:7px 13px;border:1px solid var(--gold);border-radius:5px;color:var(--gold);font-weight:700;font-size:13px;}
  .cchip small{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.2em;}
  a.sw{color:var(--plasma);text-decoration:none;font-size:12px;border:1px solid var(--line);padding:7px 12px;border-radius:5px;}
  main{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:40px 28px 60px;}
  .tb{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:30px;}
  .tm{font-family:var(--mono);font-style:italic;font-size:11px;letter-spacing:0.3em;color:var(--gold);border:1px solid var(--gold);padding:6px 10px;display:inline-block;background:rgba(245,158,11,0.06);}
  h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(34px,5.5vw,60px);line-height:0.95;margin-top:16px;}
  h1 .a{color:var(--gold);}
  .jp{color:var(--muted);font-size:14px;letter-spacing:0.3em;margin-top:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .fn{position:relative;background:linear-gradient(180deg,var(--deep),var(--abyss));border:1px solid var(--line);border-radius:12px;padding:22px 22px 20px;text-decoration:none;color:var(--text);transition:all 0.25s;overflow:hidden;display:block;}
  .fn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.5);}
  .fn.off{opacity:0.55;cursor:default;}
  .fn .ic{font-size:34px;}
  .fn .nm{font-weight:900;font-size:19px;margin-top:10px;}
  .fn .ds{color:var(--muted);font-size:12.5px;line-height:1.7;margin-top:8px;min-height:44px;}
  .fn .go{font-family:var(--mono);font-size:12px;font-weight:700;margin-top:14px;letter-spacing:0.08em;}
  .fn .ready{color:var(--accent);}
  .fn .soon{color:var(--muted);}
  .fn::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0.8;}
  .foot{margin-top:34px;font-family:var(--mono);font-style:italic;font-size:10px;letter-spacing:0.12em;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="bg"></div><div class="bg2"></div>
<div class="top">
  <div class="brand"><div class="bm">G</div><div><div class="bt">GRID LAND</div><div class="bs">CLIENT PORTAL</div></div></div>
  <div class="rt">
    <div class="cchip"><small>CLIENT</small><span id="cname">—</span></div>
    <a class="sw" href="client-select.html">⇄ 切替</a>
  </div>
</div>
<main>
  <div class="tb">
    <div class="tm">// CLIENT PORTAL</div>
    <h1>納品<span class="a">ポータル</span></h1>
    <div class="jp" id="jpline">ご利用可能な機能</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot">— この画面には、御社に提供する機能のみが搭載されています —</div>
</main>
<script>
(function(){
  var id=localStorage.getItem('glm_client')||'';
  var name=localStorage.getItem('glm_client_name')||'クライアント';
  document.getElementById('cname').textContent=name;
  var CF=window.CLIENT_FUNCTIONS||{registry:{},clients:{}};
  // 自社(own)はここに来ない想定。来たらMODE SELECTへ。
  if(id==='own'){ location.replace('mode-select.html'); return; }
  var keys=(CF.clients&&CF.clients[id])||[];
  document.getElementById('jpline').textContent=name+' 様 ・ ご利用可能な機能（'+keys.length+'）';
  var grid=document.getElementById('grid');
  if(!keys.length){ grid.innerHTML='<div style="color:#8492b3">この客先の搭載機能が未設定です（client-functions.jsで定義）。</div>'; return; }
  keys.forEach(function(k){
    var f=CF.registry[k]; if(!f)return;
    var el=document.createElement(f.ready?'a':'div');
    el.className='fn'+(f.ready?'':' off');
    el.style.setProperty('--accent',f.accent||'#00d4ff');
    if(f.ready){ el.href=f.url; }
    el.innerHTML='<div class="ic">'+f.icon+'</div><div class="nm">'+f.label+'</div><div class="ds">'+f.desc+'</div>'+
      (f.ready?'<div class="go ready">開く ▸</div>':'<div class="go soon">準備中</div>');
    grid.appendChild(el);
  });
})();
</script>
</body>
</html>
