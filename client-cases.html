<!DOCTYPE html>
<!-- BUILD: client-cases v20260810a / クライアント専用:納品案件のステータス管理。SUNトラスト自身がステータスを追加/編集(client_status_options)し各案件に適用(case_proposals)。※自社の共有ページには一切依存しない -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>納品案件・ステータス管理 // GRID LAND MGR</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="client-functions.js?v=20260817a"></script>
<style>
  :root{--void:#050b1a;--panel:#0d1730;--panel2:#12203f;--line:#26375c;--plasma:#00d4ff;--gold:#f59e0b;--mint:#34d399;--rose:#f472b6;--text:#eaf0ff;--muted:#8698bd;--jp:'Zen Kaku Gothic New',sans-serif;--mono:'JetBrains Mono',monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--void);color:var(--text);font-family:var(--jp);min-height:100vh;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#081124,#050b1a);}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:0.1em;font-size:15px;} .brand b{color:var(--plasma);}
  .cchip{display:flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--gold);border-radius:5px;color:var(--gold);font-size:13px;font-weight:700;}
  .cchip small{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.2em;}
  a.back{color:var(--plasma);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:6px 12px;border-radius:5px;}
  main{max-width:1180px;margin:0 auto;padding:26px 24px 60px;}
  h1{font-size:22px;font-weight:900;letter-spacing:0.04em;}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .bar{display:flex;gap:12px;align-items:center;margin:16px 0;flex-wrap:wrap;}
  .btn{padding:10px 18px;border-radius:8px;border:2px solid var(--gold);background:rgba(245,158,11,0.08);color:var(--gold);font-size:14px;font-weight:800;cursor:pointer;}
  .btn.mint{border-color:var(--mint);background:#06331f;color:#7ef0b6;}
  .cnt{font-family:var(--mono);color:var(--gold);font-size:14px;margin-left:auto;}
  .tblwrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:64vh;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;white-space:nowrap;}
  th{background:var(--panel2);color:var(--muted);font-weight:700;position:sticky;top:0;font-size:11px;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  select.st{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;font-family:var(--jp);cursor:pointer;}
  .pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:800;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:520px;width:92%;max-height:86vh;overflow:auto;}
  .modal h2{font-size:16px;color:var(--gold);margin-bottom:12px;}
  .opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .opt-row input[type=text]{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px;}
  .opt-row input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;}
  .opt-del{border:1px solid var(--rose);color:var(--rose);background:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:800;}
  .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .mbtn{padding:9px 18px;border-radius:7px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);}
  .mbtn.save{border-color:var(--mint);background:#06331f;color:#7ef0b6;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d2a1a;border:1px solid var(--mint);color:#a7f3d0;padding:12px 20px;border-radius:8px;font-weight:700;display:none;z-index:200;}
  .muted{color:var(--muted);font-size:12px;}
  .cnav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--line);background:#0a1326;}
  .cnav-i{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;padding:7px 14px;border:1px solid var(--line);border-radius:7px;}
  .cnav-i:hover{color:var(--text);border-color:var(--plasma);}
  .cnav-i.on{color:var(--gold);border-color:var(--gold);background:rgba(245,158,11,0.08);}
</style>
</head>
<body>
<div class="top">
  <div class="brand">GRID LAND <b>MGR</b> // 納品案件・ステータス管理</div>
  <div style="display:flex;gap:12px;align-items:center;">
    <div class="cchip"><small>CLIENT</small> <span id="cname">—</span></div>
    <a class="back" href="client-portal.html">◀ ポータル</a>
    <a class="back" href="client-select.html">⇄ 切替</a>
  </div>
</div>
<nav class="cnav" id="cnav"></nav>
<main>
  <h1>📋 納品案件・ステータス管理</h1>
  <div class="sub">御社の確定納品案件に、<b>御社独自のステータス</b>を付けて管理できます。ステータスは御社で自由に追加・編集できます。</div>
  <div class="bar">
    <button class="btn" onclick="openStatusConfig()">⚙ ステータスを設定（追加・編集）</button>
    <span class="cnt" id="cnt">—</span>
  </div>
  <div class="tblwrap"><table id="tbl"><thead><tr><th style="width:48px;text-align:right">NO</th><th>市</th><th>地番</th><th>面積(㎡)</th><th>地目</th><th>区域</th><th>住所</th><th>緯度</th><th>経度</th><th>確認</th><th>備考</th><th>ステータス</th></tr></thead><tbody id="tb"><tr><td colspan="12" class="muted">読込中…</td></tr></tbody></table></div>
</main>

<!-- ステータス設定モーダル -->
<div class="modal-bg" id="cfgBg">
  <div class="modal">
    <h2>⚙ ステータス設定（御社が管理）</h2>
    <div class="muted" style="margin-bottom:12px">御社の運用に合わせてステータスを追加・編集・削除できます。保存後、各案件のプルダウンに反映されます。</div>
    <div id="optList"></div>
    <button class="mbtn" style="margin-top:6px" onclick="addOpt()">＋ ステータスを追加</button>
    <div class="mbtns">
      <button class="mbtn" onclick="closeStatusConfig()">キャンセル</button>
      <button class="mbtn save" onclick="saveStatusConfig()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var SB_URL='https://fygnrjjifoasozbhkxlk.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5Z25yamppZm9hc296YmhreGxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDYzNTEsImV4cCI6MjA5MDE4MjM1MX0.A1fAMcu7wGBBP4xHUKkrExIuy7MFbmarAtLQahwZiso';
var db=supabase.createClient(SB_URL,SB_KEY);
var CLIENT_NAME=localStorage.getItem('glm_client_name')||'株式会社SUNトラスト';
document.getElementById('cname').textContent=CLIENT_NAME;
var CID=null, ROWS=[], OPTS=[], STMAP={};
var DEFAULT_OPTS=[{label:'未確認',color:'#8698bd'},{label:'検討中',color:'#f59e0b'},{label:'現地確認済',color:'#00d4ff'},{label:'採用',color:'#34d399'},{label:'却下',color:'#f472b6'},{label:'契約',color:'#a78bfa'}];

function buildClientNav(current){
  try{
    var cid=localStorage.getItem('glm_client')||'suntrust';
    var CF=window.CLIENT_FUNCTIONS; if(!CF||!CF.clients) return;
    var keys=CF.clients[cid]||[];
    var items=[{label:'🏠 ポータル',url:'client-portal.html'}];
    keys.forEach(function(k){var f=CF.registry[k]; if(f&&f.ready&&f.url&&f.url!=='#') items.push({label:(f.icon||'')+' '+f.label,url:f.url});});
    var nav=document.getElementById('cnav'); if(!nav) return;
    nav.innerHTML=items.map(function(it){var on=(it.url===current)?' on':''; return '<a class="cnav-i'+on+'" href="'+it.url+'">'+it.label+'</a>';}).join('');
  }catch(e){}
}
buildClientNav('client-cases.html');
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},2600);}
function colorOf(label){var o=OPTS.filter(function(x){return x.label===label;})[0];return o?o.color:'#8698bd';}

async function init(){
  try{ var c=await db.from('clients').select('id,name').ilike('name','%'+CLIENT_NAME.replace('株式会社','')+'%').limit(1); if(c&&c.data&&c.data.length)CID=c.data[0].id; }catch(e){}
  if(!CID){ document.getElementById('tb').innerHTML='<tr><td colspan="12" class="muted">クライアントを特定できませんでした</td></tr>'; return; }
  await loadOpts();
  await loadStatuses();
  await loadRows();
}
async function loadOpts(){
  try{ var r=await db.from('client_status_options').select('options').eq('client_id',CID).limit(1);
    OPTS=(r&&r.data&&r.data[0]&&r.data[0].options&&r.data[0].options.length)?r.data[0].options:DEFAULT_OPTS.slice();
  }catch(e){ OPTS=DEFAULT_OPTS.slice(); }
}
async function loadStatuses(){
  STMAP={};
  try{ var r=await db.from('case_proposals').select('case_id,status').eq('client_id',CID);
    if(r&&r.data)r.data.forEach(function(x){STMAP[x.case_id]=x.status;});
  }catch(e){}
}
function cityOf(r){
  if(r.city) return r.city;
  var a=r.address||'';
  var m=a.match(/(?:都|道|府|県)(.+?[市区町村])/);
  if(m) return m[1];
  return r.pref||'—';
}
async function loadRows(){
  try{ var r=await db.from('client_delivery_items').select('id,pref,city,chiban,area_m2,chimoku,zone,address,lat,lng,ai_note').eq('client_id',CID).eq('status','confirmed').order('address',{ascending:true});
    ROWS=(r&&r.data)||[];
  }catch(e){ ROWS=[]; }
  renderRows();
}
function renderRows(){
  var tb=document.getElementById('tb');
  document.getElementById('cnt').textContent=ROWS.length+'件';
  if(!ROWS.length){ tb.innerHTML='<tr><td colspan="12" class="muted">確定納品案件がありません</td></tr>'; return; }
  tb.innerHTML=ROWS.map(function(r,i){
    var cur=STMAP[r.id]||'';
    var sel='<select class="st" onchange="setStatus(\''+r.id+'\',this.value)"><option value="">（未設定）</option>'+
      OPTS.map(function(o){return '<option value="'+o.label+'"'+(o.label===cur?' selected':'')+'>'+o.label+'</option>';}).join('')+'</select>';
    var pill=cur?'<span class="pill" style="background:'+colorOf(cur)+'22;color:'+colorOf(cur)+';border:1px solid '+colorOf(cur)+'">'+cur+'</span> ':'';
    var note=r.ai_note||'';
    var flag='';
    if(/要合筆/.test(note)) flag='<span class="pill" style="background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b">要合筆</span>';
    /* 要確認フラグは削除(2026-08-11 栗本さん指示: クライアントに不要な不安を与えるだけで無意味) */
    var lat=(r.lat!=null?Number(r.lat).toFixed(6):'—'), lng=(r.lng!=null?Number(r.lng).toFixed(6):'—');
    return '<tr title="'+(note.replace(/"/g,'')||'')+'"><td style="text-align:right;color:#8698bd;font-family:var(--mono)">'+(i+1)+'</td><td>'+cityOf(r)+'</td><td>'+(r.chiban||'—')+'</td><td>'+(r.area_m2!=null?Math.round(r.area_m2):'—')+'</td><td>'+(r.chimoku||'—')+'</td><td>'+(r.zone||'—')+'</td><td style="white-space:normal;max-width:300px">'+(r.address||'—')+'</td><td style="font-family:var(--mono);font-size:11px">'+lat+'</td><td style="font-family:var(--mono);font-size:11px">'+lng+'</td><td>'+(flag||'—')+'</td><td style="white-space:normal;max-width:260px;font-size:11px;color:#8698bd">'+(note||'—')+'</td><td>'+pill+sel+'</td></tr>';
  }).join('');
}
async function setStatus(itemId,status){
  try{
    var ex=await db.from('case_proposals').select('id').eq('case_id',itemId).eq('client_id',CID).limit(1);
    if(ex&&ex.data&&ex.data.length){ await db.from('case_proposals').update({status:status,decided_at:new Date().toISOString()}).eq('id',ex.data[0].id); }
    else{ await db.from('case_proposals').insert({case_id:itemId,client_id:CID,status:status}); }
    STMAP[itemId]=status; renderRows(); toast('ステータスを保存しました');
  }catch(e){ toast('保存失敗: '+((e&&e.message)||e)); }
}

// ===== ステータス設定モーダル =====
var editOpts=[];
function openStatusConfig(){ editOpts=OPTS.map(function(o){return {label:o.label,color:o.color};}); renderOptList(); document.getElementById('cfgBg').style.display='flex'; }
function closeStatusConfig(){ document.getElementById('cfgBg').style.display='none'; }
function renderOptList(){
  var box=document.getElementById('optList');
  box.innerHTML=editOpts.map(function(o,i){
    return '<div class="opt-row"><input type="color" value="'+(o.color||'#8698bd')+'" onchange="editOpts['+i+'].color=this.value"><input type="text" value="'+String(o.label||'').replace(/"/g,'&quot;')+'" placeholder="ステータス名" oninput="editOpts['+i+'].label=this.value"><button class="opt-del" onclick="delOpt('+i+')">削除</button></div>';
  }).join('');
}
function addOpt(){ editOpts.push({label:'',color:'#00d4ff'}); renderOptList(); }
function delOpt(i){ editOpts.splice(i,1); renderOptList(); }
async function saveStatusConfig(){
  var opts=editOpts.filter(function(o){return (o.label||'').trim();}).map(function(o){return {label:o.label.trim(),color:o.color||'#8698bd'};});
  if(!opts.length){ toast('ステータスを1つ以上入れてください'); return; }
  try{
    var ex=await db.from('client_status_options').select('id').eq('client_id',CID).limit(1);
    if(ex&&ex.data&&ex.data.length){ await db.from('client_status_options').update({options:opts,updated_at:new Date().toISOString()}).eq('id',ex.data[0].id); }
    else{ await db.from('client_status_options').insert({client_id:CID,options:opts}); }
    OPTS=opts; renderRows(); closeStatusConfig(); toast('ステータス設定を保存しました');
  }catch(e){ toast('保存失敗（テーブル未作成かも）: '+((e&&e.message)||e)); }
}
init();
</script>
</body>
</html>
