<!DOCTYPE html>
<!-- BUILD: farmland-label v20260804e / 🌍Earth斜めを地盤標高(GSI)込みで筆へ近接(300d/tilt55)=0aで別広域が出る不具合を解消。＋クリック地点を確実に使うため、地点未選択で地図/SV/Earthを押したら警告(赤丸誤爆防止)。前:v20260804d / 🐛ハンティング時、パネルの地図/SV/Earthボタンが"赤丸(最初のキュー候補)"しか開かず、クリック地点に追随しない不具合を修正。ボタンをopenMaps()経由=curFocus(ハンティング中はクリック点)に統一。キー(G/V/E)と同挙動に。前:v20260804c / 🌍E=Google Earth斜め3D(tilt65°)キー＋パネルリンク追加(両モード)。真上では平地に見える土手/法面/山道の斜面を、地形に写真を貼った立体で確認可。草丈はSV(V)補完。前:v20260804b / ⌨️G=Google地図/V=ストリートビュー キー追加(両モード。ハンティング=クリック点or地図中心、キュー=現候補を開く)。ハンティング中ヒントにもG/V明記。前:v20260804a / 🎯ハンティングモード追加(キーH)。地図の任意地点を自由クリック→1放棄/2耕作/3既設で座標タグ→専用表 land_label_hunt に保存(本番候補表を汚さない)。①〜⑤候補に縛られず「ありとあらゆる放棄地」を正例収集＋近くの耕作地をハードネガティブとして対収集(能動学習)。既存の採集点は色ドットで地図表示・0で直前取消。要SQL: CREATE TABLE land_label_hunt(id bigserial pk, lat/lng double precision, land_label text, area_sqm double, note text, created_at timestamptz default now()) + RLS authenticated全許可。前:v20260803c / 🔧「次へ進まない」根治。tag()を同期化し保存(await)より先に必ずidx++→show()で進行、保存はsaveLabel()に分離しtry/catch(失敗で進行を止めない)。JSエラー/未処理rejectを画面上部の赤バーに表示(errbar/window.onerror)。show()にmap.invalidateSize再適用＋「N件目」表示(pIdx)。前:v20260803b / 🔧マップが広域のままで筆が拡大表示されず「次へ進まない様に見える」不具合を修正。show()にmap.invalidateSize()＋Number()変換＋確実なsetView(zoom18)を追加、init時にもinvalidateSize。1件ごとにその筆へ拡大センタリングされ、判定→次へが視認可能に。前:v20260803a / -->
<!-- BUILD: farmland-label v20260803a / 🏷️耕作放棄 教師データ ラベル付けツール。①〜⑤通過候補を1件ずつEsri高解像度衛星で表示→キー1〜4で高速タグ(放棄/耕作中/既設/スキップ)→farmland_snapshots.land_labelへ保存。CNN分類器の学習データ作成用。要: land_label列(ALTER TABLE ... ADD COLUMN land_label text)。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耕作放棄ラベル付け - GRID LAND MGR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="common-auth.js?v=20260522a"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:system-ui,'Segoe UI',sans-serif;background:#0b0f14;color:#e5e7eb;overflow:hidden}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;background:rgba(11,15,20,0.92);border:1px solid #334155;border-radius:10px;padding:12px 14px}
  #top{top:10px;left:10px;max-width:340px}
  #top h1{font-size:14px;margin-bottom:6px}
  .prog{font-size:12px;color:#94a3b8;margin-bottom:8px}
  .prog b{color:#67e8f9;font-size:16px;font-variant-numeric:tabular-nums}
  .info{font-size:12px;line-height:1.7}
  .info .k{color:#94a3b8;display:inline-block;width:64px}
  .links{margin-top:8px;display:flex;gap:8px}
  .links a{flex:1;text-align:center;font-size:11px;text-decoration:none;padding:4px;border-radius:5px;border:1px solid #1a73e8;background:#0b2447;color:#8ab4f8}
  #btns{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
  .lbl{border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;min-width:150px;text-align:center}
  .lbl .kx{display:block;font-size:10px;opacity:.8;font-weight:600}
  .b-ab{background:#16a34a} .b-cu{background:#b45309} .b-dev{background:#334155} .b-sk{background:#475569}
  .lbl.small{min-width:auto;padding:12px 12px;font-size:13px}
  #undo{background:#7f1d1d}
  #done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(11,15,20,0.95);z-index:2000;text-align:center}
  #hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:12px;color:#94a3b8;z-index:1000}
  .flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1500;font-size:40px;font-weight:900;opacity:0;transition:opacity .1s;pointer-events:none;text-shadow:0 2px 12px #000}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="top">
  <h1>🏷️ 耕作放棄 ラベル付け <span style="font-size:10px;color:#64748b">v20260804e</span></h1>
  <div class="prog">タグ済 <b id="pDone">0</b> ／ 未タグ候補 <span id="pTotal">…</span>　（このセッション <span id="pSes">0</span>）</div>
  <div class="prog" style="margin-top:-4px">この市の進捗: <b id="pIdx" style="color:#fbbf24">–</b></div>
  <div style="margin:8px 0">
    <button id="huntBtn" onclick="toggleHunt()" style="width:100%;border:1px solid #0891b2;background:#0e2a33;color:#67e8f9;border-radius:8px;padding:7px;font-size:13px;font-weight:800;cursor:pointer">🎯 ハンティングモード: OFF <span style="font-weight:400;font-size:10px;color:#64748b">(キー H)</span></button>
    <div id="huntStat" style="display:none;font-size:11px;color:#94a3b8;margin-top:5px">採集 🌿放棄 <b id="hAb" style="color:#4ade80">0</b> ／ 🌾耕作 <b id="hCu" style="color:#f59e0b">0</b> ／ ☀既設 <b id="hDev" style="color:#cbd5e1">0</b></div>
  </div>
  <div style="margin-bottom:8px"><label style="font-size:11px;color:#94a3b8">市町村: </label>
    <select id="citySel" onchange="applyCity()" style="background:#1f2937;color:#e5e7eb;border:1px solid #334155;border-radius:5px;padding:3px 6px;font-size:12px;max-width:220px"><option value="">（読込中）</option></select></div>
  <div class="info" id="pInfo">読込中…</div>
  <div class="links" id="pLinks"></div>
</div>
<div class="flash" id="flash"></div>
<div id="errbar" style="display:none;position:absolute;top:0;left:0;right:0;z-index:3000;background:#7f1d1d;color:#fff;padding:8px 12px;font-size:13px;font-weight:700;text-align:center"></div><div id="hint">キー: <b>1</b>放棄　<b>2</b>耕作中　<b>3</b>既設(ソーラー/建物)　<b>4</b>スキップ　<b>0/Backspace</b>戻る　｜　<b>H</b>ハンティング</div>
<div class="panel" id="btns">
  <button class="lbl b-ab" onclick="tag('abandoned')">🌿 耕作放棄<span class="kx">1</span></button>
  <button class="lbl b-cu" onclick="tag('cultivated')">🌾 耕作中<span class="kx">2</span></button>
  <button class="lbl b-dev" onclick="tag('developed')">☀ 既設 ソーラー/建物<span class="kx">3</span></button>
  <button class="lbl b-sk small" onclick="tag('skip')">❓ 不明/スキップ<span class="kx">4</span></button>
  <button class="lbl small" id="undo" onclick="undo()">⏪ 戻る<span class="kx">0</span></button>
</div>
<div id="done"><div style="font-size:22px;font-weight:800">✅ 未タグの候補は以上です</div><div style="margin-top:8px;color:#94a3b8">お疲れさまでした。分類器の学習に進めます。</div></div>

<script>
var SB=null, map=null, marker=null, esri=null, queue=[], idx=0, doneCount=0, sesCount=0, labelHist=[];
var allCands=[], ngSet={};
var LABELS={abandoned:'🌿耕作放棄',cultivated:'🌾耕作中',developed:'☀既設',skip:'❓スキップ'};
// ハンティングモード（地図の任意地点を自由にタグ→land_label_huntへ座標保存）
var huntMode=false, huntPending=null, huntMarker=null, huntLayer=null, huntHist=[], huntCount={abandoned:0,cultivated:0,developed:0};
var HDOT={abandoned:'#22c55e',cultivated:'#f59e0b',developed:'#cbd5e1'};
var defaultHint='キー: <b>1</b>放棄　<b>2</b>耕作中　<b>3</b>既設　<b>4</b>スキップ　<b>0</b>戻る　｜　<b>G</b>地図　<b>V</b>SV　<b>E</b>Earth斜め　<b>H</b>ハンティング';
window.addEventListener('DOMContentLoaded',init);

async function init(){
  if(!window.__auth||!window.__auth.sb){document.getElementById('pInfo').textContent='認証エラー（ログインしてください）';return;}
  SB=window.__auth.sb;
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([34.68,135.83],18);
  esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19}).addTo(map);
  setTimeout(function(){map.invalidateSize();},150);
  window.addEventListener('resize',function(){map.invalidateSize();});
  document.addEventListener('keydown',function(e){
    if(e.key==='h'||e.key==='H'){toggleHunt();return;}
    if(e.key==='g'||e.key==='G'){openMaps('map');return;}
    if(e.key==='v'||e.key==='V'){openMaps('sv');return;}
    if(e.key==='e'||e.key==='E'){openMaps('earth');return;}
    if(e.key==='1')tag('abandoned'); else if(e.key==='2')tag('cultivated');
    else if(e.key==='3')tag('developed'); else if(e.key==='4')tag('skip');
    else if(e.key==='0'||e.key==='Backspace'){e.preventDefault();undo();}
  });
  map.on('click',onMapClick);
  await loadQueue();
  loadHunt();
}
function showHint(html){var h=document.getElementById('hint');if(h)h.innerHTML=html;}
// 今見ている地点（ハンティング=クリック点or地図中心／キュー=現候補）をGoogle地図/SVで開く
function curFocus(){
  if(huntMode){ if(huntPending)return[huntPending.lat,huntPending.lng]; var c=map.getCenter();return[c.lat,c.lng]; }
  var q=queue[idx]; if(q&&q.lat&&q.lng)return[Number(q.lat),Number(q.lng)];
  var c2=map.getCenter();return[c2.lat,c2.lng];
}
function openMaps(kind){
  if(huntMode&&!huntPending){showErr('先に地図で地点をクリックしてから 地図/SV/Earth を押してください（クリックすると水色リング＋「選択地点」表示）');return;}
  var ll=curFocus(),la=ll[0],ln=ll[1];
  if(kind==='earth'){
    // 斜め3D。地盤標高(GSI)を look-at 高度に入れて、その筆へ近接(約300m・tilt55°)。0aだとEarthがカメラを引いて別の広域を映す不具合の対策。
    var w=window.open('about:blank','_blank');
    var eurl=function(a){return 'https://earth.google.com/web/@'+la+','+ln+','+a+'a,300d,35y,0h,55t,0r';};
    var go=function(a){var u=eurl(a); if(w){w.location.href=u;}else{window.open(u,'_blank','noopener');}};
    try{
      fetch('https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon='+ln+'&lat='+la+'&outtype=JSON')
        .then(function(r){return r.json();})
        .then(function(j){var e=(j&&j.elevation!=null&&j.elevation!=='-----')?Number(j.elevation):120; go(isNaN(e)?120:e);})
        .catch(function(){go(120);});
    }catch(_){go(120);}
    return;
  }
  var url=(kind==='sv')?('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+la+','+ln)
                       :('https://www.google.com/maps/search/?api=1&query='+la+','+ln);
  window.open(url,'_blank','noopener');
}

async function loadQueue(){
  document.getElementById('pInfo').textContent='候補・除外リストを読込中…';
  // 除外リスト(手動NG含む=五條/大淀の目視済みもここ)
  var ng=[], f2=0;
  while(true){var rr=await SB.from('farmland_ng_list').select('feature_id').order('feature_id',{ascending:true}).range(f2,f2+999); if(rr.error)break; var d=rr.data||[]; ng=ng.concat(d); if(d.length<1000)break; f2+=1000;}
  ngSet={}; ng.forEach(function(x){ngSet[x.feature_id]=true;});
  // ①〜⑤通過 かつ 未ラベル
  var all=[], from=0;
  while(true){
    var res=await SB.from('farmland_snapshots')
      .select('id,feature_id,lat,lng,area_sqm,city,city_planning_zone,shading_status')
      .eq('source_type','emaff_solar').eq('hazard_status','CLEAR').eq('noshin_status','CLEAR').eq('dedup_status','NEW')
      .neq('grid_status','ng').neq('infra_status','FAIL').or('shading_status.is.null,shading_status.neq.NG')
      .is('land_label',null).order('feature_id',{ascending:true}).range(from,from+999);
    if(res.error){document.getElementById('pInfo').textContent='取得失敗: '+res.error.message;return;}
    var rows=res.data||[]; all=all.concat(rows);
    if(rows.length<1000)break; from+=1000;
  }
  var seen={};
  allCands=all.filter(function(r){if(seen[r.feature_id])return false;seen[r.feature_id]=true;return r.lat&&r.lng&&!ngSet[r.feature_id];});
  var byCity={}; allCands.forEach(function(r){var c=r.city||'(不明)'; byCity[c]=(byCity[c]||0)+1;});
  var cities=Object.keys(byCity).sort(function(a,b){return byCity[b]-byCity[a];});
  var sel=document.getElementById('citySel');
  sel.innerHTML='<option value="">全市町村 ('+allCands.length.toLocaleString()+')</option>'+
    cities.map(function(c){return '<option value="'+c.replace(/"/g,'')+'">'+c+' ('+byCity[c]+')</option>';}).join('');
  applyCity();
}
function applyCity(){
  var city=document.getElementById('citySel').value;
  queue = city ? allCands.filter(function(r){return (r.city||'(不明)')===city;}) : allCands.slice();
  document.getElementById('pTotal').textContent=queue.length.toLocaleString();
  document.getElementById('done').style.display='none';
  idx=0; labelHist=[]; show();
}

function show(){
  if(idx>=queue.length){document.getElementById('done').style.display='flex';return;}
  var c=queue[idx];
  var la=Number(c.lat), ln=Number(c.lng);
  map.invalidateSize();
  map.setView([la,ln],18,{animate:false});
  if(marker)map.removeLayer(marker);
  marker=L.circleMarker([la,ln],{radius:11,color:'#f43f5e',weight:3,fillColor:'#f43f5e',fillOpacity:0.3}).addTo(map);
  setTimeout(function(){map.invalidateSize();map.setView([la,ln],18,{animate:false});},60);
  var pi=document.getElementById('pIdx'); if(pi)pi.textContent=(idx+1)+' / '+queue.length+' 件目';
  var zone={control:'市街化調整',urbanization:'市街化区域',non_zoned:'非線引',outside:'区域外'}[c.city_planning_zone]||'—';
  document.getElementById('pInfo').innerHTML=
    '<div><span class="k">市町村</span>'+(c.city||'—')+'</div>'+
    '<div><span class="k">面積</span>'+(c.area_sqm?Math.round(c.area_sqm)+'㎡':'—')+'</div>'+
    '<div><span class="k">区域</span>'+zone+'</div>'+
    '<div><span class="k">ID</span><span style="font-size:10px">'+c.feature_id+'</span></div>';
  document.getElementById('pLinks').innerHTML=
    '<a href="#" onclick="openMaps(\'map\');return false;">🌐 地図</a>'+
    '<a href="#" onclick="openMaps(\'sv\');return false;">🚶 SV</a>'+
    '<a href="#" onclick="openMaps(\'earth\');return false;" style="border-color:#16a34a;background:#0b2e1a;color:#86efac">🌍 Earth斜め</a>';
}

function flash(txt,color){var f=document.getElementById('flash');f.textContent=txt;f.style.color=color;f.style.opacity='1';setTimeout(function(){f.style.opacity='0';},250);}
function showErr(m){var e=document.getElementById('errbar');if(e){e.textContent=String(m);e.style.display='block';setTimeout(function(){e.style.display='none';},7000);}try{console.warn(m);}catch(_){}}
window.onerror=function(msg,src,l){showErr('JSエラー: '+msg+' (行'+l+')');};
window.addEventListener('unhandledrejection',function(ev){showErr('保存エラー: '+((ev.reason&&ev.reason.message)||ev.reason));});

function tag(label){
  if(huntMode){tagHunt(label);return;}
  // ①まず確実に次へ進める（保存の失敗で進行を止めない）
  if(!queue||!queue.length){showErr('候補が空です。市町村を選び直してください。');return;}
  if(idx>=queue.length){document.getElementById('done').style.display='flex';return;}
  var c=queue[idx];
  labelHist.push({idx:idx,fid:c.feature_id,label:label});
  idx++; sesCount++; doneCount++;
  var pd=document.getElementById('pDone'); if(pd)pd.textContent=doneCount.toLocaleString();
  var ps=document.getElementById('pSes'); if(ps)ps.textContent=sesCount.toLocaleString();
  flash(LABELS[label]||label,{abandoned:'#4ade80',cultivated:'#f59e0b',developed:'#94a3b8',skip:'#64748b'}[label]||'#fff');
  show();
  // ②保存は非同期・失敗しても進行は止めない
  saveLabel(c,label);
}
async function saveLabel(c,label){
  try{
    var r=await SB.from('farmland_snapshots').update({land_label:label}).eq('feature_id',c.feature_id);
    if(r.error)throw r.error;
    if(label==='cultivated'||label==='developed'){
      await SB.from('farmland_ng_list').upsert({feature_id:c.feature_id,ng_reason:'label_'+label,lat:c.lat,lng:c.lng,updated_at:new Date().toISOString()},{onConflict:'feature_id'});
    }
  }catch(e){showErr('保存失敗('+c.feature_id+'): '+((e&&e.message)||e));}
}

async function undo(){
  if(huntMode){return undoHunt();}
  if(!labelHist.length)return;
  var h=labelHist.pop();
  idx=h.idx; sesCount=Math.max(0,sesCount-1); doneCount=Math.max(0,doneCount-1);
  document.getElementById('pDone').textContent=doneCount.toLocaleString();
  document.getElementById('pSes').textContent=sesCount.toLocaleString();
  document.getElementById('done').style.display='none';
  show();
  await SB.from('farmland_snapshots').update({land_label:null}).eq('feature_id',h.fid);
  if(h.label==='cultivated'||h.label==='developed'){
    await SB.from('farmland_ng_list').delete().eq('feature_id',h.fid).like('ng_reason','label_%');
  }
}
// ===== ハンティングモード =====
function toggleHunt(){
  huntMode=!huntMode;
  var b=document.getElementById('huntBtn'), st=document.getElementById('huntStat');
  if(huntMode){
    b.innerHTML='🎯 ハンティングモード: <span style="color:#4ade80">ON</span> <span style="font-weight:400;font-size:10px;color:#64748b">(キー H)</span>';
    b.style.background='#0e3a2a'; b.style.borderColor='#16a34a';
    if(st)st.style.display='block';
    if(huntLayer)huntLayer.addTo(map);
    showHint('🎯 <b>耕作放棄地</b>をクリック→<b>1</b>。近くの<b>耕作地</b>をクリック→<b>2</b>（対で集めると精度UP）｜ <b>G</b>地図 <b>V</b>SV <b>E</b>Earth斜め ｜ <b>0</b>取消 ｜ <b>H</b>終了');
  }else{
    b.innerHTML='🎯 ハンティングモード: OFF <span style="font-weight:400;font-size:10px;color:#64748b">(キー H)</span>';
    b.style.background='#0e2a33'; b.style.borderColor='#0891b2';
    huntPending=null; if(huntMarker){map.removeLayer(huntMarker);huntMarker=null;}
    if(huntLayer)map.removeLayer(huntLayer);
    showHint(defaultHint);
  }
}
function onMapClick(e){
  if(!huntMode)return;
  huntPending={lat:e.latlng.lat,lng:e.latlng.lng};
  if(huntMarker)map.removeLayer(huntMarker);
  huntMarker=L.circleMarker([huntPending.lat,huntPending.lng],{radius:13,color:'#22d3ee',weight:3,fillColor:'#22d3ee',fillOpacity:0.25}).addTo(map);
  var pinf=document.getElementById('pInfo'); if(pinf)pinf.innerHTML='<div><span class="k">選択地点</span>'+huntPending.lat.toFixed(6)+', '+huntPending.lng.toFixed(6)+'</div><div style="color:#67e8f9;font-size:11px;margin-top:2px">🎯 1/2/3で登録・G/V/Eでこの点を確認</div>';
  showHint('この地点を  <b>1</b>🌿放棄  <b>2</b>🌾耕作  <b>3</b>☀既設  で登録　｜　<b>G</b>地図 <b>V</b>SV <b>E</b>Earth斜め で確認（別の場所をクリックで位置変更）');
}
function updateHuntStat(){
  var a=document.getElementById('hAb'),c=document.getElementById('hCu'),d=document.getElementById('hDev');
  if(a)a.textContent=huntCount.abandoned||0; if(c)c.textContent=huntCount.cultivated||0; if(d)d.textContent=huntCount.developed||0;
}
function tagHunt(label){
  if(label==='skip'){huntPending=null; if(huntMarker){map.removeLayer(huntMarker);huntMarker=null;} return;}
  if(!huntPending){showErr('先に地図で地点をクリックしてください');return;}
  var p={lat:huntPending.lat,lng:huntPending.lng,label:label};
  huntPending=null; if(huntMarker){map.removeLayer(huntMarker);huntMarker=null;}
  var dot=L.circleMarker([p.lat,p.lng],{radius:6,color:'#000',weight:1,fillColor:(HDOT[label]||'#fff'),fillOpacity:0.95}).addTo(huntLayer);
  huntCount[label]=(huntCount[label]||0)+1; updateHuntStat();
  sesCount++; var ps=document.getElementById('pSes'); if(ps)ps.textContent=sesCount.toLocaleString();
  flash(LABELS[label]||label,(HDOT[label]||'#fff'));
  var rec={p:p,dot:dot,id:null}; huntHist.push(rec); saveHunt(p,rec);
}
async function saveHunt(p,rec){
  try{
    var r=await SB.from('land_label_hunt').insert({lat:p.lat,lng:p.lng,land_label:p.label,note:'hunt'}).select('id');
    if(r.error)throw r.error;
    if(r.data&&r.data[0])rec.id=r.data[0].id;
  }catch(e){showErr('採集の保存に失敗: '+((e&&e.message)||e)+'（land_label_hunt テーブル未作成の可能性）');}
}
async function undoHunt(){
  if(!huntHist.length)return;
  var h=huntHist.pop();
  if(h.dot&&huntLayer)huntLayer.removeLayer(h.dot);
  if(huntCount[h.p.label]>0)huntCount[h.p.label]--; updateHuntStat();
  sesCount=Math.max(0,sesCount-1); var ps=document.getElementById('pSes'); if(ps)ps.textContent=sesCount.toLocaleString();
  flash('取消','#f87171');
  if(h.id!=null){ try{await SB.from('land_label_hunt').delete().eq('id',h.id);}catch(e){showErr('採集の取消に失敗: '+((e&&e.message)||e));} }
}
async function loadHunt(){
  huntLayer=L.layerGroup();
  try{
    var all=[],from=0;
    while(true){
      var r=await SB.from('land_label_hunt').select('id,lat,lng,land_label').order('id',{ascending:true}).range(from,from+999);
      if(r.error){ if(from===0)showErr('採集データ読込不可（land_label_hunt 未作成の可能性。SQLで作成してください）'); break; }
      var d=r.data||[]; all=all.concat(d); if(d.length<1000)break; from+=1000;
    }
    huntCount={abandoned:0,cultivated:0,developed:0};
    all.forEach(function(x){
      L.circleMarker([x.lat,x.lng],{radius:6,color:'#000',weight:1,fillColor:(HDOT[x.land_label]||'#fff'),fillOpacity:0.95}).addTo(huntLayer);
      if(huntCount[x.land_label]!=null)huntCount[x.land_label]++;
    });
    updateHuntStat();
  }catch(e){}
}
// 既存ラベル済数を初期表示
(async function(){ try{ if(window.__auth&&window.__auth.sb){ var r=await window.__auth.sb.from('farmland_snapshots').select('id',{count:'exact',head:true}).eq('source_type','emaff_solar').not('land_label','is',null); if(!r.error){doneCount=r.count||0; var e=document.getElementById('pDone'); if(e)e.textContent=doneCount.toLocaleString();}} }catch(_){} })();
</script>
