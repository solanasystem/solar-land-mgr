<!DOCTYPE html>
<!-- BUILD: client-case-master v20260817a / 方式F(運用者ブラインド)案件マスター。確定納品300(平文)を一覧し、各案件の地権者情報をクライアントのブラウザ内でE2E暗号化して保存(client_secure_notes)。鍵はパスワード由来でサーバに送らない=運用者(service_role)は復号不可。金庫の初期化はクライアント自身(パスフレーズ設定→復旧コード)。共有ページには非依存。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案件マスター（地権者情報・暗号） // GRID LAND MGR</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="client-functions.js?v=20260817e"></script>
<script src="client-crypto.js?v=20260817a"></script>
<style>
  :root{--void:#050b1a;--panel:#0d1730;--panel2:#12203f;--line:#26375c;--plasma:#00d4ff;--gold:#f59e0b;--mint:#34d399;--rose:#f472b6;--text:#eaf0ff;--muted:#8698bd;--jp:'Zen Kaku Gothic New',sans-serif;--mono:'JetBrains Mono',monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;background:var(--void);color:var(--text);font-family:var(--jp);}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#081124,#050b1a);}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:0.1em;font-size:15px;} .brand b{color:var(--plasma);}
  .cchip{display:flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--gold);border-radius:5px;color:var(--gold);font-size:13px;font-weight:700;}
  .cchip small{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.2em;}
  a.back{color:var(--plasma);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:6px 12px;border-radius:5px;}
  .cnav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--line);background:#0a1326;}
  .cnav-i{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;padding:7px 14px;border:1px solid var(--line);border-radius:7px;}
  .cnav-i.on{color:var(--gold);border-color:var(--gold);background:rgba(245,158,11,0.08);}
  main{max-width:1300px;margin:0 auto;padding:20px 24px 60px;}
  h1{font-size:20px;font-weight:900;}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .lockbadge{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;margin-left:10px;}
  .lockbadge.locked{background:rgba(244,114,182,0.12);color:var(--rose);border:1px solid var(--rose);}
  .lockbadge.open{background:rgba(52,211,153,0.12);color:var(--mint);border:1px solid var(--mint);}
  .bar{display:flex;gap:14px;align-items:center;margin:14px 0;flex-wrap:wrap;}
  .cnt{font-family:var(--mono);color:var(--gold);font-weight:700;}
  input.search{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 12px;font-size:13px;min-width:240px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap;}
  th{background:var(--panel2);color:var(--muted);position:sticky;top:0;z-index:1;}
  td.sec{color:var(--mint);} td.secempty{color:var(--muted);font-style:italic;}
  .tblwrap{max-height:64vh;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .btn{padding:6px 12px;border-radius:6px;border:1px solid var(--plasma);background:rgba(0,212,255,0.08);color:var(--plasma);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--jp);}
  .btn.gold{border-color:var(--gold);color:var(--gold);background:rgba(245,158,11,0.08);}
  .btn.big{padding:12px 22px;font-size:15px;border-width:2px;}
  /* overlay */
  .ov{position:fixed;inset:0;background:rgba(3,8,20,0.92);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;max-width:520px;width:100%;}
  .card h2{font-size:18px;margin-bottom:6px;} .card p{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:14px;}
  .card input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;font-size:15px;margin-bottom:12px;}
  .rec{font-family:var(--mono);font-size:18px;letter-spacing:0.12em;color:var(--gold);background:#0a1326;border:1px dashed var(--gold);border-radius:8px;padding:14px;text-align:center;margin:10px 0;}
  .warn{color:var(--rose);font-size:12.5px;line-height:1.6;}
  .modal-form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  .modal-form input,.modal-form textarea,.modal-form select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 11px;font-size:14px;font-family:var(--jp);}
  .modal-form textarea{min-height:80px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d2a1a;border:1px solid var(--mint);color:#a7f3d0;padding:12px 20px;border-radius:8px;font-weight:700;display:none;z-index:200;}
</style>
</head>
<body>
<div class="top">
  <div class="brand">GRID LAND <b>MGR</b> // 案件マスター（地権者情報）</div>
  <div style="display:flex;gap:12px;align-items:center;">
    <div class="cchip"><small>CLIENT</small> <span id="cname">—</span></div>
    <a class="back" href="client-portal.html">◀ ポータル</a>
    <a class="back" href="client-select.html">⇄ 切替</a>
  </div>
</div>
<nav class="cnav" id="cnav"></nav>
<main>
  <h1>📇 案件マスター <span id="lockBadge" class="lockbadge locked">🔒 施錠中</span></h1>
  <div class="sub">確定納品（御社への提供情報）に、御社だけが読める<b>地権者情報</b>を暗号で記録します。入力は<b>御社のブラウザ内で暗号化</b>され、運用者（当社）には暗号文しか届きません＝<b>当社は復号できません</b>。</div>
  <div class="bar">
    <span class="cnt" id="cnt">—</span>
    <input class="search" id="search" placeholder="所在・地番で絞り込み" oninput="renderTable()">
    <button class="btn" id="lockBtn" onclick="relock()" style="display:none">🔒 施錠する</button>
  </div>
  <div class="tblwrap"><table id="tbl"><thead><tr>
    <th>No</th><th>所在</th><th>地番</th><th>面積(㎡)</th><th>地目</th><th>区域</th>
    <th>🔒地権者</th><th>🔒連絡先</th><th>🔒状況</th><th></th>
  </tr></thead><tbody id="tbody"><tr><td colspan="10" class="secempty">解錠して読み込みます…</td></tr></tbody></table></div>
</main>

<!-- 解錠/初期化オーバーレイ -->
<div class="ov" id="ov"><div class="card" id="ovCard">読込中…</div></div>
<!-- 編集モーダル -->
<div class="ov" id="editOv" style="display:none"><div class="card">
  <h2 id="editTitle">地権者情報</h2>
  <p id="editLoc" style="color:var(--gold)"></p>
  <div class="modal-form">
    <div class="row2"><div><label>地権者氏名</label><input id="f_name"></div><div><label>連絡先（電話/メール）</label><input id="f_tel"></div></div>
    <label>地権者住所</label><input id="f_addr">
    <label>交渉状況</label>
    <select id="f_status"><option value="">—</option><option>未着手</option><option>調査中</option><option>接触済</option><option>交渉中</option><option>合意</option><option>見送り</option></select>
    <label>メモ（自由記述）</label><textarea id="f_memo"></textarea>
  </div>
  <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
    <button class="btn" onclick="closeEdit()">閉じる</button>
    <button class="btn gold" onclick="saveEdit()">🔒 暗号化して保存</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
var SB_URL='https://fygnrjjifoasozbhkxlk.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5Z25yamppZm9hc296YmhreGxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDYzNTEsImV4cCI6MjA5MDE4MjM1MX0.A1fAMcu7wGBBP4xHUKkrExIuy7MFbmarAtLQahwZiso';
var db=supabase.createClient(SB_URL,SB_KEY);
var CLIENT_NAME=localStorage.getItem('glm_client_name')||'株式会社SUNトラスト';
document.getElementById('cname').textContent=CLIENT_NAME;
function buildClientNav(cur){try{var cid=localStorage.getItem('glm_client')||'suntrust';var CF=window.CLIENT_FUNCTIONS;if(!CF||!CF.clients)return;var keys=CF.clients[cid]||[];var items=[{label:'🏠 ポータル',url:'client-portal.html'}];keys.forEach(function(k){var f=CF.registry[k];if(f&&f.ready&&f.url&&f.url!=='#')items.push({label:(f.icon||'')+' '+f.label,url:f.url});});var nav=document.getElementById('cnav');nav.innerHTML=items.map(function(it){return '<a class="cnav-i'+(it.url===cur?' on':'')+'" href="'+it.url+'">'+it.label+'</a>';}).join('');}catch(e){}}
buildClientNav('client-case-master.html');

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.style.display='none';},4000);}
function esc(v){return (v==null)?'':String(v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var CID=null, DEK=null, ITEMS=[], NOTES={}; // NOTES[delivery_id]={name,addr,tel,status,memo}

async function resolveClient(){
  try{var c=await db.from('clients').select('id,name').ilike('name','%'+CLIENT_NAME.replace('株式会社','')+'%').limit(1);if(c&&c.data&&c.data.length)CID=c.data[0].id;}catch(e){}
}
async function getCryptoRecord(){
  var r=await db.from('client_crypto').select('*').eq('client_id',CID).limit(1);
  if(r.error) return {error:r.error};
  return {row:(r.data&&r.data[0])||null};
}

/* ===== 解錠フロー ===== */
function showUnlock(mode,rec){
  var card=document.getElementById('ovCard');
  if(mode==='setup'){
    card.innerHTML='<h2>🔐 金庫を作成（初回のみ）</h2>'+
      '<p>地権者情報を<b>御社だけが読める暗号</b>で保存するための「金庫パスフレーズ」を設定します。'+
      '<b>このパスフレーズは当社に送信されません</b>。当社は設定後の情報を復号できません。</p>'+
      '<input id="pw1" type="password" placeholder="金庫パスフレーズ（8文字以上）" autocomplete="new-password">'+
      '<input id="pw2" type="password" placeholder="もう一度入力" autocomplete="new-password">'+
      '<div style="display:flex;justify-content:flex-end"><button class="btn gold big" onclick="doSetup()">金庫を作成</button></div>';
  }else if(mode==='unlock'){
    card.innerHTML='<h2>🔓 解錠</h2><p>金庫パスフレーズを入力してください（当社には送信されません）。</p>'+
      '<input id="pw1" type="password" placeholder="金庫パスフレーズ" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doUnlock()">'+
      '<div style="display:flex;gap:10px;justify-content:space-between"><button class="btn" onclick="showRecovery()">パスフレーズを忘れた</button><button class="btn gold big" onclick="doUnlock()">解錠</button></div>';
  }else if(mode==='recovery'){
    card.innerHTML='<h2>🩹 復旧コードで解錠</h2><p>初回に控えた復旧コードを入力してください。解錠後に新しいパスフレーズを設定できます。</p>'+
      '<input id="rec" placeholder="XXXXX-XXXXX-XXXXX-XXXXX">'+
      '<input id="pwn" type="password" placeholder="新しい金庫パスフレーズ（8文字以上）" autocomplete="new-password">'+
      '<div style="display:flex;justify-content:flex-end"><button class="btn gold big" onclick="doRecovery()">復旧して解錠</button></div>';
  }
  document.getElementById('ov').style.display='flex';
}
window.__rec=null;
async function doSetup(){
  var p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
  if(p1.length<8){toast('8文字以上にしてください');return;}
  if(p1!==p2){toast('確認用が一致しません');return;}
  try{
    var s=await ClientCrypto.setup(p1);
    var ins=await db.from('client_crypto').insert({client_id:CID,kdf_salt:s.record.kdf_salt,rec_salt:s.record.rec_salt,wrapped_dek_pw:s.record.wrapped_dek_pw,wrapped_dek_recovery:s.record.wrapped_dek_recovery});
    if(ins.error){toast('保存失敗: '+ins.error.message);return;}
    DEK=s.dek;
    // 復旧コードを1回だけ表示
    document.getElementById('ovCard').innerHTML='<h2>✅ 金庫を作成しました</h2>'+
      '<p><b>復旧コードを必ず控えてください（この画面でしか表示されません）</b>。パスフレーズを完全に忘れた場合の唯一の復旧手段です。</p>'+
      '<div class="rec">'+esc(s.recoveryCode)+'</div>'+
      '<p class="warn">※ 紛失しパスフレーズも忘れると、暗号化した地権者情報は誰にも（当社にも）復元できません。</p>'+
      '<div style="display:flex;justify-content:flex-end"><button class="btn gold big" onclick="finishUnlock()">控えました・開始する</button></div>';
  }catch(e){toast('作成失敗: '+(e&&e.message||e));}
}
async function doUnlock(){
  var pw=document.getElementById('pw1').value; if(!pw){return;}
  try{ var rec=(await getCryptoRecord()).row; DEK=await ClientCrypto.unlockWithPassword(rec,pw); finishUnlock(); }
  catch(e){ toast('パスフレーズが違います'); }
}
function showRecovery(){ showUnlock('recovery'); }
async function doRecovery(){
  var code=document.getElementById('rec').value.trim().toUpperCase(), npw=document.getElementById('pwn').value;
  if(npw.length<8){toast('新パスフレーズは8文字以上');return;}
  try{
    var rec=(await getCryptoRecord()).row;
    DEK=await ClientCrypto.unlockWithRecovery(rec,code);
    var rw=await ClientCrypto.rewrapPassword(DEK,npw);
    await db.from('client_crypto').update({kdf_salt:rw.kdf_salt,wrapped_dek_pw:rw.wrapped_dek_pw,updated_at:new Date().toISOString()}).eq('client_id',CID);
    toast('復旧しました。新パスフレーズを設定しました。'); finishUnlock();
  }catch(e){ toast('復旧コードが違います'); }
}
async function finishUnlock(){
  document.getElementById('ov').style.display='none';
  document.getElementById('lockBadge').className='lockbadge open'; document.getElementById('lockBadge').textContent='🔓 解錠中（この画面のみ）';
  document.getElementById('lockBtn').style.display='';
  await loadNotesAndRender();
}
function relock(){ DEK=null; NOTES={}; location.reload(); }

/* ===== データ ===== */
async function loadItems(){
  var q=db.from('client_delivery_items').select('delivery_id:id,pref,city,town,chiban,area_m2,chimoku,zone,address').eq('status','confirmed').order('pref',{ascending:true});
  if(CID)q=q.eq('client_id',CID);
  var r=await q; ITEMS=(r&&r.data)||[];
}
async function loadNotesAndRender(){
  NOTES={};
  try{
    var r=await db.from('client_secure_notes').select('delivery_id,ciphertext,iv').eq('client_id',CID);
    var rows=(r&&r.data)||[];
    for(var i=0;i<rows.length;i++){
      try{ var pt=await ClientCrypto.decryptNote(DEK,rows[i].ciphertext,rows[i].iv); NOTES[rows[i].delivery_id]=JSON.parse(pt); }catch(e){}
    }
  }catch(e){}
  renderTable();
}
function renderTable(){
  var q=(document.getElementById('search').value||'').trim();
  var body=document.getElementById('tbody'), rows=ITEMS;
  if(q){rows=rows.filter(function(r){return ((r.address||'')+(r.chiban||'')+(r.city||'')+(r.town||'')).indexOf(q)!==-1;});}
  document.getElementById('cnt').textContent='確定納品 '+ITEMS.length+'件（表示 '+rows.length+'）';
  if(!rows.length){body.innerHTML='<tr><td colspan="10" class="secempty">該当なし</td></tr>';return;}
  body.innerHTML=rows.map(function(r,i){
    var loc=[r.pref,r.city,r.town].filter(Boolean).join('');
    var n=NOTES[r.delivery_id]||{};
    var sec=DEK?'':'🔒';
    return '<tr>'+
      '<td>'+(i+1)+'</td><td>'+esc(loc)+'</td><td>'+esc(r.chiban)+'</td><td>'+(r.area_m2!=null?Math.round(r.area_m2).toLocaleString():'')+'</td><td>'+esc(r.chimoku)+'</td><td>'+esc(r.zone)+'</td>'+
      (DEK? ('<td class="'+(n.name?'sec':'secempty')+'">'+(n.name?esc(n.name):'—')+'</td>'+
             '<td class="'+(n.tel?'sec':'secempty')+'">'+(n.tel?esc(n.tel):'—')+'</td>'+
             '<td class="'+(n.status?'sec':'secempty')+'">'+(n.status?esc(n.status):'—')+'</td>'+
             '<td><button class="btn" onclick="openEdit(\''+r.delivery_id+'\')">編集</button></td>')
          : '<td class="secempty">🔒</td><td class="secempty">🔒</td><td class="secempty">🔒</td><td class="secempty">解錠が必要</td>')+
      '</tr>';
  }).join('');
}

var _editId=null;
function openEdit(id){
  if(!DEK){toast('解錠してください');return;}
  _editId=id; var it=ITEMS.filter(function(x){return x.delivery_id===id;})[0]||{}; var n=NOTES[id]||{};
  document.getElementById('editLoc').textContent=[it.pref,it.city,it.town].filter(Boolean).join('')+' '+(it.chiban||'');
  document.getElementById('f_name').value=n.name||''; document.getElementById('f_tel').value=n.tel||'';
  document.getElementById('f_addr').value=n.addr||''; document.getElementById('f_status').value=n.status||''; document.getElementById('f_memo').value=n.memo||'';
  document.getElementById('editOv').style.display='flex';
}
function closeEdit(){document.getElementById('editOv').style.display='none';_editId=null;}
async function saveEdit(){
  if(!DEK||!_editId)return;
  var obj={name:document.getElementById('f_name').value.trim(),tel:document.getElementById('f_tel').value.trim(),addr:document.getElementById('f_addr').value.trim(),status:document.getElementById('f_status').value,memo:document.getElementById('f_memo').value.trim()};
  try{
    var e=await ClientCrypto.encryptNote(DEK,JSON.stringify(obj));
    var payload={client_id:CID,delivery_id:_editId,ciphertext:e.ciphertext,iv:e.iv,updated_at:new Date().toISOString(),updated_by:(localStorage.getItem('glm_user')||'client')};
    var up=await db.from('client_secure_notes').upsert(payload,{onConflict:'client_id,delivery_id'});
    if(up.error){toast('保存失敗: '+up.error.message);return;}
    NOTES[_editId]=obj; toast('暗号化して保存しました（当社には暗号文のみ）'); closeEdit(); renderTable();
  }catch(e){toast('保存失敗: '+(e&&e.message||e));}
}

async function boot(){
  await resolveClient();
  if(!CID){document.getElementById('ovCard').innerHTML='<h2>クライアント未特定</h2><p>ログイン情報を確認してください。</p>';return;}
  await loadItems();
  renderTable();
  var cr=await getCryptoRecord();
  if(cr.error){
    // テーブル未作成 or 権限
    document.getElementById('ovCard').innerHTML='<h2>準備中</h2><p>暗号保管テーブルが未作成です（管理者のDDL適用待ち）。適用後に金庫を作成できます。</p><p class="warn" style="font-family:monospace;font-size:11px">'+esc(cr.error.message||'')+'</p>';
    return;
  }
  showUnlock(cr.row? 'unlock':'setup', cr.row);
}
boot();
</script>
</body>
</html>
