window.__rec=null;
async function doSetup(){
  var p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
  if(p1.length<8){toast('8文字以上にしてください');return;}
  if(p1!==p2){toast('確認用が一致しません');return;}
  try{
    var s=await ClientCrypto.setup(p1);
    var ins=await db.from('client_crypto').insert({client_id:CID,kdf_salt:s.record.kdf_salt,rec_salt:s.record.rec_salt,wrapped_dek_pw:s.record.wrapped_dek_pw,wrapped_dek_recovery:s.record.wrapped_dek_recovery});
    if(ins.error){toast('保存失敗: '+ins.error.message);return;}
    DEK=s.dek;
    // 復旧コードを1回だけ表示
    document.getElementById('ovCard').innerHTML='<h2>✅ 金庫を作成しました</h2>'+
      '<p><b>復旧コードを必ず控えてください（この画面でしか表示されません）</b>。パスフレーズを完全に忘れた場合の唯一の復旧手段です。</p>'+
      '<div class="rec">'+esc(s.recoveryCode)+'</div>'+
      '<p class="warn">※ 紛失しパスフレーズも忘れると、暗号化した地権者情報は誰にも（当社にも）復元できません。</p>'+
      '<div style="display:flex;justify-content:flex-end"><button class="btn gold big" onclick="finishUnlock()">控えました・開始する</button></div>';
  }catch(e){toast('作成失敗: '+(e&&e.message||e));}
}
async function doUnlock(){
  var pw=document.getElementById('pw1').value; if(!pw){return;}
  try{ var rec=(await getCryptoRecord()).row; DEK=await ClientCrypto.unlockWithPassword(rec,pw); finishUnlock(); }
  catch(e){ toast('パスフレーズが違います'); }
}
function showRecovery(){ showUnlock('recovery'); }
async function doRecovery(){
  var code=document.getElementById('rec').value.trim().toUpperCase(), npw=document.getElementById('pwn').value;
  if(npw.length<8){toast('新パスフレーズは8文字以上');return;}
  try{
    var rec=(await getCryptoRecord()).row;
    DEK=await ClientCrypto.unlockWithRecovery(rec,code);
    var rw=await ClientCrypto.rewrapPassword(DEK,npw);
    await db.from('client_crypto').update({kdf_salt:rw.kdf_salt,wrapped_dek_pw:rw.wrapped_dek_pw,updated_at:new Date().toISOString()}).eq('client_id',CID);
    toast('復旧しました。新パスフレーズを設定しました。'); finishUnlock();
  }catch(e){ toast('復旧コードが違います'); }
}

async function blobToImages(blob){
  var type=(blob.type||'').toLowerCase();
  if(type==='image/jpeg'||type==='image/png'||type==='image/webp'){
    var dataUrl=await new Promise(function(resolve,reject){
      var r=new FileReader(); r.onload=function(){resolve(r.result);}; r.onerror=function(){reject(r.error||new Error('画像読込失敗'));}; r.readAsDataURL(blob);
    });
    return [dataUrl];
  }
  if(type==='application/pdf'){
    if(!window.pdfjsLib) throw new Error('PDF.jsが読み込まれていません');
    if(!pdfjsLib.GlobalWorkerOptions.workerSrc){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
    var buf=await blob.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:buf}).promise;
    var images=[];
    for(var p=1;p<=pdf.numPages;p++){
      var page=await pdf.getPage(p);
      var viewport=page.getViewport({scale:2.0});
      var canvas=document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:viewport}).promise;
      images.push(canvas.toDataURL('image/jpeg',0.85));
    }
    return images;
  }
  throw new Error('対応形式はPDF/JPG/PNG/WebPです（HEICは非対応）');
}

var _txDocIndex=null;
async function runTranscribe(docIndex){
  var n=NOTES[_detId]||{}; var docs=n._registryDocs||[]; var d=docs[docIndex];
  if(!d)return;
  var statusEl=document.getElementById('docStatus');
  _txDocIndex=docIndex;
  try{
    statusEl.textContent='登記簿を取得しています…';
    var su=await db.storage.from('registry-docs').createSignedUrl(d.path,600);
    if(su.error||!su.data) throw new Error('取得失敗: '+(su.error&&su.error.message||'unknown'));
    var res0=await fetch(su.data.signedUrl); if(!res0.ok) throw new Error('取得失敗: HTTP '+res0.status);
    var blob=await res0.blob();

    statusEl.textContent='画像に変換しています…';
    var images=await blobToImages(blob);

    statusEl.textContent='AIが登記簿を読み取っています…（数十秒かかることがあります）';
    var res=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Client-Token':CLIENT_TOKEN},
      body:JSON.stringify({images:images})
    });
    var j=await res.json();
    if(!res.ok||!j.ok){
      if(res.status===429){ throw new Error('今月の利用上限('+(j.limit||300)+'件)に達しました。来月まで自動でリセットされます。'); }
      throw new Error('AI転記に失敗しました: '+(j.error||res.status));
    }
    var textOut=(((j.result||{}).content||[])[0]||{}).text||'';
    var m=/\{[\s\S]*\}/.exec(textOut);
    if(!m) throw new Error('AIの出力からJSONを取り出せませんでした');
    _upExtracted=JSON.parse(m[0]);
    statusEl.textContent='✓ 読み取り完了';
    openReview();
  }catch(e){
    statusEl.textContent='✗ '+(e&&e.message||e);
  }
}
