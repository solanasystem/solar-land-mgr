name: Promote versioned files to served names

# 配信名マーカー "<name>_v<token>.<ext>" または "<name>__v<token>.<ext>" が push されると、
# "<name>.<ext>"(配信名) へ自動コピーし、版名ファイルを削除する。
# アンダースコア1本でも2本でも動く（DL時に __ が _ に化けても昇格する）。
# 全ファイル共通。人間はリネーム/削除を一切しない。

on:
  push:
    branches: [ main ]
    paths:
      - '*_v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-versioned
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote versioned files
        run: |
          set -e
          changed=0
          for f in $(ls -1 2>/dev/null | grep -E '_+v[0-9A-Za-z]+\.[^.]+$' | sort); do
            canonical="$(echo "$f" | sed -E 's/_+v[0-9A-Za-z]+(\.[^.]+)$/\1/')"
            if [ "$canonical" = "$f" ] || [ -z "$canonical" ]; then continue; fi
            echo "promote: $f -> $canonical"
            cp -f "$f" "$canonical"
            git rm -q "$f"
            git add "$canonical"
            changed=1
          done
          if [ "$changed" -eq 0 ]; then echo "no versioned files"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: promote versioned files to served names [skip ci]"
          git push
