<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2129;--border:#30363d;
  --text:#e6edf3;--text-muted:#8b949e;--accent:#a371f7;--blue:#58a6ff;
  --green:#3fb950;--yellow:#f0b429;--red:#f85149;
  --font-main:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-main);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.app-header-title{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--font-main);transition:all .15s;white-space:nowrap;}
.btn:hover{background:#272d36;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#8b5cf6;}
.btn-success{background:var(--green);border-color:var(--green);color:#fff;}
.btn-success:hover{background:#2ea043;}
.btn-ghost{background:transparent;}
.layout{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 60px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px;}
.main{padding:24px;overflow-y:auto;background:var(--bg);}
.section{margin-bottom:20px;}
.section-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.form-group{margin-bottom:10px;}
.form-label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;}
.form-input,.form-select{width:100%;padding:8px 10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:6px;font-size:13px;font-family:var(--font-main);}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent);}
.case-info-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;line-height:1.6;}
.case-info-card .row{display:flex;gap:8px;margin-bottom:4px;}
.case-info-card .lab{color:var(--text-muted);min-width:80px;}
.case-info-card .val{color:var(--text);flex:1;font-weight:500;}
.warning-banner{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.4);color:var(--yellow);padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;line-height:1.5;}
.empty-preview{padding:60px 20px;text-align:center;color:var(--text-muted);}
.empty-preview-icon{font-size:48px;margin-bottom:16px;}
.preview-toolbar{background:var(--surface);padding:10px 16px;border-radius:8px;margin-bottom:16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.preview-toolbar .info{font-size:12px;color:var(--text-muted);}
.method-info{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.3);color:#7ee787;padding:14px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;line-height:1.6;}
.method-info strong{color:#56d364;}
.method-info ol{margin:6px 0 0 24px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);color:var(--text);padding:12px 20px;border-radius:8px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:all .25s;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:var(--red);}
.toast.success{background:var(--green);}

/* docx生成済みのプレビュー（参考表示） */
.preview-area{
  background:var(--surface2);
  border:2px dashed var(--border);
  border-radius:8px;
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
}
.preview-area h3{
  color:var(--text);
  font-size:18px;
  margin-bottom:12px;
}
.preview-area .case-summary{
  background:var(--surface);
  border-radius:6px;
  padding:16px;
  margin-top:20px;
  text-align:left;
  display:inline-block;
  min-width:400px;
}
.preview-area .case-summary table{
  width:100%;
  font-size:13px;
  color:var(--text);
}
.preview-area .case-summary table td{padding:4px 12px;}
.preview-area .case-summary table td:first-child{color:var(--text-muted);font-weight:500;width:40%;}

/* ステータスタブ（main.html準拠） */
.status-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.st-tab{padding:5px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;color:var(--text-muted);font-family:var(--font-main);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.st-tab:hover{background:var(--surface2);color:var(--text);}
.st-tab.active{font-weight:700;}
.st-tab .st-count{font-family:var(--font-mono);font-size:10px;margin-left:3px;opacity:.7;}
.st-tab.empty{opacity:.4;}
/* ステータス別のactiveカラー */
.st-tab[data-st="ALL"].active{background:rgba(163,113,247,.15);border-color:#a371f7;color:#a371f7;}
.st-tab[data-st="NOT VISITED"].active{background:rgba(239,68,68,.15);border-color:#ef4444;color:#ef4444;}
.st-tab[data-st="THINKING↑"].active{background:rgba(252,165,165,.18);border-color:#fca5a5;color:#fca5a5;}
.st-tab[data-st="THINKING→"].active{background:rgba(234,179,8,.15);border-color:#eab308;color:#eab308;}
.st-tab[data-st="THINKING↓"].active{background:rgba(132,204,22,.15);border-color:#84cc16;color:#84cc16;}
.st-tab[data-st="OK"].active{background:rgba(56,189,248,.15);border-color:#38bdf8;color:#38bdf8;}
.st-tab[data-st="SUCCESS"].active{background:rgba(249,115,22,.15);border-color:#f97316;color:#f97316;}
.st-tab[data-st="NON MEET"].active{background:rgba(209,213,219,.18);border-color:#d1d5db;color:#dc2626;}
.st-tab[data-st="NG"].active{background:rgba(75,85,99,.4);border-color:#9ca3af;color:#fff;}
.st-tab[data-st="UNKNOWN"].active{background:rgba(64,130,109,.2);border-color:#40826d;color:#40826d;}
.st-tab[data-st="LETTER"].active{background:rgba(167,139,250,.15);border-color:#a78bfa;color:#a78bfa;}
.st-tab[data-st="LTR済"].active{background:rgba(91,33,182,.25);border-color:#5b21b6;color:#a78bfa;}

/* NGブラインドボタン */
.ng-blind-btn{padding:6px 12px;background:rgba(107,114,128,.4);color:#fff;border:1px solid rgba(107,114,128,.8);font-size:12px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:var(--font-main);transition:all .15s;}
.ng-blind-btn.on{background:rgba(248,81,73,.4);color:#fff;border-color:rgba(248,81,73,.8);}
.ng-blind-btn.off{background:rgba(248,81,73,.15);color:#f85149;border-color:rgba(248,81,73,.4);}
</style>
</head>
<body>

<header class="app-header no-print">
  <div class="app-header-title">
    <button class="btn btn-ghost" onclick="location.href='main.html'">← 戻る</button>

let allCases=[],landownersByCase={},landsByCase={},currentCaseId=null;
let statusFilter='ALL'; // 'ALL' or 1 status
let ngBlind=true; // NGブラインド初期ON

function setStatusFilter(st){
  statusFilter=st;
  renderCaseSelect();
}

function toggleNgBlind(){
  ngBlind=!ngBlind;
  const btn=document.getElementById('ngBlindBtn');
  btn.textContent='NGブラインド '+(ngBlind?'ON':'OFF');
  btn.classList.toggle('on', ngBlind);
  btn.classList.toggle('off', !ngBlind);
  renderCaseSelect();
}

function getPowerCompanyFromArea(a){
  if(!a)return null;a=a.trim();
  if(['中部','愛知','岐阜','三重','静岡','長野','名古屋','蒲郡市','田原市','豊橋市','豊田市','岡崎市','常滑市','西尾市','刈谷市','安城市','知立市'].some(k=>a.includes(k)))return'中部電力';
  if(['関西','近畿','大阪','京都','兵庫','奈良','和歌山','滋賀'].some(k=>a.includes(k)))return'関西電力';
  if(['関東','東京','神奈川','埼玉','千葉','茨城','栃木','群馬','山梨'].some(k=>a.includes(k)))return'東京電力';
  if(['九州','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島'].some(k=>a.includes(k)))return'九州電力';
  if(['中国','広島','岡山','鳥取','島根','山口'].some(k=>a.includes(k)))return'中国電力';
  if(['四国','愛媛','高知','徳島','香川'].some(k=>a.includes(k)))return'四国電力';
  if(['北陸','石川','富山','福井'].some(k=>a.includes(k)))return'北陸電力';
  if(['東北','青森','岩手','宮城','秋田','山形','福島','新潟'].some(k=>a.includes(k)))return'東北電力';
  if(['北海道','札幌'].some(k=>a.includes(k)))return'北海道電力';
  if(['沖縄','那覇'].some(k=>a.includes(k)))return'沖縄電力';
  return null;
}

document.addEventListener('DOMContentLoaded',async()=>{await loadData();});

async function loadData(){
  document.getElementById('loadStatus').textContent='読込中...';
  const[caseRes,loRes,ldRes]=await Promise.all([
    db.from('cases').select('id,case_no,display_case_no,area_name,status,kubun,price').order('case_no'),
    db.from('landowner_info').select('case_id,name,address,tel,postal_code,price,memo,created_at').order('created_at'),
    db.from('land_info').select('case_id,location,chiban,chimoku,area_sqm')
  ]);
  if(caseRes.error){showToast('案件読込エラー:'+caseRes.error.message,'error');return;}
  if(loRes.error){showToast('地権者読込エラー:'+loRes.error.message,'error');return;}
  if(ldRes.error){showToast('土地情報読込エラー:'+ldRes.error.message,'error');return;}
  allCases=caseRes.data||[];
  landownersByCase={};
  (loRes.data||[]).forEach(lo=>{if(lo.case_id)(landownersByCase[lo.case_id]=landownersByCase[lo.case_id]||[]).push(lo);});
  landsByCase={};
  (ldRes.data||[]).forEach(l=>{if(l.case_id)(landsByCase[l.case_id]=landsByCase[l.case_id]||[]).push(l);});
  document.getElementById('loadStatus').textContent=`案件 ${allCases.length}件`;
  renderCaseSelect();
}

function getFilteredCases(){
  const area=document.getElementById('filterArea').value;
  const q=(document.getElementById('searchQ').value||'').toLowerCase();
  return allCases.filter(c=>{
    // NGブラインド：ON時はNGステータスを除外
    if(ngBlind&&c.status==='NG')return false;
    // ステータスタブ
    if(statusFilter!=='ALL'&&c.status!==statusFilter)return false;
    if(area){const pc=getPowerCompanyFromArea(c.area_name);if(pc!==area)return false;}
    if(q){
      const caseNo=(c.case_no||'').toLowerCase();
      const bizNo=(c.display_case_no||'').toLowerCase();
      const ownerNames=(landownersByCase[c.id]||[]).map(lo=>(lo.name||'').toLowerCase()).join(' ');
      if(!caseNo.includes(q)&&!bizNo.includes(q)&&!ownerNames.includes(q))return false;
    }
    return true;
  });
}

function updateStatusCounts(){
  // 各ステータスの件数を計算（ステータスフィルタ・NGブラインドは無視、エリア・検索のみ反映）
  const area=document.getElementById('filterArea').value;
  const q=(document.getElementById('searchQ').value||'').toLowerCase();
  const baseFilter = c => {
    if(area){const pc=getPowerCompanyFromArea(c.area_name);if(pc!==area)return false;}
    if(q){
      const caseNo=(c.case_no||'').toLowerCase();
      const bizNo=(c.display_case_no||'').toLowerCase();
      const ownerNames=(landownersByCase[c.id]||[]).map(lo=>(lo.name||'').toLowerCase()).join(' ');
      if(!caseNo.includes(q)&&!bizNo.includes(q)&&!ownerNames.includes(q))return false;
    }
    return true;
  };
  const base = allCases.filter(baseFilter);
  const counts={'ALL':0};
  base.forEach(c=>{
    if(ngBlind&&c.status==='NG')return; // NGブラインド適用
    counts['ALL']++;
    counts[c.status]=(counts[c.status]||0)+1;
  });
  // NG件数は ngBlind に関係なく表示
  counts['NG']=base.filter(c=>c.status==='NG').length;
  // selectのoptionテキストに件数を表示
  const labels={'ALL':'すべてのステータス','NOT VISITED':'NOT VISITED','THINKING↑':'THINKING↑','THINKING→':'THINKING→','THINKING↓':'THINKING↓','OK':'OK','SUCCESS':'SUCCESS','NON MEET':'NON MEET','NG':'NG','UNKNOWN':'UNKNOWN','LETTER':'LETTER','LTR済':'LTR済'};
  const sel=document.getElementById('filterStatus');
  if(sel){
    Array.from(sel.options).forEach(opt=>{
      const st=opt.value;
      const n=counts[st]||0;
      opt.textContent=labels[st]+(n>0?` (${n})`:'');
    });
  }
}

function renderCaseSelect(){
  updateStatusCounts();
  const list=getFilteredCases();
  const sel=document.getElementById('caseSelect');
  if(!list.length){sel.innerHTML='<option value="">該当なし</option>';return;}
  sel.innerHTML=list.map(c=>{
    const owners=landownersByCase[c.id]||[];
    const ownerName=owners[0]?.name||'(地権者未登録)';
    const dup=owners.length>1?` ⚠×${owners.length}`:'';
    const bizLabel=c.display_case_no?` 〔${c.display_case_no}〕`:'';
    return `<option value="${c.id}">${c.case_no}${bizLabel} / ${ownerName}${dup}</option>`;
  }).join('');
  if(currentCaseId&&list.some(c=>c.id===currentCaseId))sel.value=currentCaseId;
}

function onCaseChange(){
  const sel=document.getElementById('caseSelect');
  currentCaseId=sel.value||null;
  if(!currentCaseId){
    document.getElementById('caseInfoBox').innerHTML='<div class="case-info-card" style="color:var(--text-muted);">案件を選択してください</div>';
    document.getElementById('preview').innerHTML='<div class="preview-area"><div style="font-size:48px;margin-bottom:16px;">📄</div><h3>左の一覧から案件を選択してください</h3></div>';
    document.getElementById('previewInfo').textContent='案件未選択';
    setBtn(false);return;
  }
  renderCaseInfo(currentCaseId);
  renderPreview(currentCaseId);
  setBtn(true);
}

function getReiwaToday(){
  const now=new Date();
  return{year:now.getFullYear()-2018,month:now.getMonth()+1,day:now.getDate()};
}

function escapeHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function xmlEscape(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

// 全角空白でセンタリングパディング
function padCenter(text, totalChars){
  const len = [...text].length;
  if(len >= totalChars) return text;
  const padding = totalChars - len;
  const left = Math.floor(padding/2);
  const right = padding - left;
  return '\u3000'.repeat(left) + text + '\u3000'.repeat(right);
}

// base64 → Uint8Array
function base64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function downloadDocx(){
  if(!currentCaseId){showToast('案件を選択してください','error');return;}
  const c=allCases.find(x=>x.id===currentCaseId);
  const owners=landownersByCase[currentCaseId]||[];
  const lands=landsByCase[currentCaseId]||[];
  const owner=owners[0]||{};
  const today=getReiwaToday();

  try{
    showToast('docx生成中...','info');

    // 1. base64 → bytes → PizZip
    const bytes = base64ToBytes(TEMPLATE_DOCX_B64);
    const zip = new PizZip(bytes.buffer);

    // 2. document.xml 取得
    const docXmlFile = zip.file('word/document.xml');
    if(!docXmlFile){throw new Error('document.xml not found');}
    let docXml = docXmlFile.asText();

    // 3. サンプル原本のXMLに直接マッチさせて置換（テンプレート編集なし）
    const priceText = owner.price ? Number(owner.price).toLocaleString() : '';
    const ownerName = owner.name || '';

    // -- 1. 8文字以上の連続全角空白テキストノード（3箇所：売渡金額・買付証明書宛先・買付金額）--
    // サンプル原本の構造: <w:t xml:space="preserve">　　　　　　　　</w:t>
    const spacePattern = /<w:t[^>]*?>(\u3000{6,})<\/w:t>/g;
    const spaceMatches = [...docXml.matchAll(spacePattern)];
    if(spaceMatches.length >= 3){
      // 値（中央寄せでパディング）
      const v1 = xmlEscape(padCenter(priceText, 8));    // 売渡金額
      const v2 = xmlEscape(padCenter(ownerName, 13));   // 買付証明書宛先
      const v3 = xmlEscape(padCenter(priceText, 8));    // 買付金額
      // 前から順に置換（位置を保つ）
      const m0 = spaceMatches[0], m1 = spaceMatches[1], m2 = spaceMatches[2];
      docXml = docXml.substring(0, m0.index) +
        '<w:t xml:space="preserve">' + v1 + '</w:t>' +
        docXml.substring(m0.index + m0[0].length, m1.index) +
        '<w:t xml:space="preserve">' + v2 + '</w:t>' +
        docXml.substring(m1.index + m1[0].length, m2.index) +
        '<w:t xml:space="preserve">' + v3 + '</w:t>' +
        docXml.substring(m2.index + m2[0].length);
    }

    // -- 2. 日付の2回目を「令和　X年　Y月　Z日」に置換 --
    const datePattern = /<w:t>令和\u3000\u3000年\u3000\u3000月\u3000\u3000日<\/w:t>/g;
    const dateMatches = [...docXml.matchAll(datePattern)];
    if(dateMatches.length >= 2){
      const m = dateMatches[1]; // 2番目（買付証明書側）
      docXml = docXml.substring(0, m.index) +
        '<w:t xml:space="preserve">令和\u3000' + today.year + '年\u3000' + today.month + '月\u3000' + today.day + '日</w:t>' +
        docXml.substring(m.index + m[0].length);
    }

    // -- 3. 管理No.の値セル（管理No.の隣の空セル）にテキスト挿入 --
    // 「<w:t>管理</w:t>」の後の最初の<w:tc>...</w:tc>内の<w:p ...><w:pPr>...</w:pPr>の直後に追加
    {
      const adminPos = docXml.indexOf('<w:t>管理</w:t>');
      if(adminPos > 0){
        // 管理ラベルセルの</w:tc>の後、次の<w:tc>を見つける
        const adminTcEnd = docXml.indexOf('</w:tc>', adminPos);
        const valTcStart = docXml.indexOf('<w:tc>', adminTcEnd);
        const valTcEnd = docXml.indexOf('</w:tc>', valTcStart);
        // 値セル内の最初の</w:pPr>の直後にテキスト挿入
        const pprEnd = docXml.indexOf('</w:pPr>', valTcStart);
        if(pprEnd > 0 && pprEnd < valTcEnd){
          const insertPos = pprEnd + '</w:pPr>'.length;
          // 業務番号が設定されていれば優先、なければ案件番号を管理No.に印字
          const adminNo = xmlEscape(c?.display_case_no || c?.case_no || '');
          docXml = docXml.substring(0, insertPos) +
            '<w:r><w:rPr><w:rFonts w:hint="eastAsia"/></w:rPr><w:t>' + adminNo + '</w:t></w:r>' +
            docXml.substring(insertPos);
        }
      }
    }

    // -- 4. 不動産表示テーブルの空行（3行）にテキスト挿入 --
    {
      const realestatePos = docXml.indexOf('不動産の表示');
      const tblStart = docXml.indexOf('<w:tbl>', realestatePos);
      const tblEnd = docXml.indexOf('</w:tbl>', tblStart) + '</w:tbl>'.length;
      let tblXml = docXml.substring(tblStart, tblEnd);
      
      // 各<w:tr>を抽出（合計4行：ヘッダー1 + 空3）
      const trMatches = [...tblXml.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)];
      
      // 行1～3（インデックス1,2,3）にデータを挿入
      // 後ろから処理して位置を保つ
      const fields = ['location', 'chiban', 'chimoku', 'area', 'owner', 'share'];
      for(let rowIdx = 3; rowIdx >= 1; rowIdx--){
        if(rowIdx >= trMatches.length) continue;
        const trMatch = trMatches[rowIdx];
        let trOld = trMatch[0];
        
        const l = lands[rowIdx - 1];
        const values = l ? [
          xmlEscape(l.location||''),
          xmlEscape(l.chiban||''),
          xmlEscape(l.chimoku||''),
          l.area_sqm ? xmlEscape(Number(l.area_sqm).toLocaleString()) : '',
          xmlEscape(owner.name||''),
          ''
        ] : ['','','','','',''];
        
        // この tr 内の <w:tc>...</w:tc> を全て抽出
        const tcMatches = [...trOld.matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)];
        if(tcMatches.length !== 6) continue;
        
        // 各セルの</w:pPr>の直後にテキスト挿入（後ろから処理）
        let trNew = trOld;
        for(let colIdx = 5; colIdx >= 0; colIdx--){
          const tcMatch = tcMatches[colIdx];
          const tcOld = tcMatch[0];
          const tcStartInTr = tcMatch.index;
          const tcEndInTr = tcStartInTr + tcOld.length;
          
          // tcの中の</w:pPr>を見つける
          const pprEndInTc = tcOld.indexOf('</w:pPr>');
          if(pprEndInTc < 0) continue;
          
          const insertPosInTc = pprEndInTc + '</w:pPr>'.length;
          const newTc = tcOld.substring(0, insertPosInTc) +
            '<w:r><w:rPr><w:rFonts w:hint="eastAsia"/></w:rPr><w:t>' + values[colIdx] + '</w:t></w:r>' +
            tcOld.substring(insertPosInTc);
          
          trNew = trNew.substring(0, tcStartInTr) + newTc + trNew.substring(tcEndInTr);
        }
        
        // tblXmlのtrを置換
        tblXml = tblXml.substring(0, trMatch.index) + trNew + tblXml.substring(trMatch.index + trOld.length);
      }
      
      docXml = docXml.substring(0, tblStart) + tblXml + docXml.substring(tblEnd);
    }

    // -- 5. A4 1枚に収めるための圧縮処理 --
    // 空段落（テキストを含まない<w:p>）の行間を 280 twips → 80 twips に圧縮
    docXml = docXml.replace(/<w:p[^>]*>[\s\S]*?<\/w:p>/g, function(pBlock){
      if(!/<w:t[ >]/.test(pBlock)){
        // 空段落 → line spacing を圧縮
        return pBlock.replace(/w:line="280"/, 'w:line="80"');
      }
      return pBlock;
    });
    // 上下マージンを少し圧縮（1ページに収まるよう）
    docXml = docXml.replace(/w:top="567"/, 'w:top="340"');
    docXml = docXml.replace(/w:bottom="817"/, 'w:bottom="340"');

    // 6. 書き戻し
    zip.file('word/document.xml', docXml);

    // 5. Blob 生成 → ダウンロード
    const blob = zip.generate({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const fileNameNo = c.display_case_no || c.case_no || '案件';
    a.download = `買付証明書_${fileNameNo}_${owner.name||'地権者'}.docx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✓ ダウンロード完了','success');
  }catch(e){
    console.error(e);
    showToast('生成エラー: '+e.message,'error');
  }
}

function showToast(msg,type='info'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(type==='error'?'error':type==='success'?'success':'');
  setTimeout(()=>{t.className='toast';},3000);
}
