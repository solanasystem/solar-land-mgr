<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2129;--border:#30363d;
  --text:#e6edf3;--text-muted:#8b949e;--accent:#a371f7;--blue:#58a6ff;
  --green:#3fb950;--yellow:#f0b429;--red:#f85149;
  --font-main:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-main);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.app-header-title{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--font-main);transition:all .15s;white-space:nowrap;}
.btn:hover{background:#272d36;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#8b5cf6;}
.btn-success{background:var(--green);border-color:var(--green);color:#fff;}
.btn-success:hover{background:#2ea043;}
.btn-ghost{background:transparent;}
.layout{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 60px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px;}
.main{padding:24px;overflow-y:auto;background:var(--bg);}
.section{margin-bottom:20px;}
.section-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.form-group{margin-bottom:10px;}
.form-label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;}
.form-input,.form-select{width:100%;padding:8px 10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:6px;font-size:13px;font-family:var(--font-main);}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent);}
.case-info-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;line-height:1.6;}
.case-info-card .row{display:flex;gap:8px;margin-bottom:4px;}
.case-info-card .lab{color:var(--text-muted);min-width:80px;}
.case-info-card .val{color:var(--text);flex:1;font-weight:500;}
.warning-banner{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.4);color:var(--yellow);padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;line-height:1.5;}
.empty-preview{padding:60px 20px;text-align:center;color:var(--text-muted);}
.empty-preview-icon{font-size:48px;margin-bottom:16px;}
.preview-toolbar{background:var(--surface);padding:10px 16px;border-radius:8px;margin-bottom:16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.preview-toolbar .info{font-size:12px;color:var(--text-muted);}
.method-info{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.3);color:#7ee787;padding:14px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;line-height:1.6;}
.method-info strong{color:#56d364;}
.method-info ol{margin:6px 0 0 24px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);color:var(--text);padding:12px 20px;border-radius:8px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:all .25s;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:var(--red);}
.toast.success{background:var(--green);}

/* docx生成済みのプレビュー（参考表示） */
.preview-area{
  background:var(--surface2);
  border:2px dashed var(--border);
  border-radius:8px;
  padding:40px 20px;
  text-align:center;
  color:var(--text-muted);
}
.preview-area h3{
  color:var(--text);
  font-size:18px;
  margin-bottom:12px;
}
.preview-area .case-summary{
  background:var(--surface);
  border-radius:6px;
  padding:16px;
  margin-top:20px;
  text-align:left;
  display:inline-block;
  min-width:400px;
}
.preview-area .case-summary table{
  width:100%;
  font-size:13px;
  color:var(--text);
}
.preview-area .case-summary table td{padding:4px 12px;}
.preview-area .case-summary table td:first-child{color:var(--text-muted);font-weight:500;width:40%;}
</style>
</head>
<body>

<header class="app-header no-print">
  <div class="app-header-title">
    <button class="btn btn-ghost" onclick="location.href='main.html'">← 戻る</button>
    📄 買付証明書（売渡承諾書付）
  </div>
  <span id="loadStatus" style="color:var(--text-muted);font-size:12px"></span>
</header>

<div class="layout">
  <aside class="sidebar no-print">
    <div class="section">
      <div class="section-title">📍 案件選択</div>
      <div class="form-group">
        <label class="form-label">電力会社エリアで絞込</label>
        <select class="form-select" id="filterArea" onchange="renderCaseSelect()">
          <option value="">すべての電力会社エリア</option>
          <option>北海道電力</option><option>東北電力</option><option>東京電力</option>
          <option>中部電力</option><option>北陸電力</option><option>関西電力</option>
          <option>中国電力</option><option>四国電力</option><option>九州電力</option>
          <option>沖縄電力</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">案件番号・地権者名で検索</label>
        <input class="form-input" type="text" id="searchQ" placeholder="例：中部-002、鈴木" oninput="renderCaseSelect()">
      </div>
      <div class="form-group">
        <label class="form-label">案件選択</label>
        <select class="form-select" id="caseSelect" onchange="onCaseChange()" size="14" style="height:280px;font-family:var(--font-mono);font-size:12px;">
          <option value="">読込中...</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📋 選択中の案件情報</div>
      <div id="caseInfoBox">
        <div class="case-info-card" style="color:var(--text-muted);">案件を選択してください</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="method-info">
      <strong>📥 Wordファイル（.docx）として生成・ダウンロード</strong>
      <ol>
        <li>左で案件を選択</li>
        <li>下の「Wordファイルとしてダウンロード」ボタンをクリック</li>
        <li>ダウンロードした .docx を開いて確認 → そのまま印刷 または PDFに出力</li>
      </ol>
      サンプル書類のレイアウト・フォント・字間・押印位置がそのまま保持されます。
    </div>

    <div class="preview-toolbar">
      <span class="info" id="previewInfo">案件未選択</span>
      <button class="btn btn-success" id="downloadBtn" onclick="downloadDocx()" disabled style="opacity:.5;cursor:not-allowed;">📥 Wordファイル(.docx)としてダウンロード</button>
    </div>

    <div id="preview">

let allCases=[],landownersByCase={},landsByCase={},currentCaseId=null;

function getPowerCompanyFromArea(a){
  if(!a)return null;a=a.trim();
  if(['中部','愛知','岐阜','三重','静岡','長野','名古屋','蒲郡市','田原市','豊橋市','豊田市','岡崎市','常滑市','西尾市','刈谷市','安城市','知立市'].some(k=>a.includes(k)))return'中部電力';
  if(['関西','近畿','大阪','京都','兵庫','奈良','和歌山','滋賀'].some(k=>a.includes(k)))return'関西電力';
  if(['関東','東京','神奈川','埼玉','千葉','茨城','栃木','群馬','山梨'].some(k=>a.includes(k)))return'東京電力';
  if(['九州','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島'].some(k=>a.includes(k)))return'九州電力';
  if(['中国','広島','岡山','鳥取','島根','山口'].some(k=>a.includes(k)))return'中国電力';
  if(['四国','愛媛','高知','徳島','香川'].some(k=>a.includes(k)))return'四国電力';
  if(['北陸','石川','富山','福井'].some(k=>a.includes(k)))return'北陸電力';
  if(['東北','青森','岩手','宮城','秋田','山形','福島','新潟'].some(k=>a.includes(k)))return'東北電力';
  if(['北海道','札幌'].some(k=>a.includes(k)))return'北海道電力';
  if(['沖縄','那覇'].some(k=>a.includes(k)))return'沖縄電力';
  return null;
}

document.addEventListener('DOMContentLoaded',async()=>{await loadData();});

async function loadData(){
  document.getElementById('loadStatus').textContent='読込中...';
  const[caseRes,loRes,ldRes]=await Promise.all([
    db.from('cases').select('id,case_no,area_name,status,kubun,price').order('case_no'),
    db.from('landowner_info').select('case_id,name,address,tel,postal_code,price,memo,created_at').order('created_at'),
    db.from('land_info').select('case_id,location,chiban,chimoku,area_sqm')
  ]);
  if(caseRes.error){showToast('案件読込エラー:'+caseRes.error.message,'error');return;}
  if(loRes.error){showToast('地権者読込エラー:'+loRes.error.message,'error');return;}
  if(ldRes.error){showToast('土地情報読込エラー:'+ldRes.error.message,'error');return;}
  allCases=caseRes.data||[];
  landownersByCase={};
  (loRes.data||[]).forEach(lo=>{if(lo.case_id)(landownersByCase[lo.case_id]=landownersByCase[lo.case_id]||[]).push(lo);});
  landsByCase={};
  (ldRes.data||[]).forEach(l=>{if(l.case_id)(landsByCase[l.case_id]=landsByCase[l.case_id]||[]).push(l);});
  document.getElementById('loadStatus').textContent=`案件 ${allCases.length}件`;
  renderCaseSelect();
}

function getFilteredCases(){
  const area=document.getElementById('filterArea').value;
  const q=(document.getElementById('searchQ').value||'').toLowerCase();
  return allCases.filter(c=>{
    if(area){const pc=getPowerCompanyFromArea(c.area_name);if(pc!==area)return false;}
    if(q){
      const caseNo=(c.case_no||'').toLowerCase();
      const ownerNames=(landownersByCase[c.id]||[]).map(lo=>(lo.name||'').toLowerCase()).join(' ');
      if(!caseNo.includes(q)&&!ownerNames.includes(q))return false;
    }
    return true;
  });
}

function renderCaseSelect(){
  const list=getFilteredCases();
  const sel=document.getElementById('caseSelect');
  if(!list.length){sel.innerHTML='<option value="">該当なし</option>';return;}
  sel.innerHTML=list.map(c=>{
    const owners=landownersByCase[c.id]||[];
    const ownerName=owners[0]?.name||'(地権者未登録)';
    const dup=owners.length>1?` ⚠×${owners.length}`:'';
    return `<option value="${c.id}">${c.case_no} / ${ownerName}${dup}</option>`;
  }).join('');
  if(currentCaseId&&list.some(c=>c.id===currentCaseId))sel.value=currentCaseId;
}

function onCaseChange(){
  const sel=document.getElementById('caseSelect');
  currentCaseId=sel.value||null;
  if(!currentCaseId){
    document.getElementById('caseInfoBox').innerHTML='<div class="case-info-card" style="color:var(--text-muted);">案件を選択してください</div>';
    document.getElementById('preview').innerHTML='<div class="preview-area"><div style="font-size:48px;margin-bottom:16px;">📄</div><h3>左の一覧から案件を選択してください</h3></div>';
    document.getElementById('previewInfo').textContent='案件未選択';
    setBtn(false);return;
  }
  renderCaseInfo(currentCaseId);
  renderPreview(currentCaseId);
  setBtn(true);
}

function setBtn(en){
  const b=document.getElementById('downloadBtn');
  b.disabled=!en;b.style.opacity=en?'1':'.5';b.style.cursor=en?'pointer':'not-allowed';
}

function renderCaseInfo(caseId){
  const c=allCases.find(x=>x.id===caseId);
  const owners=landownersByCase[caseId]||[];
  const lands=landsByCase[caseId]||[];
  const box=document.getElementById('caseInfoBox');
  let html='<div class="case-info-card">';
  html+=`<div class="row"><span class="lab">案件番号</span><span class="val">${c?.case_no||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">エリア</span><span class="val">${c?.area_name||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">区分</span><span class="val">${c?.kubun||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">ステータス</span><span class="val">${c?.status||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">地権者</span><span class="val">${owners.map(o=>o.name||'(無名)').join(' / ')||'未登録'}</span></div>`;
  html+=`<div class="row"><span class="lab">土地件数</span><span class="val">${lands.length}件</span></div>`;
  const price=owners[0]?.price;
  html+=`<div class="row"><span class="lab">金額</span><span class="val">${price?Number(price).toLocaleString()+'円':'未登録'}</span></div>`;
  html+='</div>';
  if(owners.length>1) html+='<div class="warning-banner" style="margin-top:8px;">⚠ 地権者レコードが <strong>'+owners.length+'件</strong> あります。書類は<strong>1件目（'+(owners[0]?.name||'-')+'）</strong>を使用します。</div>';
  if(!owners.length) html+='<div class="warning-banner" style="margin-top:8px;border-color:rgba(248,81,73,.4);color:var(--red);background:rgba(248,81,73,.08);">❌ 地権者情報が未登録です。</div>';
  if(!lands.length) html+='<div class="warning-banner" style="margin-top:8px;border-color:rgba(248,81,73,.4);color:var(--red);background:rgba(248,81,73,.08);">❌ 土地情報が未登録です。</div>';
  if(owners.length&&!price) html+='<div class="warning-banner" style="margin-top:8px;">⚠ 金額が未登録です。</div>';
  box.innerHTML=html;
  document.getElementById('previewInfo').textContent=`${c?.case_no||''} を選択中`;
}

function renderPreview(caseId){
  const c=allCases.find(x=>x.id===caseId);
  const owners=landownersByCase[caseId]||[];
  const lands=landsByCase[caseId]||[];
  const owner=owners[0]||{};
  const today=getReiwaToday();
  const priceText=owner.price?Number(owner.price).toLocaleString():'(未設定)';

  let landsHtml='';
  for(let i=0;i<3;i++){
    const l=lands[i];
    if(l){
      landsHtml+=`<tr><td>${i+1}</td><td>${escapeHtml(l.location||'')}</td><td>${escapeHtml(l.chiban||'')}</td><td>${escapeHtml(l.chimoku||'')}</td><td>${l.area_sqm||''}</td></tr>`;
    }
  }

  document.getElementById('preview').innerHTML=`
    <div class="preview-area">
      <h3>📄 生成内容のプレビュー</h3>
      <div style="color:var(--text-muted);font-size:13px;margin-bottom:8px;">下のボタンをクリックして Wordファイル(.docx) をダウンロードします。</div>
      <div class="case-summary">
        <table>
          <tr><td>管理No.（案件番号）</td><td>${escapeHtml(c?.case_no||'')}</td></tr>
          <tr><td>地権者名</td><td>${escapeHtml(owner.name||'(未登録)')}</td></tr>
          <tr><td>金額（売渡・買付）</td><td>${priceText} 円</td></tr>
          <tr><td>買付日（今日）</td><td>令和${today.year}年 ${today.month}月 ${today.day}日</td></tr>
          <tr><td>土地件数</td><td>${lands.length}件 (最大3件まで書類に記載)</td></tr>
        </table>
        ${landsHtml?'<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">不動産の表示（先頭3件）：</div><table style="margin-top:4px;font-size:12px;"><tr style="color:var(--text-muted);"><td>#</td><td>所在</td><td>地番</td><td>地目</td><td>地積㎡</td></tr>'+landsHtml+'</table>':''}
      </div>
    </div>`;
}

function getReiwaToday(){
  const now=new Date();
  return{year:now.getFullYear()-2018,month:now.getMonth()+1,day:now.getDate()};
}

function escapeHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function xmlEscape(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

// 全角空白でセンタリングパディング
function padCenter(text, totalChars){
  const len = [...text].length;
  if(len >= totalChars) return text;
  const padding = totalChars - len;
  const left = Math.floor(padding/2);
  const right = padding - left;
  return '\u3000'.repeat(left) + text + '\u3000'.repeat(right);
}

// base64 → Uint8Array
function base64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function downloadDocx(){
  if(!currentCaseId){showToast('案件を選択してください','error');return;}
  const c=allCases.find(x=>x.id===currentCaseId);
  const owners=landownersByCase[currentCaseId]||[];
  const lands=landsByCase[currentCaseId]||[];
  const owner=owners[0]||{};
  const today=getReiwaToday();

  try{
    showToast('docx生成中...','info');

    // 1. base64 → bytes → PizZip
    const bytes = base64ToBytes(TEMPLATE_DOCX_B64);
    const zip = new PizZip(bytes.buffer);

    // 2. document.xml 取得
    const docXmlFile = zip.file('word/document.xml');
    if(!docXmlFile){throw new Error('document.xml not found');}
    let docXml = docXmlFile.asText();

    // 3. プレースホルダ置換
    const priceText = owner.price ? Number(owner.price).toLocaleString() : '';
    const ownerName = owner.name || '';

    // 金額（8文字分の幅にセンタリング）
    docXml = docXml.replaceAll('{{PRICE1}}', xmlEscape(padCenter(priceText, 8)));
    docXml = docXml.replaceAll('{{PRICE2}}', xmlEscape(padCenter(priceText, 8)));
    // 地権者名（13文字分の幅にセンタリング）
    docXml = docXml.replaceAll('{{OWNER_NAME}}', xmlEscape(padCenter(ownerName, 13)));
    // 日付
    docXml = docXml.replaceAll('{{REIWA_YEAR}}', String(today.year));
    docXml = docXml.replaceAll('{{MONTH}}', String(today.month));
    docXml = docXml.replaceAll('{{DAY}}', String(today.day));
    // 管理No.
    docXml = docXml.replaceAll('{{ADMIN_NO}}', xmlEscape(c?.case_no||''));
    // 不動産表示テーブル（行1-3）
    for(let i=1;i<=3;i++){
      const l = lands[i-1] || {};
      docXml = docXml.replaceAll('{{LAND_LOC'+i+'}}', xmlEscape(l.location||''));
      docXml = docXml.replaceAll('{{LAND_CHIBAN'+i+'}}', xmlEscape(l.chiban||''));
      docXml = docXml.replaceAll('{{LAND_CHIMOKU'+i+'}}', xmlEscape(l.chimoku||''));
      docXml = docXml.replaceAll('{{LAND_AREA'+i+'}}', l.area_sqm ? xmlEscape(Number(l.area_sqm).toLocaleString()) : '');
      docXml = docXml.replaceAll('{{LAND_OWNER'+i+'}}', l ? xmlEscape(owner.name||'') : '');
      docXml = docXml.replaceAll('{{LAND_SHARE'+i+'}}', '');
    }

    // 4. 書き戻し
    zip.file('word/document.xml', docXml);

    // 5. Blob 生成 → ダウンロード
    const blob = zip.generate({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `買付証明書_${c.case_no||'案件'}_${owner.name||'地権者'}.docx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✓ ダウンロード完了','success');
  }catch(e){
    console.error(e);
    showToast('生成エラー: '+e.message,'error');
  }
}

function showToast(msg,type='info'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(type==='error'?'error':type==='success'?'success':'');
  setTimeout(()=>{t.className='toast';},3000);
}
