<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📄 買付証明書 | SOLAR LAND MGR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2129;--border:#30363d;
  --text:#e6edf3;--text-muted:#8b949e;--accent:#a371f7;--blue:#58a6ff;
  --green:#3fb950;--yellow:#f0b429;--red:#f85149;--orange:#fd7e14;
  --font-main:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-doc:"游ゴシック","Yu Gothic","Yu Gothic Medium","YuGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo","ＭＳ Ｐゴシック","MS PGothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-main);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;}
.header-actions{display:flex;gap:8px;align-items:center;}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--font-main);transition:all .15s;white-space:nowrap;}
.btn:hover{background:#272d36;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#8b5cf6;}
.btn-ghost{background:transparent;}
.layout{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 60px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px;}
.main{padding:24px;overflow-y:auto;background:var(--bg);}
.section{margin-bottom:20px;}
.section-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.form-group{margin-bottom:10px;}
.form-label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;}
.form-input,.form-select{width:100%;padding:8px 10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:6px;font-size:13px;font-family:var(--font-main);}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent);}
.case-info-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;line-height:1.6;}
.case-info-card .row{display:flex;gap:8px;margin-bottom:4px;}
.case-info-card .lab{color:var(--text-muted);min-width:80px;}
.case-info-card .val{color:var(--text);flex:1;font-weight:500;}
.warning-banner{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.4);color:var(--yellow);padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;line-height:1.5;}
.empty-preview{padding:60px 20px;text-align:center;color:var(--text-muted);}
.empty-preview-icon{font-size:48px;margin-bottom:16px;}
.preview-toolbar{background:var(--surface);padding:10px 16px;border-radius:8px;margin-bottom:16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.preview-toolbar .info{font-size:12px;color:var(--text-muted);}

/* ════════════════════════════════════════════════════════════════
   買付証明書（A4 1枚厳守・サンプル書類忠実再現）
   過去の letter-generator の知見を完全反映
   - フォント：11pt（PDF実測値）
   - 行間：1.29（PDF実測値）
   - letter-spacing：-0.1pt（ブラウザ字間圧縮）
   - 左右余白：22mm（1行42文字確保）
   ════════════════════════════════════════════════════════════════ */

.agreement-sheet{
  width:210mm;
  min-height:297mm;
  padding:5mm 22mm;
  margin:0 auto 16px;
  background:#fff;color:#000;
  font-family:var(--font-doc);
  font-size:11pt;
  line-height:1.32;
  letter-spacing:0;
  page-break-after:always;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  box-sizing:border-box;
  position:relative;
}
/* A4はみ出し警告線（画面プレビュー時のみ） */
.agreement-sheet::after{
  content:"";
  display:block;
  position:absolute;
  left:0;right:0;
  top:297mm;
  border-top:2px dashed #f85149;
  pointer-events:none;
  margin-top:-1mm;
}

/* 日付行（タイトルの上・右寄せ） */
.ag-date-row{
  text-align:right;
  font-size:10.5pt;
  letter-spacing:1.5pt;
  margin-bottom:0.5mm;
}
.ag-date-row .blank{display:inline-block;min-width:6mm;text-align:center;font-weight:500;}

/* タイトル行（中央） */
.ag-title-row{
  text-align:center;
  margin-bottom:1.5mm;
}
.ag-title-row .title{
  font-size:16pt;font-weight:700;
  letter-spacing:4pt;
  display:inline-block;
  padding-left:4pt;
}

/* 宛先行（売渡側：左揃え、下線なし） */
.ag-to-plain{
  font-size:10.5pt;
  margin:1mm 0 1.5mm 0;
  font-weight:500;
}
/* 宛先行（買付側：地権者名を下線付き表示） */
.ag-to-underlined{
  font-size:10.5pt;
  margin:1mm 0 1.5mm 0;
}
.ag-to-underlined .name-slot{
  display:inline-block;
  min-width:64mm;
  border-bottom:0.6pt solid #000;
  padding:0 4pt 1pt 4pt;
  text-align:center;
  font-size:11.5pt;
  font-weight:500;
  letter-spacing:1.5pt;
}
.ag-to-underlined .sama{padding-left:6pt;font-size:11pt;}

/* 本文 */
.ag-body{
  font-size:11pt;
  line-height:1.32;
  margin-bottom:1.5mm;
  letter-spacing:-0.1pt;
}

/* 条項リスト */
.ag-clauses{
  font-size:11pt;
  line-height:1.55;
  margin:1mm 0;
}
.ag-clause{display:flex;align-items:baseline;margin:0;}
.ag-clause .num{flex:0 0 7mm;font-weight:500;}
.ag-clause .lab{flex:0 0 38mm;letter-spacing:1.0pt;white-space:nowrap;}
.ag-clause .val{flex:1;}
.ag-clause .price-row{display:inline-flex;align-items:baseline;}
.ag-clause .price-row .price-val{
  display:inline-block;min-width:36mm;
  border-bottom:0.7pt solid #000;
  text-align:center;
  font-weight:500;
  padding:0 2pt 0.5pt 2pt;
  letter-spacing:1pt;
}

/* 当事者ブロック（売主・買主） */
.ag-party-block{
  margin:1mm 0 1mm 36mm;
  font-size:11pt;
  line-height:1.5;
  position:relative;  /* 押印の絶対配置の基準 */
}
.ag-party-block .head{
  font-weight:500;
  font-size:11pt;
  letter-spacing:0.5pt;
  margin-bottom:0;
}
.ag-party-block .row{
  display:flex;align-items:baseline;
}
.ag-party-block .row .lab{
  flex:0 0 18mm;
  letter-spacing:3pt;
}
.ag-party-block .row .val{flex:1;}
.ag-party-block .row .stamp-mark{margin-left:4mm;font-size:11pt;}
/* 社印は買主ブロック全体の右側に絶対配置（社名行と代表取締役行をまたぐ） */
.ag-party-block .seal-img{
  position:absolute;
  right:-22mm;
  top:50%;
  transform:translateY(-15%);
  height:16mm;
  width:auto;
}

/* 区切り線（>>> ... <<<） */
.ag-cut{
  display:flex;align-items:center;justify-content:space-between;
  margin:0.8mm 0;
  font-size:10pt;color:#000;
  letter-spacing:3pt;
}
.ag-cut .left,.ag-cut .right{flex:0 0 auto;}
.ag-cut .line{
  flex:1;height:0;
  border-top:0.5pt dashed #000;
  margin:0 4mm;
}

/* 不動産の表示タイトル */
.ag-table-title{
  text-align:center;
  font-size:13pt;font-weight:700;
  letter-spacing:3pt;
  margin:1.5mm 0 1.2mm 0;
}

/* 不動産の表示テーブル */
.ag-land-table{
  width:100%;
  border-collapse:collapse;
  font-size:10pt;
  margin-bottom:1mm;
}
.ag-land-table th,
.ag-land-table td{
  border:0.6pt solid #000;
  padding:1mm 2mm;
  text-align:center;
  vertical-align:middle;
  line-height:1.2;
}
.ag-land-table th{
  background:#e8e8e8;
  font-weight:500;
  font-size:10pt;
}
.ag-land-table th .area-sub{
  display:block;font-size:8.5pt;font-weight:400;
}
.ag-land-table td.loc{text-align:center;}
.ag-land-table td.area{text-align:right;padding-right:3mm;}
.ag-land-table tr{height:6mm;}

/* 確認事項タイトル */
.ag-confirm-title{
  text-align:center;
  font-size:13pt;font-weight:700;
  letter-spacing:3pt;
  margin:1.5mm 0 1.2mm 0;
  border-top:0.5pt dashed #000;
  padding-top:1.2mm;
}

/* 確認事項リスト */
.ag-confirm-list{
  font-size:10.5pt;
  line-height:1.35;
}
.ag-confirm-item{
  display:flex;
  margin:0.4mm 0;
}
.ag-confirm-item .num{
  flex:0 0 6mm;
  font-weight:500;
}
.ag-confirm-item .text{
  flex:1;
}
.ag-confirm-item .text .indent{
  display:block;
  margin-top:0.1mm;
  padding-left:0;
}
/* 確認事項１．を赤字（サンプル通り） */
.ag-confirm-item.highlight .num,
.ag-confirm-item.highlight .text{
  color:#d63838;
}

/* 管理No.（右下絶対配置） */
.ag-admin-no{
  position:absolute;
  bottom:5mm;
  right:22mm;
  display:flex;
}
.ag-admin-no .lab{
  border:0.6pt solid #000;
  padding:1.2mm 4mm;
  font-size:10pt;
  background:#fff;
}
.ag-admin-no .val{
  border:0.6pt solid #000;
  border-left:none;
  padding:1.2mm 4mm;
  font-size:10.5pt;
  font-weight:500;
  min-width:38mm;
  text-align:center;
  font-family:var(--font-mono);
  letter-spacing:0.5pt;
}

/* ───── 印刷モード（Edge対策で !important 必須） ───── */
@media print{
  @page{size:A4;margin:0;}
  body{background:#fff !important;margin:0;padding:0;}
  .header,.sidebar,.preview-toolbar,.layout{all:unset;display:block;}
  .layout{display:block;}
  .main{padding:0;margin:0;background:#fff;}
  .agreement-sheet{
    box-shadow:none !important;
    margin:0 !important;
    page-break-after:auto !important;
    width:210mm !important;
    height:297mm !important;
    min-height:297mm !important;
    max-height:297mm !important;
    padding:5mm 22mm !important;
  }
  .agreement-sheet::after{display:none !important;}
  .empty-preview{display:none;}
  .no-print{display:none !important;}
  /* テーブル分割禁止 */
  tr{page-break-inside:avoid;}
  .ag-table-title,.ag-land-table,
  .ag-confirm-title,.ag-confirm-list,
  .ag-party-block{page-break-inside:avoid;}
}

.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);color:var(--text);padding:12px 20px;border-radius:8px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:all .25s;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:var(--red);}
.toast.success{background:var(--green);}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-muted);}
</style>
</head>

<header class="header no-print">
  <div class="header-title">
    <button class="btn btn-ghost" onclick="location.href='main.html'">← 戻る</button>
    📄 買付証明書（売渡承諾書付）
  </div>
  <div class="header-actions">
    <span id="loadStatus" style="color:var(--text-muted);font-size:12px"></span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar no-print">
    <div class="section">
      <div class="section-title">📍 案件選択</div>
      <div class="form-group">
        <label class="form-label">電力会社エリアで絞込</label>
        <select class="form-select" id="filterArea" onchange="renderCaseSelect()">
          <option value="">すべての電力会社エリア</option>
          <option>北海道電力</option><option>東北電力</option><option>東京電力</option>
          <option>中部電力</option><option>北陸電力</option><option>関西電力</option>
          <option>中国電力</option><option>四国電力</option><option>九州電力</option>
          <option>沖縄電力</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">案件番号・地権者名で検索</label>
        <input class="form-input" type="text" id="searchQ" placeholder="例：中部-002、鈴木" oninput="renderCaseSelect()">
      </div>
      <div class="form-group">
        <label class="form-label">案件選択</label>
        <select class="form-select" id="caseSelect" onchange="onCaseChange()" size="14" style="height:280px;font-family:var(--font-mono);font-size:12px;">
          <option value="">読込中...</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📋 選択中の案件情報</div>
      <div id="caseInfoBox">
        <div class="case-info-card" style="color:var(--text-muted);">
          案件を選択してください
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="preview-toolbar no-print">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span class="info" id="previewInfo">案件未選択</span>
      </div>
      <div>
        <button class="btn btn-primary" id="printBtn" onclick="window.print()" disabled style="opacity:.5;cursor:not-allowed;">🖨 印刷 / PDF化</button>
      </div>
    </div>
    <div id="agreementPreview">
      <div class="empty-preview">
        <div class="empty-preview-icon">📄</div>
        左の一覧から案件を選択すると<br>ここに買付証明書のプレビューが表示されます
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

function getPowerCompanyFromArea(areaName){
  if(!areaName) return null;
  const a=areaName.trim();
  if(['中部','愛知','岐阜','三重','静岡','長野','名古屋','蒲郡市','田原市','豊橋市','豊田市','岡崎市','常滑市','西尾市','刈谷市','安城市','知立市'].some(k=>a.includes(k)))return'中部電力';
  if(['関西','近畿','大阪','京都','兵庫','奈良','和歌山','滋賀'].some(k=>a.includes(k)))return'関西電力';
  if(['関東','東京','神奈川','埼玉','千葉','茨城','栃木','群馬','山梨'].some(k=>a.includes(k)))return'東京電力';
  if(['九州','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島'].some(k=>a.includes(k)))return'九州電力';
  if(['中国','広島','岡山','鳥取','島根','山口'].some(k=>a.includes(k)))return'中国電力';
  if(['四国','愛媛','高知','徳島','香川'].some(k=>a.includes(k)))return'四国電力';
  if(['北陸','石川','富山','福井'].some(k=>a.includes(k)))return'北陸電力';
  if(['東北','青森','岩手','宮城','秋田','山形','福島','新潟'].some(k=>a.includes(k)))return'東北電力';
  if(['北海道','札幌'].some(k=>a.includes(k)))return'北海道電力';
  if(['沖縄','那覇'].some(k=>a.includes(k)))return'沖縄電力';
  return null;
}

document.addEventListener('DOMContentLoaded',async()=>{
  await loadData();
});

async function loadData(){
  document.getElementById('loadStatus').textContent='読込中...';
  const[caseRes,loRes,ldRes]=await Promise.all([
    db.from('cases').select('id,case_no,area_name,status,kubun,price').order('case_no'),
    db.from('landowner_info').select('case_id,name,address,tel,postal_code,price,memo,created_at').order('created_at'),
    db.from('land_info').select('case_id,location,chiban,chimoku,area_sqm')
  ]);
  if(caseRes.error){showToast('案件読込エラー: '+caseRes.error.message,'error');return;}
  if(loRes.error){showToast('地権者読込エラー: '+loRes.error.message,'error');return;}
  if(ldRes.error){showToast('土地情報読込エラー: '+ldRes.error.message,'error');return;}

  allCases=caseRes.data||[];
  landownersByCase={};
  (loRes.data||[]).forEach(lo=>{
    if(!lo.case_id)return;
    (landownersByCase[lo.case_id]=landownersByCase[lo.case_id]||[]).push(lo);
  });
  landsByCase={};
  (ldRes.data||[]).forEach(l=>{
    if(!l.case_id)return;
    (landsByCase[l.case_id]=landsByCase[l.case_id]||[]).push(l);
  });

  document.getElementById('loadStatus').textContent=`案件 ${allCases.length}件`;
  renderCaseSelect();
}

function getFilteredCases(){
  const area=document.getElementById('filterArea').value;
  const q=(document.getElementById('searchQ').value||'').toLowerCase();
  return allCases.filter(c=>{
    if(area){
      const pc=getPowerCompanyFromArea(c.area_name);
      if(pc!==area)return false;
    }
    if(q){
      const caseNo=(c.case_no||'').toLowerCase();
      const ownerNames=(landownersByCase[c.id]||[]).map(lo=>(lo.name||'').toLowerCase()).join(' ');
      if(!caseNo.includes(q)&&!ownerNames.includes(q))return false;
    }
    return true;
  });
}

function renderCaseSelect(){
  const list=getFilteredCases();
  const sel=document.getElementById('caseSelect');
  if(!list.length){
    sel.innerHTML='<option value="">該当なし</option>';
    return;
  }
  sel.innerHTML=list.map(c=>{
    const owners=landownersByCase[c.id]||[];
    const ownerName=owners[0]?.name||'(地権者未登録)';
    const dup=owners.length>1?` ⚠×${owners.length}`:'';
    return `<option value="${c.id}">${c.case_no} / ${ownerName}${dup}</option>`;
  }).join('');
  if(currentCaseId&&list.some(c=>c.id===currentCaseId)){
    sel.value=currentCaseId;
  }
}

function onCaseChange(){
  const sel=document.getElementById('caseSelect');
  const caseId=sel.value;
  currentCaseId=caseId||null;
  if(!caseId){
    document.getElementById('caseInfoBox').innerHTML='<div class="case-info-card" style="color:var(--text-muted);">案件を選択してください</div>';
    document.getElementById('agreementPreview').innerHTML='<div class="empty-preview"><div class="empty-preview-icon">📄</div>左の一覧から案件を選択すると<br>ここに買付証明書のプレビューが表示されます</div>';
    document.getElementById('previewInfo').textContent='案件未選択';
    setPrintBtn(false);
    return;
  }
  renderCaseInfo(caseId);
  renderAgreement(caseId);
  setPrintBtn(true);
}

function setPrintBtn(enabled){
  const btn=document.getElementById('printBtn');
  btn.disabled=!enabled;
  btn.style.opacity=enabled?'1':'.5';
  btn.style.cursor=enabled?'pointer':'not-allowed';
}

function renderCaseInfo(caseId){
  const c=allCases.find(x=>x.id===caseId);
  const owners=landownersByCase[caseId]||[];

  const box=document.getElementById('caseInfoBox');
  let html='<div class="case-info-card">';
  html+=`<div class="row"><span class="lab">案件番号</span><span class="val">${c?.case_no||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">エリア</span><span class="val">${c?.area_name||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">区分</span><span class="val">${c?.kubun||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">ステータス</span><span class="val">${c?.status||'-'}</span></div>`;
  html+=`<div class="row"><span class="lab">地権者</span><span class="val">${owners.map(o=>o.name||'(無名)').join(' / ')||'未登録'}</span></div>`;
  html+=`<div class="row"><span class="lab">土地件数</span><span class="val">${lands.length}件</span></div>`;
  const price=owners[0]?.price;
  html+=`<div class="row"><span class="lab">金額</span><span class="val">${price?Number(price).toLocaleString()+'円':'未登録'}</span></div>`;
  html+='</div>';

  if(owners.length>1){
    html+='<div class="warning-banner" style="margin-top:8px;">⚠ 地権者レコードが <strong>'+owners.length+'件</strong> あります。書類は<strong>1件目（'+(owners[0]?.name||'-')+'）</strong>を使用します。</div>';
  }
  if(!owners.length){
    html+='<div class="warning-banner" style="margin-top:8px;border-color:rgba(248,81,73,.4);color:var(--red);background:rgba(248,81,73,.08);">❌ 地権者情報が未登録です。</div>';
  }
  if(!lands.length){
    html+='<div class="warning-banner" style="margin-top:8px;border-color:rgba(248,81,73,.4);color:var(--red);background:rgba(248,81,73,.08);">❌ 土地情報が未登録です。</div>';
  }
  if(owners.length&&!price){
    html+='<div class="warning-banner" style="margin-top:8px;">⚠ 金額が未登録です（書類の金額欄空欄）。</div>';
  }
  box.innerHTML=html;
  document.getElementById('previewInfo').textContent=`${c?.case_no||''} を選択中`;
}

function getReiwaToday(){
  const now=new Date();
  const reiwaYear=now.getFullYear()-2018;
  return{year:reiwaYear,month:now.getMonth()+1,day:now.getDate()};
}

function escapeHtml(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

  <div class="ag-clauses">
    <div class="ag-clause">
      <span class="num">１．</span>
      <span class="lab">買付金額</span>
      <span class="val">
        <span class="price-row">
          <span class="price-val">${priceText}</span><span style="padding:0 1mm;">円</span><span style="font-size:10pt;">（非課税）</span>
        </span>
      </span>
    </div>
    <div class="ag-clause">
      <span class="num">２．</span>
      <span class="lab">売買契約締結日</span>
      <span class="val">電力会社からの工事負担金額回答による事業性判断決定後。</span>
    </div>
    <div class="ag-clause">
      <span class="num">３．</span>
      <span class="lab">支払方法・時期</span>
      <span class="val">買主との売買契約による。</span>
    </div>
    <div class="ag-clause">
      <span class="num">４．</span>
      <span class="lab">そ　の　他</span>
      <span class="val">本書に記載のない事項は別途協議とさせていただきます。</span>
    </div>
  </div>

  <div class="ag-party-block">
    <div class="head">【買主】※代理</div>
    <div class="row"><span class="lab">住　所</span><span class="val">${escapeHtml(BUYER_FIXED.address)}</span></div>
    <div class="row"><span class="lab">社　名</span><span class="val">${escapeHtml(BUYER_FIXED.company)}</span></div>
    <div class="row"><span class="lab"></span><span class="val">${escapeHtml(BUYER_FIXED.representative)}　　印</span></div>
    <img src="${SEAL_IMG}" class="seal-img" alt="社印">
  </div>

  <div class="ag-cut">
    <span class="left">＞　＞　＞</span>
    <span class="line"></span>
    <span class="right">＜　＜　＜</span>
  </div>

  <div class="ag-table-title">不動産の表示</div>
  <table class="ag-land-table">
    <thead>
      <tr>
        <th style="width:30%;">所在</th>
        <th style="width:11%;">地番</th>
        <th style="width:11%;">地目</th>
        <th style="width:14%;">地積（㎡）<span class="area-sub">※公簿</span></th>
        <th style="width:22%;">登記上所有者</th>
        <th style="width:12%;">持分</th>
      </tr>
    </thead>
    <tbody>${tableRows}</tbody>
  </table>

  <div class="ag-confirm-title">確認事項</div>
  <div class="ag-confirm-list">
    <div class="ag-confirm-item highlight">
      <span class="num">１．</span>
      <span class="text">売主は、本土地の売買に伴う「優先交渉権」を買主（代理）に与えるものとし、売主が第三者（同業他社）と交渉する場合には、事前に連絡するものとする。<span class="indent">なお、優先交渉権の期間は本不動産売買承諾日から６ヶ月とする。</span></span>
    </div>
    <div class="ag-confirm-item">
      <span class="num">２．</span>
      <span class="text">本不動産売渡承諾書ならび本不動産買付証明書は、土地の売買に対し双方の意思を確認するものであり、法的に拘束するものではありません。</span>
    </div>
    <div class="ag-confirm-item">
      <span class="num">３．</span>
      <span class="text">売主は本書をもって、買主が電力会社への接続検討および関係行政機関への協議を行うこと。ならびに調査のため該当地に立ち入ることを了承する。</span>
    </div>
    <div class="ag-confirm-item">
      <span class="num">４．</span>
      <span class="text">売主および買主は、やむを得ない事情がある場合は本不動産売渡承諾書ならび本不動産買付証明書をキャンセルすることができる。<span class="indent">なお、双方ともキャンセルに伴う違約金の請求はできないものとする。</span></span>
    </div>
    <div class="ag-confirm-item">
      <span class="num">５．</span>
      <span class="text">本書を２通作成し、買主売主それぞれ１通を保有する。</span>
    </div>
  </div>

  <div class="ag-admin-no">
    <div class="lab">管理No.</div>
    <div class="val">${escapeHtml(c?.case_no||'')}</div>
  </div>

</div>
`;
  document.getElementById('agreementPreview').innerHTML=html;
}

function showToast(msg,type='info'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(type==='error'?'error':type==='success'?'success':'');
  setTimeout(()=>{t.className='toast';},3000);
}
</script>
