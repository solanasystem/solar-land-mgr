<!DOCTYPE html>
<!-- BUILD: nouhin-structure v20260816c / 東員町の除外を「確定納品300(confirmed)の時だけ」に限定。全ステータス表示では東員町の確認中案件も出す(前:全画面で消していた)。 -->
<!-- BUILD: nouhin-structure v20260816b / 納品情報を3軸(①クライアント×②納品時期(period)×③行政区域(pref/city))で階層表示する構造ビュー。データ駆動(client_deliveries/client_delivery_items)・読み取り専用・検索・ログイン必須。栗本さんのクライアント問い合わせ即応の参照台帳。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>納品情報 構造ビュー // GRID LAND MGR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common-auth.js?v=20260813kuroki"></script>
<style>
  :root{--bg:#0d1117;--surf:#161c22;--surf2:#1b2530;--bd:#2a3742;--ink:#e6edf3;--soft:#9fb0bd;--acc:#00d4ff;
    --ok:#3fb950;--warn:#d29922;--danger:#f0736a;--mono:Consolas,"Yu Gothic",monospace;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;font-size:14px}
  .top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0d1117,rgba(13,17,23,.92));border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .top h1{font-size:17px;font-weight:800}
  .top .sub{color:var(--soft);font-size:12px}
  .top .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
  input#q{background:var(--surf);border:1px solid var(--bd);border-radius:7px;color:var(--ink);padding:7px 12px;font-size:13px;width:240px}
  select#st{background:var(--surf);border:1px solid var(--bd);border-radius:7px;color:var(--ink);padding:7px 10px;font-size:13px}
  .wrap{padding:16px 20px 60px;max-width:1100px;margin:0 auto}
  .node{margin:2px 0}
  .row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;cursor:pointer;user-select:none}
  .row:hover{background:var(--surf)}
  .tw{width:14px;color:var(--soft);font-family:var(--mono);flex:none}
  .lv1>.row{background:var(--surf);border:1px solid var(--bd);font-weight:800;font-size:15px}
  .lv2>.row{margin-left:16px;font-weight:700;color:var(--acc)}
  .lv3>.row{margin-left:32px;font-weight:600}
  .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--soft)}
  .badge{font-family:var(--mono);font-size:10px;border-radius:999px;padding:1px 8px;border:1px solid var(--bd);color:var(--soft)}
  .kids{display:none}
  .node.open>.kids{display:block}
  table.cases{width:calc(100% - 48px);margin:4px 0 8px 48px;border-collapse:collapse;font-size:12.5px}
  table.cases th,table.cases td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
  table.cases th{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  td.no{color:var(--acc);font-family:var(--mono);text-align:right}
  td.mono{font-family:var(--mono)}
  .st-confirmed{color:var(--ok)} .st-hold{color:var(--warn)} .st-removed{color:var(--danger)}
  a{color:var(--acc)}
  .loading{padding:40px;text-align:center;color:var(--soft)}
  .editBtn{background:var(--surf2);border:1px solid var(--bd);color:var(--acc);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer}
  .editBtn:hover{border-color:var(--acc)}
  tr.edit-row input{background:var(--surf);border:1px solid var(--bd);border-radius:5px;color:var(--ink);padding:4px 7px;font-size:12px}
  tr.edit-row label{color:var(--soft);font-size:11px;display:flex;flex-direction:column;gap:2px}
  tr.edit-row button{border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:var(--surf2);color:var(--ink)}
  tr.edit-row button:first-of-type{background:var(--acc);color:#05252e;font-weight:800;border-color:var(--acc)}
</style>
</head>
<body>
<div class="top">
  <div><h1>📦 納品情報 構造ビュー</h1><div class="sub">①クライアント × ②納品時期 × ③行政区域 で階層表示（データ駆動・読み取り専用）</div></div>
  <div class="sp">
    <select id="st">
      <option value="confirmed">確定納品のみ(confirmed)</option>
      <option value="all">全ステータス</option>
    </select>
    <select id="filterClient"><option value="">クライアント：全て</option></select>
    <select id="filterRound"><option value="">納品回：全て</option></select>
    <input id="q" placeholder="検索：地番・所在・市・県…">
    <a href="mode-select.html" style="font-size:12px">← 戻る</a>
  </div>
</div>
<div class="wrap">
  <div id="deliverySummary" style="margin-bottom:18px"></div>
  <div id="tree" class="loading">読み込み中…</div>
</div>

<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://fygnrjjifoasozbhkxlk.supabase.co';
  var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5Z25yamppZm9hc296YmhreGxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDYzNTEsImV4cCI6MjA5MDE4MjM1MX0.A1fAMcu7wGBBP4xHUKkrExIuy7MFbmarAtLQahwZiso';
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var CLIENTS={}, DELIV={}, ITEMS=[], POOL_RESERVE=null;
  var db=null;
  var TREE=document.getElementById('tree');
  function show(msg){ if(TREE){ TREE.className='loading'; TREE.innerHTML=msg; } }

  // ★東員町は「納品300」に含めない（栗本さん指示 2026-08-16）。confirmedであっても町名で除外表示。
  var EXCLUDE_TOWNS=['東員町','東員'];
  function isExcludedTown(it){
    var t=String((it.town||'')+' '+(it.city||'')+' '+(it.address||''));
    for(var i=0;i<EXCLUDE_TOWNS.length;i++){ if(t.indexOf(EXCLUDE_TOWNS[i])>=0) return true; }
    return false;
  }

  // supabase-js(CDN) のロードを最大~6秒待つ。待っても無ければ明示エラー。
  function waitSupabase(){
    return new Promise(function(resolve,reject){
      var n=0;
      (function poll(){
        if(typeof window.supabase!=='undefined' && window.supabase.createClient) return resolve();
        if(n++>60) return reject(new Error('supabase-js(CDN)が読み込めませんでした。ネットワーク/広告ブロッカーをご確認ください。'));
        setTimeout(poll,100);
      })();
    });
  }
  function getClient(){
    // アプリ標準の認証済みクライアントを最優先で再利用（RLS整合）。無ければ自前生成。
    if(window.__auth && window.__auth.sb) return window.__auth.sb;
    return window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  }

  async function loadAll(){
    var c=await db.from('clients').select('id,name');
    if(c.error) throw new Error('clients: '+(c.error.message||c.error));
    (c.data||[]).forEach(function(x){CLIENTS[x.id]=x.name;});
    var d=await db.from('client_deliveries').select('id,period,delivered_at,notes,status,case_count');
    if(d.error) throw new Error('client_deliveries: '+(d.error.message||d.error));
    (d.data||[]).forEach(function(x){DELIV[x.id]=x;});
    var all=[],from=0;
    while(true){
      var r=await db.from('client_delivery_items').select('id,client_id,delivery_id,pref,city,town,chiban,area_m2,chimoku,zone,address,status,lat,lng').range(from,from+999);
      if(r.error)throw new Error('client_delivery_items: '+(r.error.message||r.error));
      var b=r.data||[]; all=all.concat(b); if(b.length<1000)break; from+=1000;
    }
    ITEMS=all;
    // ★2026-09-02(ドクター指示「DB上に仕組みが有っても表示する仕組みが出来ていない。目に見えて確認できる
    //   仕組みを付け加える」): round2_pool(⑥予備軍)は既に存在するテーブルだが、このページには一切
    //   連動していなかった。予備軍の残数(status=reserve)をここで取得し、サマリーに表示する。
    try{
      var pr=await db.from('round2_pool').select('id',{count:'exact',head:true}).eq('status','reserve');
      POOL_RESERVE=(pr&&typeof pr.count==='number')?pr.count:null;
    }catch(_e){ POOL_RESERVE=null; }
  }

  // ★client_deliveries.status='confirmed'をcreated_at昇順に並べ「第N回」を動的に算出する。
  //   round_no列をDBに追加するアドホックなDDLではなく、既存データから毎回同じ順序で再現可能な
  //   ロジックとして固定する(データが増えても自動で第N回が振られる・ハードコード禁止)。
  //   ROUND_NO_MAPはbuild()のツリー表示ラベルにも共用する(重複計算しない・単一の正)。
  var ROUND_NO_MAP={}, CONFIRMED_LIST=[];
  function computeRoundNoMap(){
    // ★2026-09-02是正: created_at(DBへの登録タイミング)は実際の納品日と一致するとは限らない
    //   (例: 第1回は2026-08-09にレコード作成→実際の確定納品は2026-08-17)。
    //   実際の納品順を正しく表すのはdelivered_at。無ければcreated_atへフォールバックする。
    CONFIRMED_LIST=Object.keys(DELIV).map(function(k){return DELIV[k];})
      .filter(function(d){return d.status==='confirmed';})
      .sort(function(a,b){return String(a.delivered_at||a.created_at||'').localeCompare(String(b.delivered_at||b.created_at||''));});
    ROUND_NO_MAP={};
    CONFIRMED_LIST.forEach(function(d,i){ ROUND_NO_MAP[d.id]=i+1; });
  }
  // ★案件マスター(main.html)の既存フィルタUIパターン(セレクトボックス→JS側filter)を流用。
  //   クライアント一覧・納品回一覧はDBの実データから動的生成する(固定選択肢のハードコード禁止)。
  function populateFilters(){
    var cSel=document.getElementById('filterClient');
    Object.keys(CLIENTS).sort(function(a,b){return String(CLIENTS[a]).localeCompare(String(CLIENTS[b]),'ja');}).forEach(function(id){
      var o=document.createElement('option'); o.value=id; o.textContent=CLIENTS[id]||id; cSel.appendChild(o);
    });
    var rSel=document.getElementById('filterRound');
    CONFIRMED_LIST.forEach(function(d,i){
      var o=document.createElement('option'); o.value=d.id; o.textContent='第'+(i+1)+'回'; rSel.appendChild(o);
    });
  }
  function buildDeliverySummary(){
    var el=document.getElementById('deliverySummary');
    if(!el)return;
    var confirmed=CONFIRMED_LIST;
    var rows=confirmed.map(function(d,i){
      var n=(d.case_count!=null)?d.case_count:(ITEMS.filter(function(it){return it.delivery_id===d.id;}).length);
      var dt=(d.delivered_at||d.created_at||'').slice(0,10);
      return '<tr><td class="mono" style="color:var(--acc);font-weight:800">第'+(i+1)+'回</td><td class="mono">'+esc(dt)+'</td>'
        +'<td class="mono" style="text-align:right">'+n+'件</td><td>'+esc(d.notes||d.period||'')+'</td></tr>';
    }).join('');
    var reserveLine=(POOL_RESERVE==null)
      ?'<span style="color:var(--soft)">予備軍(round2_pool)残数: 取得失敗</span>'
      :'<span style="color:var(--acc);font-weight:800">予備軍(round2_pool)残数: '+POOL_RESERVE+' 件</span><span style="color:var(--soft);font-size:12px"> — これから納品ロットへ組み込める候補（status=reserve）</span>';
    el.innerHTML='<div style="background:var(--surf);border:1px solid var(--bd);border-radius:9px;padding:14px 16px;margin-bottom:6px">'
      +'<div style="font-weight:800;font-size:14px;margin-bottom:8px">📈 納品履歴（confirmed・時系列）</div>'
      +(rows?'<table class="cases" style="width:100%;margin:0 0 10px 0"><tr><th>回</th><th>日付</th><th>件数</th><th>内容</th></tr>'+rows+'</table>':'<div style="color:var(--soft);font-size:12px;margin-bottom:8px">確定納品ロットがまだありません</div>')
      +'<div style="border-top:1px solid var(--bd);padding-top:8px;font-size:13px">'+reserveLine+'</div>'
      +'</div>';
  }

  // ★2026-09-02(ドクター指示): このページは基本的に読み取り専用の参照台帳だが、SUNトラスト社報告の
  //   「納品済み案件のピン(緯度経度)と農地ナビの地番がズレている」ケースのように、納品後に誤りが
  //   判明した場合のみ、その場でclient_delivery_itemsを修正できるようにする。全行常時編集可能にはせず、
  //   ✏️ボタンを押した行だけインライン編集フォームを開く方式(誤操作防止・同時に複数開かない)。
  window.__editRow = function(btn){
    var tr = btn.closest('tr');
    var id = tr.getAttribute('data-id');
    var it = ITEMS.find(function(x){return String(x.id)===String(id);});
    if(!it) return;
    var next = tr.nextElementSibling;
    if(next && next.classList.contains('edit-row')){ next.remove(); return; }
    document.querySelectorAll('tr.edit-row').forEach(function(r){r.remove();});
    var editTr = document.createElement('tr');
    editTr.className='edit-row';
    editTr.setAttribute('data-edit-id', it.id);
    editTr.innerHTML = '<td colspan="9" style="background:var(--surf2);padding:10px">'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'
      +'<label>地番<input type="text" class="ed_chiban" value="'+esc(it.chiban||'')+'" style="width:160px"></label>'
      +'<label>緯度<input type="text" class="ed_lat" value="'+esc(it.lat!=null?it.lat:'')+'" style="width:110px"></label>'
      +'<label>経度<input type="text" class="ed_lng" value="'+esc(it.lng!=null?it.lng:'')+'" style="width:110px"></label>'
      +'<label>所在<input type="text" class="ed_address" value="'+esc(it.address||'')+'" style="width:220px"></label>'
      +'<label>面積㎡<input type="text" class="ed_area" value="'+esc(it.area_m2!=null?it.area_m2:'')+'" style="width:90px"></label>'
      +'<button type="button" onclick="window.__saveRow(this)">💾 保存</button>'
      +'<button type="button" onclick="this.closest(\'tr\').remove()">キャンセル</button>'
      +'<span class="ed_msg" style="color:var(--soft);font-size:12px"></span>'
      +'</div></td>';
    tr.parentNode.insertBefore(editTr, tr.nextSibling);
  };
  window.__saveRow = async function(btn){
    var editTr = btn.closest('tr');
    var id = editTr.getAttribute('data-edit-id');
    var msg = editTr.querySelector('.ed_msg');
    var latRaw=editTr.querySelector('.ed_lat').value.trim();
    var lngRaw=editTr.querySelector('.ed_lng').value.trim();
    var areaRaw=editTr.querySelector('.ed_area').value.trim();
    var patch = {
      chiban: editTr.querySelector('.ed_chiban').value.trim() || null,
      lat: latRaw===''?null:parseFloat(latRaw),
      lng: lngRaw===''?null:parseFloat(lngRaw),
      address: editTr.querySelector('.ed_address').value.trim() || null,
      area_m2: areaRaw===''?null:parseFloat(areaRaw)
    };
    if(msg) msg.textContent='保存中…';
    try{
      var r = await db.from('client_delivery_items').update(patch).eq('id', id).select();
      if(r.error) throw new Error(r.error.message||r.error);
      var it = ITEMS.find(function(x){return String(x.id)===String(id);});
      if(it) Object.assign(it, patch);
      build();
    }catch(e){
      if(msg) msg.textContent='⚠ 保存失敗: '+((e&&e.message)||e);
    }
  };

  function build(){
    var q=(document.getElementById('q').value||'').trim().toLowerCase();
    var stf=document.getElementById('st').value;
    var clf=document.getElementById('filterClient').value;
    var rdf=document.getElementById('filterRound').value;
    var items=ITEMS.filter(function(it){
      if(stf==='confirmed' && it.status!=='confirmed')return false;
      if(stf==='confirmed' && isExcludedTown(it))return false; // 東員町は確定納品300には含めない。「全ステータス」では確認中も表示する
      if(clf && String(it.client_id)!==clf)return false;
      if(rdf && String(it.delivery_id)!==rdf)return false;
      if(q){ var hay=[it.chiban,it.address,it.city,it.pref,it.town].join(' ').toLowerCase(); if(hay.indexOf(q)<0)return false; }
      return true;
    });
    // client -> delivery(period) -> pref -> city -> items
    var tree={};
    items.forEach(function(it){
      var cl=CLIENTS[it.client_id]||it.client_id||'(不明client)';
      var dv=DELIV[it.delivery_id]||{}; var rn=ROUND_NO_MAP[it.delivery_id];
      var per=(rn?('第'+rn+'回 '):'')+(dv.period||'期不明')+(dv.notes?(' '+dv.notes):'');
      var pf=it.pref||'県不明'; var ct=it.city||'市不明';
      tree[cl]=tree[cl]||{n:0,ch:{}};
      var a=tree[cl]; a.n++;
      a.ch[per]=a.ch[per]||{n:0,meta:dv,ch:{}}; var b=a.ch[per]; b.n++;
      b.ch[pf]=b.ch[pf]||{n:0,ch:{}}; var c=b.ch[pf]; c.n++;
      c.ch[ct]=c.ch[ct]||{n:0,items:[]}; var d=c.ch[ct]; d.n++; d.items.push(it);
    });
    var stCls=function(s){return s==='confirmed'?'st-confirmed':(/hold/.test(s)?'st-hold':(/removed/.test(s)?'st-removed':''));};
    var H='';
    Object.keys(tree).sort().forEach(function(cl){
      var a=tree[cl];
      H+='<div class="node lv1 open"><div class="row" onclick="this.parentNode.classList.toggle(\'open\')"><span class="tw">▸</span>🏢 '+esc(cl)+'<span class="cnt">'+a.n+'件</span></div><div class="kids">';
      Object.keys(a.ch).sort().forEach(function(per){
        var b=a.ch[per];
        var dd=b.meta&&b.meta.delivered_at?(' / 納品:'+String(b.meta.delivered_at).slice(0,10)):'';
        H+='<div class="node lv2 open"><div class="row" onclick="this.parentNode.classList.toggle(\'open\')"><span class="tw">▸</span>🗓 '+esc(per)+'<span class="badge">'+esc((b.meta&&b.meta.status)||'')+'</span>'+esc(dd)+'<span class="cnt">'+b.n+'件</span></div><div class="kids">';
        Object.keys(b.ch).sort().forEach(function(pf){
          var c=b.ch[pf];
          H+='<div class="node lv3"><div class="row" onclick="this.parentNode.classList.toggle(\'open\')"><span class="tw">▸</span>📍 '+esc(pf)+'<span class="cnt">'+c.n+'件</span></div><div class="kids">';
          Object.keys(c.ch).sort().forEach(function(ct){
            var d=c.ch[ct];
            H+='<div class="node" style="margin-left:48px"><div class="row" onclick="this.parentNode.classList.toggle(\'open\')"><span class="tw">▸</span>🏘 '+esc(ct)+'<span class="cnt">'+d.n+'件</span></div><div class="kids">';
            H+='<table class="cases"><tr><th>No</th><th>地番</th><th>面積㎡</th><th>地目</th><th>区域</th><th>所在</th><th>状態</th><th>地図</th><th>操作</th></tr>';
            d.items.sort(function(x,y){return String(x.chiban).localeCompare(String(y.chiban));}).forEach(function(it,i){
              var g=it.lat?('<a href="https://www.google.com/maps/search/?api=1&query='+it.lat+','+it.lng+'" target="_blank">🌐</a>'):'';
              H+='<tr data-id="'+esc(it.id)+'"><td class="no">'+(i+1)+'</td><td class="mono">'+esc(it.chiban)+'</td><td class="mono" style="text-align:right">'+(it.area_m2!=null?Number(it.area_m2).toLocaleString():'')+'</td><td>'+esc(it.chimoku)+'</td><td>'+esc(it.zone)+'</td><td>'+esc(it.address)+'</td><td class="'+stCls(it.status)+'">'+esc(it.status)+'</td><td>'+g+'</td><td><button type="button" class="editBtn" onclick="window.__editRow(this)">✏️ 修正</button></td></tr>';
            });
            H+='</table></div></div>';
          });
          H+='</div></div>';
        });
        H+='</div></div>';
      });
      H+='</div></div>';
    });
    document.getElementById('tree').className='';
    document.getElementById('tree').innerHTML=H||'<div class="loading">該当なし</div>';
  }

  // 起動: 絶対に「読み込み中」で固まらせない。supabase待ち→タイムアウト→必ず結果かエラーを表示。
  var done=false;
  var killer=setTimeout(function(){
    if(done)return; done=true;
    show('<div>⏳ タイムアウト（20秒）: データ取得が返りませんでした。<br>再読み込みしても直らない場合はご連絡ください。</div>');
  },20000);

  (async function boot(){
    try{
      await waitSupabase();
      db=getClient();
      if(!db) throw new Error('Supabaseクライアントを初期化できませんでした。');
      await loadAll();
      if(done)return; done=true; clearTimeout(killer);
      computeRoundNoMap();
      populateFilters();
      buildDeliverySummary();
      build();
      document.getElementById('q').addEventListener('input',build);
      document.getElementById('st').addEventListener('change',build);
      document.getElementById('filterClient').addEventListener('change',build);
      document.getElementById('filterRound').addEventListener('change',build);
    }catch(e){
      if(done)return; done=true; clearTimeout(killer);
      show('<div>⚠ 読み込み失敗: '+esc((e&&e.message)||e)+'</div>');
    }
  })();
})();
</script>
</body>
</html>
