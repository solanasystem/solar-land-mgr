function col(m){m=m||0;return m>=0.5?'#22c55e':(m>=0.4?'#f59e0b':'#9ca3af');}
function markSeen(id,ctr){if(!visited[id]){visited[id]=1;try{localStorage.setItem('battsolar_visited',JSON.stringify(visited));}catch(e){}}try{ctr.setStyle({fillColor:'#6b7280',color:'#374151'});}catch(e){}updSeen();}
function updSeen(){var n=F.filter(function(x){return visited[x.id];}).length;var el=document.getElementById('nSeen');if(el)el.textContent=n;}
function toast(m,ok){var t=document.getElementById('toast');t.textContent=m;t.style.borderColor=ok?'#16a34a':'#b91c1c';t.style.color=ok?'#86efac':'#fca5a5';t.style.background=ok?'#0b2e1a':'#3a1414';t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}
var _cl={};var group=L.featureGroup().addTo(map);
function render(){ setCounts(); group.clearLayers(); _cl={};
F.forEach(function(c){
  var cc=col(c.minp);var layers=[];var lls=[];
  c.mem.forEach(function(m){lls.push([m[0],m[1]]);
    var mk=L.circleMarker([m[0],m[1]],{radius:5,color:'#7f1d1d',weight:1,fillColor:'#fca5a5',fillOpacity:.9}).addTo(group).bindPopup('構成筆 '+m[2]+'㎡');layers.push(mk);});
  if(lls.length>=2){var pl=L.polyline(lls.concat([lls[0]]),{color:cc,weight:2,opacity:.85,dashArray:'4,3'}).addTo(group);layers.push(pl);}
  var gm='https://www.google.com/maps/search/?api=1&query='+c.lat+','+c.lng;
  var sv='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+c.lat+','+c.lng;
  var e3='https://earth.google.com/web/@'+c.lat+','+c.lng+',150a,300d,35y,0h,55t,0r';
  var ctr=L.circleMarker([c.lat,c.lng],{radius:c.n===2?9:7,color:(visited[c.id]?'#374151':'#064e3b'),weight:2,fillColor:(visited[c.id]?'#6b7280':cc),fillOpacity:.95}).addTo(group);
  ctr.on('click',function(){markSeen(c.id,ctr);});
  ctr.bindPopup('<div style="min-width:220px;font-size:12px;line-height:1.7">'
     +'<b style="color:'+cc+'">&#9728; 合筆・低圧太陽光候補</b><br>'
     +'<b>'+(c.city||'-')+'</b>　'+c.n+'筆を合筆 → <b>'+c.total+'㎡</b><br>'
     +'<span style="color:#93c5fd">AI空き見込み：min放棄 <b>'+(c.minp!=null?c.minp:'-')+'</b>／mean '+(c.meanp!=null?c.meanp:'-')+'</b></span><br>'
     +'<span style="color:#94a3b8;font-size:11px">※青フラグ(低圧蓄電池)から発掘。緑=全筆が空き見込み</span>'
     +'<div style="display:flex;gap:5px;margin-top:9px">'
     +'<a href="'+gm+'" target="_blank" style="flex:1;text-align:center;padding:5px;border:1px solid #1a73e8;background:#0b2447;color:#8ab4f8;border-radius:5px;font-size:11px;text-decoration:none">&#127760;地図</a>'
     +'<a href="'+sv+'" target="_blank" style="flex:1;text-align:center;padding:5px;border:1px solid #16a34a;background:#0b2e1a;color:#86efac;border-radius:5px;font-size:11px;text-decoration:none">&#128694;SV</a>'
     +'<a href="'+e3+'" target="_blank" style="flex:1;text-align:center;padding:5px;border:1px solid #16a34a;background:#0b2e1a;color:#86efac;border-radius:5px;font-size:11px;text-decoration:none">&#127758;Earth</a></div>'
     +'<button onclick="delCluster('+c.id+')" style="margin-top:9px;width:100%;padding:6px 8px;border:1px solid #B71C1C;background:#3a1414;color:#ff8a80;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">&#128465; 合筆NG（この'+c.n+'筆を一括削除）</button>'
     +'</div>',{maxWidth:280,minWidth:230});
  layers.push(ctr);_cl[c.id]=layers;
});
try{map.fitBounds(group.getBounds().pad(0.08));}catch(e){}
updSeen();
}
// ★読込時に最新のfarmland_ng_listで再除外(削除済みはリロードしても復活しない)
async function boot(){
  var t=0; while(!(window.__auth&&window.__auth.sb)&&t<100){await new Promise(function(r){setTimeout(r,50);});t++;}
  var sb=window.__auth&&window.__auth.sb;
  if(sb){try{
    var allf=[]; F.forEach(function(c){c.mem.forEach(function(m){allf.push(m[3]);});});
    var del={};
    for(var i=0;i<allf.length;i+=200){var r=await sb.from('farmland_ng_list').select('feature_id').in('feature_id',allf.slice(i,i+200));(r.data||[]).forEach(function(x){del[x.feature_id]=1;});}
    F=F.filter(function(c){return !c.mem.some(function(m){return del[m[3]];});});
  }catch(e){console.warn('ng load-filter err',e);}}
  render();
}
boot();
window.delCluster=async function(id){
  var c=F.filter(function(x){return x.id===id;})[0]; if(!c)return;
  if(!confirm('この合筆（'+c.n+'筆・'+c.total+'㎡）をNGにします。構成する'+c.n+'筆すべてを削除します。よろしいですか？'))return;
  var sb=window.__auth&&window.__auth.sb; if(!sb){toast('認証エラー：ログインしてください',false);return;}
  var recs=c.mem.map(function(m){return {feature_id:m[3],ng_reason:'manual_gappitsu_reject',lat:m[0],lng:m[1]};});
  try{var r=await sb.from('farmland_ng_list').upsert(recs,{onConflict:'feature_id'});if(r.error)throw r.error;
    (_cl[id]||[]).forEach(function(l){try{group.removeLayer(l);}catch(e){}});map.closePopup();
    F=F.filter(function(x){return x.id!==id;}); setCounts(); updSeen();
    toast(c.n+'筆を合筆NGで削除しました（復元可）',true);
  }catch(e){toast('削除失敗: '+((e&&e.message)||e),false);}
};
</script></body></html>
