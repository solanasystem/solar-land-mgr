<!-- ===== v20260520a: version.json 自動更新チェック（_vchk）===== -->
<script>
(async function _vchk(){
  try {
    var lastCheck = parseInt(sessionStorage.getItem('vchk_nr_at') || '0', 10);
    if (Date.now() - lastCheck < 30000) return;
    sessionStorage.setItem('vchk_nr_at', String(Date.now()));
    var ctrl = new AbortController();
    setTimeout(function(){ ctrl.abort(); }, 3000);
    var r = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
    if (!r.ok) return;
    var j = await r.json();
    if (!j || !j.version) return;
    var stored = localStorage.getItem('app_version');
    if (!stored) { localStorage.setItem('app_version', j.version); return; }
    if (stored !== j.version) {
      localStorage.setItem('app_version', j.version);
      var url = new URL(location.href);
      url.searchParams.delete('_v');
      url.searchParams.set('_v', String(Date.now()));
      location.replace(url.toString());
    }
  } catch(e) {}
})();
</script>

<script>
// ============================================================
// noten-request.html: 農地種別確認のお願い 自動作成ツール
// ============================================================
let sbClient = null;
let _allCases = [];        // 全案件キャッシュ
let _selectedCases = [];   // 選択された案件群（文書生成対象）

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : ' ok');
}

// ====== Supabase接続 ======
function initSupabase() {
  const url = localStorage.getItem('supabase_url');
  const key = localStorage.getItem('supabase_anon_key');
  if (!url || !key) { openConfigModal(); return false; }
  try {
    sbClient = supabase.createClient(url, key);
    setStatus('Supabase接続OK');
    return true;
  } catch (e) {
    setStatus('Supabase接続失敗: ' + e.message, true);
    openConfigModal();
    return false;
  }
}
function openConfigModal() {
  document.getElementById('cfg-url').value = localStorage.getItem('supabase_url') || '';
  document.getElementById('cfg-key').value = localStorage.getItem('supabase_anon_key') || '';
  document.getElementById('config-modal').classList.add('show');
}
function saveConfig() {
  const url = document.getElementById('cfg-url').value.trim();
  const key = document.getElementById('cfg-key').value.trim();
  if (!url || !key) { alert('URL と Anon Key を入力してください'); return; }
  localStorage.setItem('supabase_url', url);
  localStorage.setItem('supabase_anon_key', key);
  document.getElementById('config-modal').classList.remove('show');
  initSupabase();
}

// ====== 案件一覧読込（市区町村別グルーピング） ======
// v20260520i: 土地所在地(location)から実際の市区町村名を抽出
// area_name(中部/田原市等の案件番号プレフィックス)ではなく、実所在地で判定するため
function extractCityFromLocation(location) {
  if (!location) return '';
  let s = String(location).trim();
  // 先頭の都道府県を除去
  s = s.replace(/^(北海道|東京都|京都府|大阪府|[^\s0-9]{2,3}県)/, '');
  // 市 → 区 → 郡+町村 → 町村 の順で抽出
  let m = s.match(/^(.+?市)/);
  if (m) return m[1];
  m = s.match(/^(.+?郡.+?[町村])/);
  if (m) return m[1];
  m = s.match(/^(.+?区)/);
  if (m) return m[1];
  m = s.match(/^(.+?[町村])/);
  if (m) return m[1];
  return s;
}

async function loadAllCases() {
  if (!sbClient && !initSupabase()) return;
  setStatus('案件一覧を取得中...');
  try {
    // NG除外
    let all = [];
    let from = 0;
    const step = 1000;
    while (true) {
      const { data, error } = await sbClient
        .from('cases')
        .select('id, case_no, display_case_no, area_name, kubun, price, status, city_planning_zone')
        .neq('status', 'NG')
        .order('case_no')
        .range(from, from + step - 1);
      if (error) throw error;
      if (!data || data.length === 0) break;
      all = all.concat(data);
      if (data.length < step) break;
      from += step;
    }
    // v20260520i: 全案件のland_info.locationを取得し、実市区町村名を判定
    setStatus(`案件 ${all.length}件の所在地を判定中...`);
    const cityByCaseId = await fetchRealCities(all.map(c => c.id));
    for (const c of all) {
      c._realCity = cityByCaseId[c.id] || (c.area_name || '（所在地未設定）');
    }
    _allCases = all;
    renderCasePicker(all);
    setStatus(`案件一覧読込完了: ${all.length}件`);
  } catch (err) {
    setStatus('案件一覧取得失敗: ' + (err.message || err), true);
  }
}

// 案件IDリスト → 各案件の代表市区町村名（1筆目のlocationから抽出）
async function fetchRealCities(caseIds) {
  const cityByCaseId = {};
  const CHUNK = 200;
  for (let i = 0; i < caseIds.length; i += CHUNK) {
    const chunk = caseIds.slice(i, i + CHUNK);
    const { data, error } = await sbClient
      .from('land_info')
      .select('case_id, location')
      .in('case_id', chunk);
    if (error) throw error;
    for (const ld of (data || [])) {
      // 各案件の最初に見つかった有効なlocationを採用
      if (!cityByCaseId[ld.case_id] && ld.location) {
        const city = extractCityFromLocation(ld.location);
        if (city) cityByCaseId[ld.case_id] = city;
      }
    }
  }
  return cityByCaseId;
}

function renderCasePicker(cases) {
  const picker = document.getElementById('case-picker');
  const groupsEl = document.getElementById('case-groups');
  picker.style.display = '';
  groupsEl.innerHTML = '';

  // 市区町村別グルーピング（v20260520i: 実所在地ベース _realCity）
  const groups = {};
  for (const c of cases) {
    const city = (c._realCity || c.area_name || '（市区町村未設定）').trim();
    if (!groups[city]) groups[city] = [];
    groups[city].push(c);
  }
  const cityNames = Object.keys(groups).sort();

  for (const city of cityNames) {
    const grp = document.createElement('div');
    grp.className = 'city-group';
    grp.innerHTML = `<h3>${city} <span style="color:#6b7280;font-weight:400;font-size:9pt;">(${groups[city].length}件)</span> <button class="city-all-btn" data-city="${city}">この市区町村を全選択</button></h3>`;
    const list = document.createElement('div');
    list.className = 'case-list';
    for (const c of groups[city]) {
      const id = `cb-${c.id}`;
      const item = document.createElement('label');
      item.className = 'case-item';
      item.innerHTML = `<input type="checkbox" id="${id}" data-case-id="${c.id}" data-city="${city}"><span class="case-no">${c.case_no || '(番号なし)'}</span>${c.display_case_no ? `<span class="owner-name">${c.display_case_no}</span>` : ''}`;
      list.appendChild(item);
    }
    grp.appendChild(list);
    groupsEl.appendChild(grp);
  }
  // 全選択ボタン
  document.querySelectorAll('.city-all-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const city = e.target.getAttribute('data-city');
      const isAllChecked = Array.from(document.querySelectorAll(`input[data-city="${city}"]`)).every(cb => cb.checked);
      document.querySelectorAll(`input[data-city="${city}"]`).forEach(cb => {
        cb.checked = !isAllChecked;
        const item = cb.closest('.case-item');
        if (item) item.classList.toggle('selected', cb.checked);
      });
      e.target.textContent = isAllChecked ? 'この市区町村を全選択' : '全解除';
      updateSelCount();
    });
  });
  // チェック変更で visual + 件数カウンター
  groupsEl.addEventListener('change', (e) => {
    const cb = e.target;
    if (cb.type !== 'checkbox') return;
    const item = cb.closest('.case-item');
    if (item) item.classList.toggle('selected', cb.checked);
    updateSelCount();
  });
  updateSelCount();
}

// 選択件数カウンター更新
function updateSelCount() {
  const checked = document.querySelectorAll('#case-groups input[type=checkbox]:checked');
  const cities = new Set(Array.from(checked).map(cb => cb.getAttribute('data-city')));
  const el = document.getElementById('sel-count');
  if (!el) return;
  if (checked.length === 0) {
    el.textContent = '0 件選択中';
    el.style.color = '#b45309';
  } else if (cities.size > 1) {
    el.textContent = `${checked.length} 件選択中（⚠️ ${cities.size}市区町村混在）`;
    el.style.color = '#dc2626';
  } else {
    el.textContent = `${checked.length} 件選択中（${Array.from(cities)[0]}）`;
    el.style.color = '#15803d';
  }
}

// 案件番号テキスト入力から読込
async function loadByInput() {
  if (!sbClient && !initSupabase()) return;
  const raw = document.getElementById('case-input').value.trim();
  if (!raw) { alert('案件番号を入力してください'); return; }
  const caseNos = raw.split(/[\s,、]+/).filter(s => s.length > 0);
  if (caseNos.length === 0) return;
  setStatus(`${caseNos.length}件の案件を読込中...`);
  try {
    const { data, error } = await sbClient
      .from('cases')
      .select('id, case_no, display_case_no, area_name, kubun, price, status, city_planning_zone')
      .in('case_no', caseNos)
      .neq('status', 'NG');
    if (error) throw error;
    if (!data || data.length === 0) {
      setStatus('該当案件なし', true);
      return;
    }
    // v20260520i: 実所在地から市区町村名を判定
    const cityByCaseId = await fetchRealCities(data.map(c => c.id));
    for (const c of data) {
      c._realCity = cityByCaseId[c.id] || (c.area_name || '（所在地未設定）');
    }
    await generateDocument(data);
    setStatus(`文書生成完了: ${data.length}件`);
  } catch (err) {
    setStatus('読込失敗: ' + (err.message || err), true);
  }
}

// 案件選択から文書生成
async function applySelection() {
  const checkedIds = Array.from(document.querySelectorAll('#case-groups input[type=checkbox]:checked'))
    .map(cb => cb.getAttribute('data-case-id'));
  if (checkedIds.length === 0) { alert('案件を1件以上選択してください'); return; }
  // v20260520i: 実所在地(_realCity)で市区町村チェック
  const checkedCities = new Set(Array.from(document.querySelectorAll('#case-groups input[type=checkbox]:checked'))
    .map(cb => cb.getAttribute('data-city')));
  if (checkedCities.size > 1) {
    if (!confirm(`複数の市区町村が選択されています（${Array.from(checkedCities).join('、')}）。\n1つの市区町村ごとに別文書として作成する必要があります。\n\n最初の市区町村のみを文書化します。よろしいですか？`)) return;
  }
  const targetCity = Array.from(checkedCities)[0];
  const cases = _allCases.filter(c => checkedIds.includes(c.id) && (c._realCity || '').trim() === targetCity);
  await generateDocument(cases);
  document.getElementById('case-picker').style.display = 'none';
  setStatus(`文書生成完了: ${cases.length}件（${targetCity}）`);
}

// ====== メイン: 文書生成 ======
async function generateDocument(cases) {
  if (!cases || cases.length === 0) return;
  _selectedCases = cases;

  // 関連データ取得（land_info + landowner_info）
  const caseIds = cases.map(c => c.id);
  const { data: lands, error: lErr } = await sbClient
    .from('land_info')
    .select('id, case_id, area_sqm, location, chiban, chimoku, lat, lng')
    .in('case_id', caseIds);
  if (lErr) throw lErr;
  const { data: owners, error: oErr } = await sbClient
    .from('landowner_info')
    .select('id, case_id, name, address')
    .in('case_id', caseIds);
  if (oErr) throw oErr;

  // 案件ごとにland/ownerを集約
  const caseMap = {};
  for (const c of cases) {
    caseMap[c.id] = { ...c, lands: [], owner: null };
  }
  for (const ld of (lands || [])) {
    if (caseMap[ld.case_id]) caseMap[ld.case_id].lands.push(ld);
  }
  for (const ow of (owners || [])) {
    if (caseMap[ow.case_id]) caseMap[ow.case_id].owner = ow;
  }

  // 宛名の市区町村（v20260520i: 実所在地ベース _realCity）
  const cityName = (cases[0]._realCity || cases[0].area_name || '').trim();

  // 日付セット
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;

  // v20260520g: 10案件/ページで自動分割
  const PER_PAGE = 10;
  const orderedIds = caseIds.slice();
  const chunks = [];
  for (let i = 0; i < orderedIds.length; i += PER_PAGE) {
    chunks.push(orderedIds.slice(i, i + PER_PAGE));
  }
  const totalPages = chunks.length;

  const tableContainer = document.getElementById('table-pages');
  tableContainer.innerHTML = '';
  chunks.forEach((chunk, pageIdx) => {
    const startNo = pageIdx * PER_PAGE + 1;
    const page = createTablePage(chunk, caseMap, pageIdx, totalPages, cityName, dateStr, startNo);
    tableContainer.appendChild(page);
  });

  // 位置図ページ生成
  await renderPositionPages(cases, caseMap);
}

// 表ページ1枚を生成（10案件まで）
function createTablePage(caseIds, caseMap, pageIdx, totalPages, cityName, dateStr, startNo) {
  const page = document.createElement('div');
  page.className = 'a4-page';

  // ヘッダー部（1ページ目はフル、2ページ目以降は簡易）
  let headerHtml;
  if (pageIdx === 0) {
    headerHtml = `
      <div class="doc-header">
        <div class="doc-date">${dateStr}</div>
        <div class="doc-recipient">
          <div class="city">${cityName || '（市区町村未設定）'}</div>
          <div class="committee">農業委員会</div>
          <div class="person">ご担当者様：</div>
        </div>
        <div class="doc-sender">
          <div>〒472-0045 知立市長篠町新田38-4-102</div>
          <div>株式会社 XAMAX &amp; In the cloud</div>
          <div>担当：栗本</div>
          <div>TEL：070-8566-0679</div>
        </div>
      </div>
      <div class="doc-title">農地種別確認のお願い${totalPages > 1 ? `（1 / ${totalPages}）` : ''}</div>
      <p class="doc-intro">
        平素は格別のご高配を賜り厚く御礼申し上げます。下記物件の農地種別（青地／白地：第1種〜第3種農地）の確認をお願いいたします。<br>
        ご多忙のところ恐縮ですが、何卒ご協力のほどよろしくお願い申し上げます。
      </p>`;
  } else {
    headerHtml = `
      <div class="doc-date" style="margin-bottom:1mm;">${dateStr}</div>
      <div class="doc-title">農地種別確認のお願い（${pageIdx + 1} / ${totalPages}）</div>`;
  }

  // 表の行
  let rowsHtml = '';
  let no = startNo;
  for (const cid of caseIds) {
    const obj = caseMap[cid];
    if (!obj) continue;
    const owner = obj.owner || {};
    const lands = obj.lands || [];
    const chibanLocations = lands.map(l => (l.location || '') + (l.chiban ? ` ${l.chiban}` : '')).filter(s => s.trim() !== '');
    const locText = chibanLocations.length > 0 ? chibanLocations.join('、') : (lands[0]?.location || '');
    const areas = lands.map(l => l.area_sqm).filter(a => a != null);
    const areaText = areas.length > 0 ? areas.join('+') + ' ㎡' : '';
    const chimoku = lands.map(l => l.chimoku).filter(c => c).join('・') || '';
    const zoneRaw = obj.city_planning_zone || '';
    const zoneText = zoneRaw === 'control' ? '調整区域'
                   : zoneRaw === 'urban'   ? '市街化区域'
                   : zoneRaw || '';
    rowsHtml += `
      <tr>
        <td>${no}</td>
        <td>${obj.case_no || ''}</td>
        <td class="text-left">${owner.name || ''}</td>
        <td class="text-left">${owner.address || ''}</td>
        <td class="text-left">${locText}</td>
        <td>${areaText}</td>
        <td>${chimoku}</td>
        <td>${zoneText}</td>
        <td>あり</td>
        <td>あり</td>
        <td>あり</td>
      </tr>`;
    no++;
  }

  // フッター（最終ページのみ）
  const footerHtml = (pageIdx === totalPages - 1) ? `
    <div class="doc-footer">
      <div class="note">※ 各案件の位置図は次ページ以降に添付しております。</div>
      <div class="note">※ 登記簿・公図は別途、各案件ごとに用意しております。</div>
    </div>` : '';

  page.innerHTML = `
    ${headerHtml}
    <table class="doc-table">
      <thead>
        <tr>
          <th rowspan="2" class="col-no">NO</th>
          <th rowspan="2" class="col-caseno">案件番号</th>
          <th rowspan="2" class="col-name">地権者氏名</th>
          <th rowspan="2" class="col-addr">住所</th>
          <th rowspan="2" class="col-loc">売却ご希望の所在地</th>
          <th rowspan="2" class="col-area">登記面積</th>
          <th rowspan="2" class="col-chimoku">地目</th>
          <th rowspan="2" class="col-zone">都市計画区域</th>
          <th colspan="3">添付資料</th>
        </tr>
        <tr>
          <th class="col-attach">位置図</th>
          <th class="col-attach">登記簿</th>
          <th class="col-attach">公図</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    ${footerHtml}`;
  return page;
}

// ====== 位置図ページ生成（各案件1ページ、Leaflet衛星写真、A4横） ======
async function renderPositionPages(cases, caseMap) {
  const container = document.getElementById('position-pages');
  container.innerHTML = '';
  for (let i = 0; i < cases.length; i++) {
    const obj = caseMap[cases[i].id];
    if (!obj) continue;
    const owner = obj.owner || {};
    const lands = obj.lands || [];
    const land = lands[0]; // 1筆目をマップ中心に
    const pageId = `pos-page-${i}`;
    const mapId = `pos-map-${i}`;
    const lat = land ? parseFloat(land.lat) : null;
    const lng = land ? parseFloat(land.lng) : null;
    const hasCoord = !isNaN(lat) && !isNaN(lng) && lat !== null && lng !== null;
    const chibanList = lands.map(l => `${l.location || ''}${l.chiban ? ` ${l.chiban}` : ''}`).filter(s => s.trim()).join('、');
    const areaList = lands.map(l => l.area_sqm).filter(a => a != null).join('+') + ' ㎡';
    const chimoku = lands.map(l => l.chimoku).filter(c => c).join('・');
    const zoneRaw = obj.city_planning_zone || '';
    const zoneText = zoneRaw === 'control' ? '調整区域' : zoneRaw === 'urban' ? '市街化区域' : zoneRaw || '（未設定）';

    const page = document.createElement('div');
    page.className = 'position-page';
    page.id = pageId;
    page.innerHTML = `
      <div class="pos-title">位置図 - ${obj.case_no || ''}</div>
      <div class="pos-body">
        <dl class="pos-info">
          <dt class="first-dt">地権者氏名</dt><dd>${owner.name || ''}</dd>
          <dt>地権者住所</dt><dd>${owner.address || ''}</dd>
          <dt>所在地</dt><dd>${chibanList}</dd>
          <dt>登記面積</dt><dd>${areaList}</dd>
          <dt>地目</dt><dd>${chimoku}</dd>
          <dt>都市計画区域</dt><dd>${zoneText}</dd>
        </dl>
        <div class="pos-map">
          <div class="pos-map-leaflet" id="${mapId}"></div>
          ${hasCoord ? '<span class="pos-hint">⇕ 赤丸をドラッグで位置微調整</span>' : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;">位置情報未登録</div>'}
        </div>
      </div>
      <div class="pos-footer">出典: ESRI World Imagery（衛星写真）</div>
    `;
    container.appendChild(page);

    // Leaflet マップ初期化
    if (hasCoord) {
      try {
        await new Promise(r => setTimeout(r, 50)); // DOM挿入待ち
        const map = L.map(mapId, {
          center: [lat, lng],
          zoom: 17,
          zoomControl: false,
          attributionControl: false,
          scrollWheelZoom: false,
          doubleClickZoom: false,
          dragging: false,
          touchZoom: false,
          boxZoom: false,
          keyboard: false,
        });
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
        }).addTo(map);
        // ドラッグ可能な赤丸マーカー（外側に透明ヒットエリア）
        const redIcon = L.divIcon({
          className: 'noten-adj-marker',
          html: '<div style="width:26px;height:26px;cursor:grab;background:rgba(255,0,0,0.001);border-radius:50%;position:relative;">'
              + '<div style="position:absolute;top:50%;left:50%;width:16px;height:16px;background:rgba(255,0,0,0.18);border:3px solid #FF0000;border-radius:50%;transform:translate(-50%,-50%);box-sizing:border-box;pointer-events:none;"></div>'
              + '</div>',
          iconSize: [26, 26],
          iconAnchor: [13, 13],
        });
        const marker = L.marker([lat, lng], {
          icon: redIcon, draggable: true, autoPan: false,
          title: 'ドラッグで案件位置を微調整できます'
        }).addTo(map);
        L.control.scale({ position: 'bottomright', metric: true, imperial: false, maxWidth: 120 }).addTo(map);
        setTimeout(() => { try { map.invalidateSize(); } catch(_){} }, 300);

        // ドラッグ完了で land_info.lat/lng を更新（land.id 単位）
        if (land && land.id) {
          marker.on('dragend', async (e) => {
            const nl = e.target.getLatLng();
            const newLat = +nl.lat.toFixed(6);
            const newLng = +nl.lng.toFixed(6);
            if (!confirm(`案件「${obj.case_no}」の位置を更新しますか？\n\n緯度: ${newLat}\n経度: ${newLng}`)) {
              marker.setLatLng([lat, lng]);
              return;
            }
            try {
              const { error } = await sbClient
                .from('land_info')
                .update({ lat: newLat, lng: newLng })
                .eq('id', land.id);
              if (error) throw error;
              land.lat = newLat;  // ローカルにも反映
              land.lng = newLng;
              setStatus(`位置更新: ${obj.case_no}（${newLat}, ${newLng}）`);
            } catch (err) {
              alert('座標保存失敗: ' + (err.message || err));
              marker.setLatLng([lat, lng]);
            }
          });
        }
      } catch (e) {
        console.warn(`位置図 #${i} 初期化失敗:`, e);
      }
    }
  }
}

// ====== 印刷（印刷前にDB自動記録） ======
async function doPrint() {
  const tp = document.getElementById('table-pages');
  if (!tp || tp.children.length === 0) {
    alert('先に案件を読み込んでください');
    return;
  }
  // v20260520h: 印刷時にDB記録を自動実行（要件7）
  await saveToDb(true);  // silent=true：成功alertは出さない
  window.print();
}

// ====== DB保存（silent=true で成功alert抑制：印刷時の自動記録用） ======
async function saveToDb(silent) {
  if (!sbClient && !initSupabase()) return;
  if (!_selectedCases || _selectedCases.length === 0) {
    if (!silent) alert('保存する案件データがありません');
    return;
  }
  const cityName = (_selectedCases[0]._realCity || _selectedCases[0].area_name || '').trim();
  const caseIds = _selectedCases.map(c => c.id);
  const caseNos = _selectedCases.map(c => c.case_no);
  // ドキュメントスナップショット
  const now = new Date();
  const docData = {
    date: `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`,
    city: cityName,
    cases: _selectedCases.map(c => ({
      case_no: c.case_no,
      area_name: c.area_name,
      city_planning_zone: c.city_planning_zone,
    })),
    page_count: document.getElementById('table-pages').children.length,
  };
  try {
    const { error } = await sbClient
      .from('noten_requests')
      .insert({
        city_name: cityName,
        case_ids: caseIds,
        case_nos: caseNos,
        document_data: docData,
      });
    if (error) throw error;
    setStatus(`💾 DB記録成功（${cityName} / ${caseIds.length}件）`);
    if (!silent) alert(`DBに記録しました\n\n市区町村: ${cityName}\n案件数: ${caseIds.length}件`);
  } catch (err) {
    setStatus('DB記録失敗: ' + (err.message || err), true);
    if (!silent) alert('DB記録失敗: ' + (err.message || err));
  }
}

// ====== 起動 ======
document.addEventListener('DOMContentLoaded', () => {
  if (!initSupabase()) return;
  // URLパラメータ ?cases=中部-04,中部-05 で自動読込
  const params = new URLSearchParams(location.search);
  const casesParam = params.get('cases');
  if (casesParam) {
    document.getElementById('case-input').value = casesParam.replace(/,/g, ' ');
    loadByInput();
  }
});
</script>
