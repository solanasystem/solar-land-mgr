<title>CADエディタ | GRID LAND MGR v4.1</title>

<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --accent: #f0b429;
    --green: #3fb950;
    --blue: #58a6ff;
    --red: #f85149;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --font-main: 'Zen Kaku Gothic New', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== ヘッダー ===== */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 1000;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
  .logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #0F7B3E, #064E2A);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.15), 0 2px 4px rgba(0,0,0,.3);
    font-size: 14px;
  }
  .logo-text { font-size: 14px; font-weight: 700; }
  .logo-version {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    background: rgba(240,180,41,.1);
    border: 1px solid rgba(240,180,41,.3);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .page-title { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .page-title::before { content: '/'; color: var(--border); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .btn-back {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex; align-items: center; gap: 6px;
    transition: background .1s;
  }
  .btn-back:hover { background: #2a3244; }

  /* ===== メインコンテナ（左ツール・中央地図・右レイヤー） ===== */
  .main-container {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ===== 左ツールバー ===== */
  .toolbar {
    width: 56px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 8px 4px;
    gap: 6px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .tool-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .tool-group:last-child { border-bottom: none; }
  .tool-group-label {
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .tool-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    height: 40px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .1s;
    position: relative;
  }
  .tool-btn:hover { background: #2a3244; border-color: var(--accent); }
  .tool-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tool-btn:disabled, .tool-btn.stub {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .tool-btn.stub::after {
    content: '準備中';
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: var(--red);
    color: #fff;
    font-size: 7px;
    padding: 1px 3px;
    border-radius: 2px;
    line-height: 1;
  }

  /* ===== 中央地図エリア ===== */
  .map-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #map {
    width: 100%;
    height: 100%;
    background: #0a0e14;
  }

  /* ===== 地図上のタイル切替 ===== */
  .tile-switcher {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    display: flex;
    gap: 2px;
    z-index: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .tile-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    transition: all .1s;
  }
  .tile-btn:hover { color: var(--text); }
  .tile-btn.active {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ===== 右レイヤーパネル ===== */
  .layer-panel {
    width: 240px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .layer-panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.5px;
  }
  .layer-group {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .layer-group-title {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }
  .layer-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 4px;
    cursor: pointer;
    font-size: 12px;
    border-radius: 4px;
    transition: background .1s;
  }
  .layer-item:hover { background: var(--surface2); }
  .layer-item input[type=checkbox] {
    accent-color: var(--accent);
    width: 14px; height: 14px;
    cursor: pointer;
  }
  .layer-item-label { flex: 1; }
  .layer-item-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  /* ===== ステータスバー ===== */
  .status-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 4px 12px;
    min-height: 26px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .status-item { display: flex; align-items: center; gap: 4px; }
  .status-label { color: var(--text-muted); }
  .status-value { color: var(--text); }
  .status-sep { color: var(--border); }
  .status-conn.ok { color: var(--green); }
  .status-conn.err { color: var(--red); }

  /* ===== Leafletカスタム ===== */
  .leaflet-container {
    background: #0a0e14;
    font-family: var(--font-main);
  }
</style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="header">
  <div class="header-left">
    <a href="main.html" class="logo">
      <div class="logo-icon">📐</div>
      <div>
        <div class="logo-text">GRID LAND MGR</div>
      </div>
    </a>
    <span class="logo-version">v4.1</span>
    <div class="page-title">CADエディタ <span style="color:var(--accent);font-family:var(--font-mono);font-size:10px;">Track A / Step 2</span></div>
  </div>
  <div class="header-right">
    <button class="btn-back" onclick="goBack()">← 戻る</button>

</header>

<!-- ===== メインコンテナ ===== -->
<div class="main-container">

  <!-- ===== 左ツールバー（Step 2 は全てスタブ） ===== -->
  <div class="toolbar">
    <div class="tool-group">
      <div class="tool-group-label">下絵</div>
      <button class="tool-btn stub" title="下絵アップロード（Step 3）" disabled>📥</button>
      <button class="tool-btn stub" title="基準点設定（Step 4）" disabled>🎯</button>
    </div>
    <div class="tool-group">
      <div class="tool-group-label">作成</div>
      <button class="tool-btn stub" title="線分（Track B）" disabled>／</button>
      <button class="tool-btn stub" title="ポリライン（Track B）" disabled>⟋</button>
      <button class="tool-btn stub" title="円（Track B）" disabled>◯</button>
      <button class="tool-btn stub" title="矩形（Track B）" disabled>▭</button>
    </div>
    <div class="tool-group">
      <div class="tool-group-label">修正</div>
      <button class="tool-btn stub" title="移動（Track B）" disabled>↔</button>
      <button class="tool-btn stub" title="削除（Track B）" disabled>🗑</button>
    </div>
    <div class="tool-group">

  <!-- ===== 中央地図エリア ===== -->
  <div class="map-area">

    <!-- タイル切替 -->

      <button class="tile-btn" data-tile="photo_gsi" onclick="switchTile('photo_gsi')">GSI衛星</button>

  <!-- ===== 右レイヤーパネル ===== -->
  <div class="layer-panel">

<!-- ===== ステータスバー ===== -->
<div class="status-bar">
  <div class="status-item">
    <span class="status-label">座標:</span>
    <span class="status-value" id="statusCoord">-</span>
  </div>
  <div class="status-sep">|</div>
  <div class="status-item">
    <span class="status-label">Zoom:</span>
    <span class="status-value" id="statusZoom">-</span>
  </div>
  <div class="status-sep">|</div>
  <div class="status-item">
    <span class="status-label">タイル:</span>
    <span class="status-value" id="statusTile">地形図</span>
  </div>
  <div class="status-sep">|</div>
  <div class="status-item">
    <span class="status-label">Supabase:</span>
    <span class="status-value status-conn" id="statusConn">確認中...</span>
  </div>
  <div class="status-sep">|</div>
  <div class="status-item">
    <span class="status-label">ユーザー:</span>
    <span class="status-value" id="statusUser">-</span>
  </div>
</div>

<script>
/* ==========================================================================
   cad-editor.html - Track A Step 2 骨組み
   BUILD: v20260707a
   スコープ:
     - 地図表示（GSI地形図/衛星、Esri衛星の3切替）
     - 認証（common-auth.js経由）
     - Supabase接続確認
     - 既存 villa_overlays 表示
     - overlays テーブル読み込み（Step 3以降で書き込み）
   未実装（スタブ）:
     - 下絵アップロード → Step 3
     - 基準点指定・変換 → Step 4-6
     - 描画機能 → Track B
   ========================================================================== */

let map = null;
let currentTile = 'std';
let tileLayers = {};
let overlaysGroup = null;      // overlays テーブル用（Step 3で実装）
let villaOverlaysGroup = null; // 既存 villa_overlays 表示用
let sb = null;                 // Supabase クライアント

/* ========================================================================
   タイル定義（field-survey.html と統一）
   ======================================================================== */
const TILE_URLS = {
  std:        'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
  photo_gsi:  'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
  photo_esri: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
};
const TILE_LABELS = {
  std: '地形図',
  photo_gsi: 'GSI衛星',
  photo_esri: 'Esri衛星'
};

/* ========================================================================
   地図初期化
   ======================================================================== */
function initMap() {
  if (map) return;

  // URLパラメータで初期位置指定可能 ?lat=X&lng=Y&zoom=Z
  const params = new URLSearchParams(location.search);
  const initLat  = parseFloat(params.get('lat'))  || 35.337; // びわこの森中心付近
  const initLng  = parseFloat(params.get('lng'))  || 135.972;
  const initZoom = parseInt(params.get('zoom'))   || 15;

  map = L.map('map', {
    zoomControl: true,
    zoomSnap: 0.25,
    zoomDelta: 0.5,
    maxZoom: 22
  }).setView([initLat, initLng], initZoom);

  // 3種のベースタイルを準備
  tileLayers.std        = L.tileLayer(TILE_URLS.std,        { attribution: '© 国土地理院', maxZoom: 22, maxNativeZoom: 18 });
  tileLayers.photo_gsi  = L.tileLayer(TILE_URLS.photo_gsi,  { attribution: '© 国土地理院', maxZoom: 22, maxNativeZoom: 18 });
  tileLayers.photo_esri = L.tileLayer(TILE_URLS.photo_esri, { attribution: 'Tiles © Esri', maxZoom: 22, maxNativeZoom: 19 });

  // 初期タイル
  tileLayers[currentTile].addTo(map);

  // レイヤーグループ準備
  overlaysGroup = L.layerGroup().addTo(map);
  villaOverlaysGroup = L.layerGroup().addTo(map);

  // ステータス連動
  map.on('mousemove', (e) => {
    document.getElementById('statusCoord').textContent =
      e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6);
  });
  map.on('zoomend', () => {
    document.getElementById('statusZoom').textContent = map.getZoom().toFixed(2);
  });
  document.getElementById('statusZoom').textContent = map.getZoom().toFixed(2);
}

/* ========================================================================
   タイル切替
   ======================================================================== */
function switchTile(name) {
  if (!map || !tileLayers[name]) return;
  map.removeLayer(tileLayers[currentTile]);
  tileLayers[name].addTo(map);
  currentTile = name;
  document.querySelectorAll('.tile-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tile === name);
  });
  document.getElementById('statusTile').textContent = TILE_LABELS[name];
}

/* ========================================================================
   Supabase 初期化
   ======================================================================== */
function initSupabase() {
  if (!window.__auth || !window.__auth.sb) {
    setStatusConn('err', '認証待ち');
    return false;
  }
  sb = window.__auth.sb;
  setStatusConn('ok', 'OK');

  // ユーザー情報表示
  const p = window.__auth.profile;
  if (p) {
    document.getElementById('statusUser').textContent =
      (p.display_name || p.email || '?') + ' (' + (p.role || '?') + ')';
  }
  return true;
}
function setStatusConn(kind, text) {
  const el = document.getElementById('statusConn');
  el.className = 'status-value status-conn ' + kind;
  el.textContent = text;
}

/* ========================================================================
   既存 villa_overlays 表示（びわこの森・びわこ台の locked=true 座標）
   メモリ「villa_overlays 正解座標」に基づき、DB から取得して重ねる
   ======================================================================== */
async function loadVillaOverlays() {
  if (!sb) return;
  try {
    const { data, error } = await sb
      .from('villa_overlays')
      .select('*')
      .eq('visible', true);
    if (error) throw error;

    document.getElementById('villaOverlaysCount').textContent = (data?.length ?? 0);

    (data || []).forEach(v => {
      if (v.tl_lat == null || v.tr_lat == null || v.bl_lat == null || v.br_lat == null) return;
      // 4隅を polygon として描画（Step 2 は表示のみ、変換等は Step 5-6）
      const poly = L.polygon([
        [v.tl_lat, v.tl_lng],
        [v.tr_lat, v.tr_lng],
        [v.br_lat, v.br_lng],
        [v.bl_lat, v.bl_lng]
      ], {
        color: '#f0b429',
        weight: 2,
        fillOpacity: (v.opacity ?? 0.3) * 0.5,
        fillColor: '#f0b429'
      }).bindPopup(
        '<b>' + (v.villa_name || '(名称なし)') + '</b><br>' +
        'opacity: ' + (v.opacity ?? '-') + '<br>' +
        'rotation: ' + (v.rotation_deg ?? '-') + '°<br>' +
        'locked: ' + (v.locked ? '🔒' : '🔓')
      );
      villaOverlaysGroup.addLayer(poly);
    });
  } catch (e) {
    console.error('[loadVillaOverlays]', e);
    document.getElementById('villaOverlaysCount').textContent = 'ERR';
  }
}

/* ========================================================================
   overlays テーブル読み込み（Step 3以降で書き込みUI追加）
   ======================================================================== */
async function loadOverlays() {
  if (!sb) return;
  try {
    const { data, error } = await sb
      .from('overlays')
      .select('id, name, visible')
      .eq('visible', true);
    if (error) throw error;
    document.getElementById('overlaysCount').textContent = (data?.length ?? 0);
    // Step 3で実際の描画処理を追加
  } catch (e) {
    console.error('[loadOverlays]', e);
    document.getElementById('overlaysCount').textContent = 'ERR';
  }
}

/* ========================================================================
   レイヤー ON/OFF
   ======================================================================== */
function toggleOverlaysLayer(on) {
  if (!map || !overlaysGroup) return;
  if (on) map.addLayer(overlaysGroup); else map.removeLayer(overlaysGroup);
}
function toggleVillaOverlaysLayer(on) {
  if (!map || !villaOverlaysGroup) return;
  if (on) map.addLayer(villaOverlaysGroup); else map.removeLayer(villaOverlaysGroup);
}

/* ========================================================================
   戻るボタン（mode-back.js が存在すれば任せる、なければ main.html）
   ======================================================================== */
function goBack() {
  if (window.history.length > 1) history.back();
  else location.href = 'main.html';
}

/* ========================================================================
   起動シーケンス
   ======================================================================== */
window.addEventListener('DOMContentLoaded', () => {
  initMap();
  // 認証は common-auth.js が非同期で解決するのを待つ
  const tryInit = () => {
    if (window.__auth && window.__auth.sb) {
      if (initSupabase()) {
        loadVillaOverlays();
        loadOverlays();
      }
    } else {
      setTimeout(tryInit, 200);
    }
  };
  tryInit();
});
</script>

</body>
</html>
